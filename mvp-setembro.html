 um empréstimo?", "options": [{"text": "Porque ele combina o efeito de principal, juros e custos aplicáveis ao longo do prazo", "correct": true}, {"text": "Porque mostra seu credit score", "correct": false}, {"text": "Porque garante que o empréstimo cabe no bolso", "correct": false}, {"text": "Porque define se o credor tem seguro", "correct": false}], "feedback": "O valor total pago dá um retrato mais amplo do que a parcela mensal sozinha."}, {"prompt": "Qual afirmação sobre uma parcela mensal menor está correta?", "options": [{"text": "Significa sempre que o empréstimo custa menos", "correct": false}, {"text": "Pode vir de um prazo mais longo e aumentar o total de juros pagos", "correct": true}, {"text": "Garante um APR menor", "correct": false}, {"text": "Significa que não há tarifas", "correct": false}], "feedback": "Um prazo mais longo reduz a parcela e aumenta o tempo durante o qual os juros correm."}, {"prompt": "Qual é a melhor primeira fonte para entender as tarifas da sua conta corrente?", "options": [{"text": "Um amigo que usa outro banco", "correct": false}, {"text": "A tabela de tarifas atual e os documentos da sua instituição", "correct": true}, {"text": "Um site de credit score", "correct": false}, {"text": "Uma calculadora de financiamento imobiliário", "correct": false}], "feedback": "As tarifas variam por conta e por instituição, então os documentos atuais da sua conta são a fonte mais relevante."}, {"prompt": "Qual destas ações tem mais chance de reduzir multas por atraso acidental?", "options": [{"text": "Ignorar as faturas mensais", "correct": false}, {"text": "Programar lembretes de pagamento ou débito automático adequado", "correct": true}, {"text": "Abrir várias contas novas", "correct": false}, {"text": "Pagar só quando chega um aviso de cobrança", "correct": false}], "feedback": "Lembretes e pagamentos automáticos bem administrados reduzem o risco de perder uma data de vencimento."}, {"prompt": "Ao comparar dois produtos financeiros, qual fator considerar?", "options": [{"text": "Só a taxa anunciada", "correct": false}, {"text": "Só a anuidade", "correct": false}, {"text": "Taxa, tarifas, momento das cobranças e como você espera usar o produto", "correct": true}, {"text": "Só as recompensas oferecidas", "correct": false}], "feedback": "O custo total depende de vários atributos e do seu comportamento esperado, não de um único número de destaque."}, {"prompt": "Qual afirmação é mais precisa sobre taxas promocionais?", "options": [{"text": "São sempre permanentes", "correct": false}, {"text": "Em geral têm regras, condições e data de validade", "correct": true}, {"text": "Eliminam todas as tarifas", "correct": false}, {"text": "Não exigem pagamento", "correct": false}], "feedback": "Condições promocionais normalmente têm regras e um período definido. Verifique o que acontece quando a promoção termina."}], "quizIntro": "Responda às 12 questões a seguir para testar seu entendimento sobre tarifas e juros. Escolha a melhor resposta para cada uma.", "summary": [{"type": "p", "text": "Neste módulo, você aprendeu:"}, {"type": "ul", "items": ["A diferença entre tarifa e juros, e por que os dois afetam o custo total dos produtos financeiros;", "Como o APR dá uma medida anualizada da taxa de empréstimo e por que o valor em dólares depende dos saldos e do tempo;", "Como carregar saldo aumenta o custo real das compras ao longo do tempo;", "Como multas por atraso e pagamentos perdidos geram custos imediatos e de longo prazo;", "Como surgem tarifas de saldo negativo, pagamento devolvido, manutenção, saque e transferência nas contas bancárias;", "Por que assinaturas e renovações automáticas devem ser avaliadas pelo custo anual;", "Por que tarifas de empréstimo, prazo e valor total pago importam na comparação de opções de crédito;", "Um roteiro de quatro perguntas para comparar produtos financeiros pelo custo total esperado;", "Enganos comuns sobre tarifas e juros e a visão mais precisa de cada um."]}], "reflection": ["Você já foi cobrado por uma tarifa que não entendeu direito na hora? Qual foi?", "Se você carrega saldo hoje em um cartão ou outra conta rotativa, sabe o APR aproximado e quanto custa manter esse saldo?", "Qual tarifa ou cobrança de juros você conseguiria reduzir ou eliminar com uma mudança específica de comportamento?"], "actionTask": {"title": "Faça uma auditoria das suas tarifas dos últimos 3 meses", "steps": ["Revise os extratos dos últimos três meses do banco e do cartão e identifique toda tarifa ou cobrança de juros que apareceu.", "Liste cada cobrança e identifique o que a disparou. Marque se ela parece evitável, recorrente ou ligada a um empréstimo.", "Tome uma ação concreta para impedir que a cobrança evitável mais frequente ou mais cara se repita."]}, "disclaimer": "Este módulo é educacional e foi feito para ajudar você a entender tarifas comuns, custos de empréstimo e cobranças financeiras recorrentes. Ele não constitui aconselhamento jurídico, financeiro, de investimento, bancário ou de reparação de crédito. Para orientação sobre a sua situação específica, consulte um profissional qualificado.", "practiceIntro": "Para encerrar este módulo, reserve alguns minutos para refletir sobre o que aprendeu antes de fazer a tarefa prática. Não existem respostas certas ou erradas. O objetivo é conectar o conteúdo à sua própria situação financeira.", "taskPurpose": "Aplicar o que você aprendeu neste módulo à sua própria situação financeira, por meio de uma ação concreta e de baixo risco nesta semana.", "taskInstruction": "Faça os três passos a seguir antes do fim da semana:"}, "5": {"n": 5, "title": "Estratégias de educação sobre dívida", "subtitle": "Roteiros práticos para avaliar decisões de dívida, comparar cenários de pagamento e entender o custo real do crédito caro.", "meta": "10 Lições · 12 Questões · 1 Tarefa prática · Tempo estimado: 35 minutos · Nível: Intermediário", "overview": [{"type": "p", "text": "A dívida pode ser útil, necessária, cara ou perigosa, dependendo do motivo pelo qual foi contraída, do quanto custa e de o plano de pagamento caber no orçamento real. O problema raramente é uma dívida isolada. É a interação entre taxa, saldo, prazo, fluxo de caixa e a possibilidade de o endividamento novo continuar enquanto os saldos antigos permanecem."}, {"type": "p", "text": "Este módulo traz um roteiro prático para avaliar uma dívida nova antes de contraí-la, mapear as obrigações existentes, priorizar o pagamento, comparar opções de consolidação e reduzir os comportamentos que transformam um empréstimo de curto prazo em um ciclo longo."}, {"type": "callout", "label": "Objetivo de aprendizagem", "text": "Desenvolver um roteiro para avaliar decisões de dívida e entender como priorizar estratégias de pagamento que reduzem o total de juros ao longo do tempo."}], "lessons": [{"n": 1, "title": "Dívida é um compromisso sobre a renda futura", "blocks": [{"type": "p", "text": "A dívida permite usar dinheiro hoje e pagar com a renda de amanhã. Isso pode ser útil quando o empréstimo financia algo importante ou distribui um custo grande ao longo do tempo, mas toda dívida também cria uma obrigação de pagamento futura."}, {"type": "p", "text": "A pergunta mais útil não é se a dívida é boa ou ruim por natureza. É se ela tem uma finalidade clara, um custo compreensível e um plano de pagamento realista."}, {"type": "table", "head": ["Característica da dívida", "Pergunta a fazer"], "rows": [["Finalidade", "O que estou financiando e por que tomar emprestado faz sentido para esta compra ou necessidade?"], ["Custo", "Qual taxa, quais tarifas e qual valor total vou pagar?"], ["Prazo", "Por quanto tempo essa obrigação vai ficar no meu orçamento?"], ["Capacidade de pagamento", "Consigo pagar a parcela sem sacrificar despesas essenciais nem recorrer a dívida nova?"]]}, {"type": "callout", "label": "Ponto-chave", "text": "Tomar emprestado move parte do gasto de hoje para o orçamento de amanhã. A decisão de se endividar deve ser avaliada antes de o dinheiro ser gasto, não só quando a conta chega."}]}, {"n": 2, "title": "Dívida produtiva, necessária e cara", "blocks": [{"type": "p", "text": "A dívida costuma ser separada em categorias como boa e ruim. Esses rótulos simplificam demais decisões reais. Um roteiro mais útil olha para finalidade, custo, risco e plano de pagamento."}, {"type": "table", "head": ["Situação", "O que avaliar"], "rows": [["Educação ou investimento na carreira", "Benefício esperado, taxa, flexibilidade de pagamento e se existem alternativas mais baratas."], ["Financiamento de casa ou veículo", "Capacidade de pagar, custo total, prazo, seguro e manutenção, e o risco de comprometer renda futura."], ["Empréstimo em emergência", "Se a despesa é mesmo urgente, quanto custa a dívida e como o pagamento vai caber depois que a emergência passar."], ["Consumo rotineiro financiado a APR alto", "Se a compra pode ser adiada, reduzida ou paga com o que você já tem, em vez de virar saldo de longo prazo."]]}, {"type": "p", "text": "A categoria da compra não determina sozinha se a dívida é adequada. Condições e capacidade de pagamento importam."}, {"type": "callout", "label": "Ponto-chave", "text": "A qualidade da dívida depende da decisão, não do rótulo. Uma finalidade razoável ainda fica cara se a taxa ou a estrutura de pagamento for desfavorável."}]}, {"n": 3, "title": "Como a dívida cara vira um ciclo", "blocks": [{"type": "p", "text": "A dívida rotativa de juros altos fica difícil de escapar quando o gasto novo entra mais rápido do que os saldos antigos são pagos. Os juros aumentam o valor que precisa ser quitado, enquanto os pagamentos mínimos fazem o progresso parecer lento."}, {"type": "p", "text": "Um ciclo comum é este:"}, {"type": "table", "head": ["Etapa", "O que acontece"], "rows": [["1. Falta", "O gasto rotineiro supera o dinheiro disponível."], ["2. Empréstimo", "Um cartão ou outra dívida cobre a diferença."], ["3. Juros", "O saldo em aberto fica mais caro com o tempo."], ["4. Menos folga", "Mais da renda do mês seguinte precisa ir para pagamentos de dívida."], ["5. Nova falta", "Sobra menos dinheiro para as despesas correntes, o que pressiona a tomar emprestado de novo."]]}, {"type": "p", "text": "Quebrar o ciclo costuma exigir trabalhar nos dois lados ao mesmo tempo: reduzir o custo ou o saldo da dívida existente e reduzir a necessidade de novos empréstimos."}, {"type": "callout", "label": "Ponto-chave", "text": "Pagar dívida sem mudar o problema de fluxo de caixa que a criou costuma trazer o mesmo saldo de volta."}]}, {"n": 4, "title": "Pagamento mínimo e tempo de quitação", "blocks": [{"type": "p", "text": "O pagamento mínimo é o menor valor exigido para manter a conta em dia segundo as condições do contrato. Ele não é necessariamente uma estratégia de quitação."}, {"type": "p", "text": "Quando a taxa de juros é alta e o pagamento é pequeno, boa parte dele pode ir para juros em vez de reduzir o principal. Isso estica bastante o tempo de pagamento."}, {"type": "p", "text": "Sua fatura ou o contrato do empréstimo pode mostrar quanto tempo a quitação levaria com diferentes valores de pagamento. Olhar esses documentos torna mais concreta a troca entre o que cabe no mês e o custo total."}, {"type": "callout", "label": "Nota educacional", "text": "Fazer pelo menos o pagamento exigido em todas as dívidas continua sendo essencial. Qualquer estratégia de pagamento extra deve começar só depois que os pagamentos obrigatórios e os custos essenciais de vida estiverem cobertos."}]}, {"n": 5, "title": "Avaliando uma decisão de dívida", "blocks": [{"type": "p", "text": "Antes de assumir uma dívida nova, três perguntas ajudam a decidir se a decisão faz sentido financeiro."}, {"type": "table", "head": ["Pergunta", "Por que importa"], "rows": [["Qual é o custo total?", "Considere principal, juros, tarifas e o valor total pago ao longo do prazo."], ["Dá para evitar?", "Esperar, poupar, reduzir a compra ou usar um recurso que você já tem poderia substituir parte ou todo o empréstimo?"], ["Qual é o plano de saída?", "Saiba como e quando a dívida termina, incluindo o valor da parcela e a data prevista de quitação."]]}, {"type": "p", "lead": "Uma quarta pergunta fortalece o roteiro:", "text": "o que acontece se minha renda ou minhas despesas mudarem? Uma parcela confortável hoje pode ficar difícil se o orçamento não tiver nenhuma folga."}, {"type": "callout", "label": "Princípio-chave", "text": "Dívida não é ruim por natureza. Depende do custo, da finalidade, do risco e de você ter um plano claro de pagamento antes de tomar emprestado."}]}, {"n": 6, "title": "Mapeie seu quadro atual de dívidas", "blocks": [{"type": "p", "text": "A dívida fica mais fácil de administrar quando está visível em um só lugar. Monte um mapa simples usando a fatura ou o extrato mais recente de cada obrigação."}, {"type": "table", "head": ["Dívida", "Saldo", "APR / taxa", "Pagamento mínimo", "Tipo de taxa", "Observações"], "rows": [["Cartão A", "US$ 3.200", "24%", "US$ 95", "Variável", "Saldo rotativo"], ["Financiamento do carro", "US$ 14.500", "6,5%", "US$ 420", "Fixa", "Faltam 36 parcelas"], ["Empréstimo estudantil", "US$ 8.000", "5,0%", "US$ 110", "Fixa", "Exemplo ilustrativo"]]}, {"type": "p", "text": "Os números acima são apenas exemplos. Para o seu próprio mapa, use extratos reais e inclua todas as obrigações pelas quais você é responsável."}, {"type": "p", "text": "Campos úteis incluem saldo, APR ou taxa de juros, pagamento mínimo, data de vencimento, se a taxa é fixa ou variável e eventual período promocional."}, {"type": "callout", "label": "Ponto-chave", "text": "O mapa de dívidas transforma um problema emocional em um conjunto de saldos, taxas e obrigações mensuráveis."}]}, {"n": 7, "title": "Priorizando o pagamento: avalanche e bola de neve", "blocks": [{"type": "p", "text": "Depois de fazer o pagamento exigido em todas as dívidas, dois roteiros conhecidos ajudam a decidir para onde vai um pagamento extra."}, {"type": "table", "head": ["Método", "Como funciona", "Troca envolvida"], "rows": [["Avalanche", "Direciona os pagamentos extras para a dívida de maior APR e depois para a seguinte.", "Em geral reduz ao máximo o total de juros quando os demais fatores são iguais."], ["Bola de neve", "Direciona os pagamentos extras para o menor saldo e depois soma esse valor ao saldo seguinte.", "Gera vitórias visíveis mais rápido, o que algumas pessoas acham motivador."]]}, {"type": "p", "text": "Nenhum dos dois dispensa manter todas as contas em dia. A melhor estratégia de comportamento é aquela que você consegue seguir de forma consistente, sem criar dívida nova em outro ponto do orçamento."}, {"type": "callout", "label": "Ponto-chave", "text": "A avalanche olha para o custo de juros do ponto de vista matemático; a bola de neve olha para o progresso visível do ponto de vista comportamental. A consistência conta nos dois casos."}]}, {"n": 8, "title": "Consolidação, refinanciamento e transferências promocionais", "blocks": [{"type": "p", "text": "Consolidação ou refinanciamento podem reduzir o custo quando um produto novo substitui dívida mais cara por uma taxa efetiva menor. Mas transferir um saldo não reduz a dívida sozinho."}, {"type": "p", "text": "Antes de refinanciar ou transferir dívida, revise:"}, {"type": "ul", "items": ["O novo APR e se ele é fixo, variável ou promocional;", "Tarifas de abertura, de transferência ou de fechamento;", "O prazo de pagamento e o valor total que se espera pagar;", "Qual taxa passa a valer quando o período promocional termina;", "Se as contas antigas vão continuar disponíveis para novos gastos;", "Se a nova parcela cabe de fato no seu orçamento."]}, {"type": "p", "text": "Uma parcela menor ajuda o fluxo de caixa, mas um prazo mais longo aumenta o total de juros pagos. Compare a estrutura inteira."}, {"type": "callout", "label": "Ponto-chave", "text": "A consolidação muda a estrutura da dívida. Ela não resolve o padrão de gasto ou de fluxo de caixa que está por trás, a menos que esse padrão também mude."}]}, {"n": 9, "title": "Evitar dívida nova enquanto paga a antiga", "blocks": [{"type": "p", "text": "Pagar dívida é mais difícil quando toda despesa inesperada cria um saldo novo. Uma reserva pequena de dinheiro ajuda a separar os imprevistos rotineiros do endividamento."}, {"type": "p", "text": "Criar um pouco de atrito também reduz o endividamento por impulso:"}, {"type": "ul", "items": ["Faça uma pausa antes de financiar compras não essenciais e compare o custo total com o preço à vista;", "Remova os dados do cartão salvos em sites de compra se a compra em um clique virou hábito;", "Mantenha uma reserva pequena de emergência ou de fluxo de caixa, para que custos inesperados menores não virem dívida na hora;", "Use o orçamento do Módulo 3 para planejar despesas recorrentes e irregulares;", "Quando uma dívida for quitada, decida com antecedência para onde vai a parcela que ficou livre."]}, {"type": "callout", "label": "Ponto-chave", "text": "Um plano de pagamento funciona melhor quando o endividamento novo também é tratado. Sem isso, a dívida muda de conta sem de fato diminuir."}]}, {"n": 10, "title": "Sinais de alerta e quando pedir ajuda", "blocks": [{"type": "p", "text": "Problemas com dívida são mais fáceis de resolver antes de virarem emergência. Entre os sinais de alerta:"}, {"type": "ul", "items": ["Perder pagamentos exigidos ou pagá-los com atraso de forma repetida;", "Usar uma dívida para pagar outra;", "Depender de crédito para despesas essenciais todo mês porque a renda já está comprometida;", "Receber avisos de cobrança ou evitar olhar as faturas porque os saldos parecem grandes demais;", "Usar saques no cartão ou crédito caro repetidamente para cobrir despesas comuns do mês."]}, {"type": "p", "text": "Se você está com dificuldade para pagar, procurar os credores cedo pode revelar opções de renegociação ou condições especiais. Organizações de credit counseling sem fins lucrativos também podem oferecer orientação e apoio estruturado. Desconfie de qualquer empresa que prometa eliminação garantida de dívidas, peça para você parar de falar com os credores sem explicar os riscos, ou exija pagamentos altos adiantados sem serviços claros."}, {"type": "callout", "label": "Atenção", "text": "Administração de dívidas, acordos, falência e direitos legais envolvem consequências que dependem da situação individual. Este módulo não oferece aconselhamento jurídico."}]}], "quiz": [{"prompt": "Qual afirmação descreve melhor o que é dívida?", "options": [{"text": "Dinheiro que nunca precisa ser devolvido", "correct": false}, {"text": "Um compromisso sobre a renda futura, criado ao tomar emprestado hoje", "correct": true}, {"text": "Qualquer despesa paga com cartão", "correct": false}, {"text": "Apenas o saldo de cartão de crédito com juros altos", "correct": false}], "feedback": "A dívida permite usar dinheiro hoje em troca de uma obrigação de pagamento no futuro."}, {"prompt": "Qual combinação é mais útil para avaliar uma decisão de dívida?", "options": [{"text": "Finalidade, custo, risco e plano de pagamento", "correct": true}, {"text": "Pontos do cartão, limite e cor do cartão", "correct": false}, {"text": "Apenas a parcela mensal", "correct": false}, {"text": "Apenas a renda", "correct": false}], "feedback": "A decisão de se endividar é mais ampla que a parcela mensal. Finalidade, custo total, risco e plano de pagamento importam."}, {"prompt": "Como um ciclo de dívida cara se forma?", "options": [{"text": "Os juros reduzem o saldo automaticamente", "correct": false}, {"text": "Novos empréstimos cobrem a falta de caixa enquanto os juros encarecem os saldos antigos", "correct": true}, {"text": "Os pagamentos mínimos sempre eliminam o principal rapidamente", "correct": false}, {"text": "Os limites de crédito caem todo mês", "correct": false}], "feedback": "Quando o endividamento novo continua enquanto os juros correm sobre os saldos antigos, mais da renda futura fica comprometida com dívida."}, {"prompt": "O que é o pagamento mínimo?", "options": [{"text": "O valor ideal a pagar todo mês", "correct": false}, {"text": "O menor pagamento exigido pelas condições da conta", "correct": true}, {"text": "O valor que elimina todos os juros", "correct": false}, {"text": "O saldo total devido", "correct": false}], "feedback": "O pagamento mínimo é uma exigência para manter a conta em dia; não é necessariamente uma estratégia eficiente de quitação."}, {"prompt": "Antes de assumir uma dívida, qual pergunta faz parte do roteiro de três perguntas?", "options": [{"text": "Qual é o custo total?", "correct": true}, {"text": "Quantos pontos eu vou acumular?", "correct": false}, {"text": "Meu limite vai aumentar?", "correct": false}, {"text": "Posso ignorar o vencimento?", "correct": false}], "feedback": "O custo total é uma das perguntas centrais, junto com a possibilidade de evitar o empréstimo e o plano de saída."}, {"prompt": "Que informações entram em um mapa de dívidas?", "options": [{"text": "Saldo, APR ou taxa, pagamento mínimo e condições relevantes", "correct": true}, {"text": "Apenas o preço original da compra", "correct": false}, {"text": "Apenas a data de vencimento", "correct": false}, {"text": "Apenas o credit score ligado à conta", "correct": false}], "feedback": "Um mapa útil torna cada obrigação mensurável, listando saldo, taxa, pagamento exigido, vencimento e condições relevantes."}, {"prompt": "Qual método de quitação ataca mais diretamente o custo total de juros quando os demais fatores são iguais?", "options": [{"text": "Avalanche", "correct": true}, {"text": "Bola de neve", "correct": false}, {"text": "Pagar valores extras iguais em todas as contas para sempre", "correct": false}, {"text": "Abrir um cartão novo para cada saldo", "correct": false}], "feedback": "O método avalanche direciona os pagamentos extras para a dívida de maior APR e costuma reduzir ao máximo o total de juros quando os demais fatores são iguais."}, {"prompt": "Qual é a principal vantagem comportamental do método bola de neve?", "options": [{"text": "Sempre produz o menor total de juros", "correct": false}, {"text": "Gera vitórias visíveis mais rápido ao eliminar primeiro os saldos menores", "correct": true}, {"text": "Elimina os pagamentos exigidos nas outras dívidas", "correct": false}, {"text": "Converte dívida em poupança", "correct": false}], "feedback": "A bola de neve traz motivação pelo progresso visível, ainda que possa não reduzir os juros com a mesma eficiência da avalanche."}, {"prompt": "Qual afirmação sobre consolidação de dívida é mais precisa?", "options": [{"text": "Ela elimina a dívida automaticamente", "correct": false}, {"text": "Ela pode mudar a taxa e a estrutura de pagamento, mas a dívida ainda precisa ser paga", "correct": true}, {"text": "Ela garante um custo total menor", "correct": false}, {"text": "Ela elimina a necessidade de um orçamento", "correct": false}], "feedback": "A consolidação muda a estrutura da dívida. Se o custo total cai depende da taxa, das tarifas, do prazo e do comportamento de pagamento."}, {"prompt": "Por que uma reserva pequena de dinheiro ajuda no pagamento de dívidas?", "options": [{"text": "Porque aumenta o APR das suas dívidas", "correct": false}, {"text": "Porque reduz a necessidade de tomar emprestado de novo por causa de imprevistos pequenos", "correct": true}, {"text": "Porque garante que os credores vão baixar sua taxa", "correct": false}, {"text": "Porque elimina todas as despesas recorrentes", "correct": false}], "feedback": "Uma reserva de caixa impede que um imprevisto pequeno vire dívida nova de imediato."}, {"prompt": "Qual é um sinal de alerta de que a dívida pode estar ficando difícil de administrar?", "options": [{"text": "Revisar suas faturas todo mês", "correct": false}, {"text": "Usar uma dívida para pagar outra", "correct": true}, {"text": "Pagar mais que o mínimo quando dá", "correct": false}, {"text": "Comparar taxas antes de tomar emprestado", "correct": false}], "feedback": "Tomar emprestado para pagar outro empréstimo pode indicar que os pagamentos de dívida já passaram do caixa disponível."}, {"prompt": "Quando você prevê dificuldade para fazer um pagamento exigido, o que costuma ser mais construtivo do que ignorar a conta?", "options": [{"text": "Procurar o credor cedo para perguntar sobre as opções disponíveis", "correct": true}, {"text": "Fazer outro empréstimo caro sem comparar condições", "correct": false}, {"text": "Parar todos os pagamentos sem avaliar as consequências", "correct": false}, {"text": "Tirar a conta do seu orçamento", "correct": false}], "feedback": "Procurar o credor antes de a conta ficar mais atrasada pode revelar alternativas. A disponibilidade e as condições variam de credor para credor."}], "quizIntro": "Responda às 12 questões a seguir para testar seu entendimento sobre decisões de dívida e estratégias de pagamento. Escolha a melhor resposta para cada uma.", "summary": [{"type": "p", "text": "Neste módulo, você aprendeu:"}, {"type": "ul", "items": ["Por que a dívida é melhor avaliada por finalidade, custo, risco e plano de pagamento do que por um simples rótulo de dívida boa ou ruim;", "Como o crédito caro cria um ciclo em que a renda futura fica cada vez mais comprometida com saldos antigos;", "Por que os pagamentos mínimos mantêm as contas em dia mas podem não produzir uma quitação eficiente;", "Um roteiro de três perguntas para avaliar uma dívida nova: custo total, possibilidade de evitar e plano de saída;", "Como montar um mapa de dívidas com saldos, taxas, pagamentos mínimos e condições das contas;", "A diferença entre os métodos avalanche e bola de neve e a troca que cada um envolve;", "Como avaliar consolidação, refinanciamento e transferências promocionais por taxa, tarifas, prazo e comportamento;", "Por que uma reserva de caixa e um pouco de atrito nos gastos reduzem o risco de substituir dívida paga por dívida nova;", "Sinais de alerta comuns de que a dívida está ficando difícil de administrar e por que agir cedo faz diferença."]}], "reflection": ["Qual decisão de dívida no seu passado mais te ensinou sobre o custo real de tomar emprestado?", "Se você tem dívida hoje, qual saldo cria mais pressão no seu orçamento mensal, e isso acontece pelo tamanho dele, pela taxa ou pela parcela exigida?", "Qual mudança de comportamento ou de planejamento reduziria sua necessidade de tomar emprestado de novo enquanto paga a dívida atual?"], "actionTask": {"title": "Mapeie seu quadro atual de dívidas", "steps": ["Liste todas as dívidas que você tem hoje, com saldo, APR ou taxa de juros, pagamento mínimo e data de vencimento de cada uma. Se você não tem dívida no momento, use um exemplo realista para praticar o roteiro.", "Identifique qual dívida tem o maior APR e estime o que essa taxa significa no custo de manter o saldo.", "Identifique um valor pequeno que você conseguiria direcionar à sua prioridade de pagamento neste mês, sem deixar de fazer os pagamentos exigidos nem cortar despesas essenciais."]}, "disclaimer": "Este módulo é educacional e foi feito para ajudar você a entender custos de dívida, roteiros de pagamento e escolhas comuns de administração de dívidas. Ele não constitui aconselhamento jurídico, financeiro, de investimento, de acordo de dívida, de falência ou de reparação de crédito. Para orientação sobre a sua situação específica, consulte um profissional qualificado das áreas financeira ou jurídica.", "practiceIntro": "Para encerrar este módulo, reserve alguns minutos para refletir sobre o que aprendeu antes de fazer a tarefa prática. Não existem respostas certas ou erradas. O objetivo é conectar o conteúdo à sua própria situação financeira.", "taskPurpose": "Aplicar o que você aprendeu neste módulo à sua própria situação financeira, por meio de uma ação concreta e de baixo risco nesta semana.", "taskInstruction": "Faça os três passos a seguir antes do fim da semana:"}, "6": {"n": 6, "title": "Hábitos de poupança e objetivos", "subtitle": "Construir hábitos consistentes de poupança, estratégias de reserva de emergência e como automatizar a disciplina financeira na sua rotina.", "meta": "9 Lições · 10 Questões · 1 Tarefa prática · Tempo estimado: 30 minutos · Nível: Intermediário", "overview": [{"type": "p", "text": "Poupar costuma ser tratado como o que sobra depois que tudo foi pago. Esse jeito faz a poupança depender de memória, de motivação e de o mês ter corrido bem. Um caminho mais confiável trata a poupança como um sistema: uma finalidade clara, uma meta realista, um lugar para guardar o dinheiro e um método repetível para levar dinheiro até o objetivo."}, {"type": "p", "text": "Este módulo explica como a reserva de emergência difere da poupança planejada, como transformar um objetivo em um número mensal, por que a automação reduz o atrito comportamental, como começar com um valor sustentável e como ajustar o sistema quando a renda é irregular ou as prioridades mudam."}, {"type": "callout", "label": "Objetivo de aprendizagem", "text": "Construir um hábito sustentável de poupança, entendendo como automação, definição de objetivos e planejamento da reserva de emergência reduzem a vulnerabilidade financeira ao longo do tempo."}], "lessons": [{"n": 1, "title": "Por que poupar importa", "blocks": [{"type": "p", "text": "A poupança cria distância entre uma despesa inesperada e uma dívida nova. Ela também dá mais liberdade para decisões planejadas: trocar de emprego, cobrir uma franquia, trocar um computador, mudar de casa, pagar um curso ou aproveitar uma oportunidade sem depender só do crédito."}, {"type": "p", "text": "A poupança cumpre três funções diferentes:"}, {"type": "table", "head": ["Função", "Finalidade"], "rows": [["Proteção", "Cria uma folga para despesas inesperadas ou interrupção temporária de renda."], ["Planejamento", "Separa dinheiro para custos futuros conhecidos, como viagem, seguro anual, educação ou uma compra grande."], ["Escolha", "Dá flexibilidade para decidir sem precisar financiar cada despesa."]]}, {"type": "callout", "label": "Ponto-chave", "text": "Poupar não é só render juros. O primeiro valor financeiro da poupança é a flexibilidade: ter dinheiro disponível quando o tempo da vida não bate com o tempo do salário."}]}, {"n": 2, "title": "Reserva de emergência, sinking funds e poupança por objetivo", "blocks": [{"type": "p", "text": "Objetivos de poupança diferentes não devem ficar todos no mesmo bolo de dinheiro."}, {"type": "table", "head": ["Tipo de poupança", "Para que serve", "Exemplo"], "rows": [["Reserva de emergência", "Despesas inesperadas ou interrupção de renda", "Conserto urgente do carro; perda temporária de emprego; conta médica inesperada"], ["Sinking fund", "Uma despesa conhecida que vai acontecer mais adiante", "Seguro anual; licenciamento do veículo; gastos de fim de ano"], ["Poupança por objetivo", "Um objetivo futuro específico", "Educação; custos de mudança; uma compra planejada; viagem"]]}, {"type": "p", "text": "A distinção importa porque o dinheiro destinado a uma emergência some rápido se ele também for usado para contas anuais previsíveis. Rótulos claros ajudam a proteger a finalidade de cada saldo."}, {"type": "callout", "label": "Ponto-chave", "text": "A reserva de emergência cobre o que você não consegue prever. O sinking fund cobre o que você prevê, mas não paga todo mês."}]}, {"n": 3, "title": "Transforme um objetivo em um número mensal", "blocks": [{"type": "p", "text": "Um objetivo de poupança fica mais concreto quando tem três elementos: um valor específico, uma data e uma finalidade."}, {"type": "p", "text": "Exemplo: você quer US$ 1.200 para um curso profissional em doze meses. Dividindo US$ 1.200 por 12, a meta mensal fica em US$ 100. Se você já tem US$ 300 guardados, falta US$ 900, ou US$ 75 por mês ao longo de doze meses."}, {"type": "table", "head": ["Objetivo", "Valor alvo", "Tempo disponível", "Valor mensal ilustrativo"], "rows": [["Primeira etapa da reserva de emergência", "US$ 600", "6 meses", "US$ 100"], ["Prêmio anual de seguro", "US$ 1.200", "12 meses", "US$ 100"], ["Fundo para mudança", "US$ 2.400", "12 meses", "US$ 200"]]}, {"type": "p", "text": "O valor mensal não é um compromisso impossível de mudar. É um número de planejamento. Se a renda mudar, você pode mudar a data, o valor, ou os dois."}, {"type": "callout", "label": "Ponto-chave", "text": "Um objetivo sem número e sem data é fácil de adiar. Converter o objetivo em um valor mensal transforma a intenção em um comportamento repetível."}]}, {"n": 4, "title": "Por que a automação sustenta o hábito de poupar", "blocks": [{"type": "p", "text": "Poupar com consistência fica mais difícil quando exige uma decisão nova todo mês. A automação tira parte dessa decisão e aproxima a poupança de um comportamento padrão."}, {"type": "table", "head": ["Abordagem", "Confiabilidade"], "rows": [["Transferência manual todo mês", "Depende de memória e de motivação a cada mês."], ["Transferência automática no dia do pagamento", "Consistente e reduz a chance de o dinheiro ser gasto antes."], ["Divisão da folha pelo empregador, quando disponível", "Direciona parte da renda para a poupança antes de ela chegar à conta de gastos."], ["Arredondamento ou transferência por regra", "Cria poupança gradual e de baixo atrito, embora os valores possam ser pequenos ou variáveis."]]}, {"type": "p", "text": "A automação ainda assim precisa ser revisada. Uma transferência automática que vive causando saldo negativo ou obrigando você a tomar emprestado está agressiva demais para o fluxo de caixa atual."}, {"type": "callout", "label": "Ponto-chave", "text": "A automação reduz a necessidade de força de vontade repetida. O melhor valor automático é aquele sustentável o bastante para continuar."}]}, {"n": 5, "title": "Comece pequeno e aumente o hábito", "blocks": [{"type": "p", "text": "Muita gente adia a poupança porque o valor possível parece pequeno demais. Isso transforma uma limitação temporária em um adiamento permanente."}, {"type": "p", "text": "Começar com US$ 10, US$ 25 ou outro valor realista é útil porque constrói a rotina primeiro. O valor pode subir depois, quando a renda aumentar, uma dívida for quitada, uma despesa recorrente for eliminada ou o orçamento ficar mais estável."}, {"type": "p", "text": "Uma regra simples de escalada é aumentar a poupança depois de um evento positivo de caixa. Por exemplo, quando uma assinatura de US$ 60 por mês for cancelada, você pode direcionar parte ou todo esse valor para a poupança, em vez de deixá-lo se diluir no gasto geral."}, {"type": "callout", "label": "Ponto-chave", "text": "No começo, a consistência importa mais que o tamanho. Um hábito de poupança que sobrevive um ano vale mais que uma meta ambiciosa que para no primeiro mês."}]}, {"n": 6, "title": "Onde guardar a poupança de curto prazo", "blocks": [{"type": "p", "text": "Dinheiro destinado a emergências ou a objetivos próximos costuma precisar de duas qualidades: liquidez e estabilidade. Liquidez é conseguir acessar o dinheiro quando ele é necessário. Estabilidade é o saldo não ficar exposto a grandes oscilações de curto prazo."}, {"type": "p", "text": "Os lugares mais comuns para poupança de curto prazo incluem contas correntes ou de poupança, high-yield savings accounts e outros produtos equivalentes a caixa. Ao usar um banco ou credit union, verifique se a instituição e a conta são cobertas pelo seguro federal de depósito aplicável e entenda os limites legais que valem."}, {"type": "table", "head": ["Característica", "Por que importa"], "rows": [["Acesso", "O dinheiro da emergência precisa estar disponível quando a emergência acontece."], ["Separação", "Uma conta separada reduz o gasto acidental."], ["Rendimento / APY", "Os juros ajudam o saldo a crescer, mas o rendimento é secundário diante do acesso e da estabilidade na reserva de emergência."], ["Tarifas ou saldo mínimo", "Cobranças da conta podem corroer o valor de um saldo pequeno."]]}, {"type": "callout", "label": "Nota educacional", "text": "Investimento de longo prazo e reserva de emergência de curto prazo resolvem problemas diferentes. Este módulo trata de poupança e reservas em caixa, não de escolha de investimentos."}]}, {"n": 7, "title": "Montando a reserva de emergência por etapas", "blocks": [{"type": "p", "text": "Uma meta grande de reserva de emergência parece impossível quando se começa do zero. Uma abordagem por etapas deixa o objetivo mais prático."}, {"type": "table", "head": ["Etapa", "Finalidade"], "rows": [["Etapa 1: primeira folga pequena", "Cobrir um custo inesperado menor sem recorrer na hora a crédito caro."], ["Etapa 2: um mês de despesas essenciais", "Criar espaço para uma interrupção maior ou uma falha temporária de renda."], ["Etapa 3: reserva de prazo mais longo", "Muitos materiais de educação financeira usam alguns meses de despesas essenciais como referência de longo prazo, ajustada pela estabilidade e pelo risco de cada família."]]}, {"type": "p", "text": "Alguns materiais educacionais usam US$ 500 a US$ 1.000 como primeira marca e três a seis meses de despesas essenciais como referência de longo prazo. Não são regras. Uma meta razoável depende da estabilidade da renda, das obrigações da família, da cobertura de seguros, de necessidades de saúde e do acesso a outros recursos."}, {"type": "callout", "label": "Ponto-chave", "text": "A primeira finalidade da reserva de emergência não é alcançar um número perfeito. É reduzir a chance de a próxima despesa inesperada virar dívida cara."}]}, {"n": 8, "title": "Poupar com renda irregular", "blocks": [{"type": "p", "text": "Poupar fica mais difícil quando a renda muda de mês para mês. Uma transferência mensal fixa funciona mal quando um mês é forte e o seguinte é fraco."}, {"type": "p", "text": "Entre as alternativas:"}, {"type": "ul", "items": ["Poupar um percentual de cada pagamento em vez de um valor fixo;", "Basear o gasto essencial em uma estimativa conservadora de renda e direcionar parte dos meses melhores para a poupança;", "Formar uma folga de caixa de um mês antes de buscar objetivos maiores;", "Usar uma revisão trimestral para comparar a renda real com o orçamento e fazer uma transferência adicional quando o caixa permitir."]}, {"type": "p", "text": "O objetivo continua sendo a consistência, mas consistência pode significar seguir a mesma regra, e não transferir o mesmo valor."}, {"type": "callout", "label": "Ponto-chave", "text": "Com renda irregular, uma regra flexível de poupança costuma ser mais sustentável que um valor fixo que só funciona nos melhores meses."}]}, {"n": 9, "title": "Enganos comuns sobre poupança", "blocks": [{"type": "table", "head": ["Engano comum", "Entendimento mais preciso"], "rows": [["Preciso esperar minha renda aumentar para começar a poupar.", "Um valor pequeno e repetível já estabelece o hábito agora e pode crescer depois."], ["Vou poupar o que sobrar no fim do mês.", "Poupar primeiro ou automatizar a transferência evita que o objetivo dependa só das sobras."], ["Reserva de emergência e poupança para compras são a mesma coisa.", "Separar as duas ajuda a proteger o dinheiro da emergência dos gastos previsíveis."], ["Uma reserva de emergência pequena não serve para nada.", "Mesmo uma folga modesta cobre parte ou todo um gasto inesperado menor e reduz a dependência de dívida."], ["O maior rendimento é sempre o melhor lugar para a reserva de emergência.", "Acesso, estabilidade, tarifas e condições da conta importam junto com o rendimento."], ["Depois que automatizo a poupança, nunca mais preciso revisar.", "A automação deve ser ajustada conforme renda, despesas e objetivos mudam."], ["Poupar e investir são a mesma coisa.", "A poupança foca em liquidez e estabilidade de curto prazo; o investimento em geral aceita mais incerteza em troca de objetivos de crescimento de longo prazo."]]}, {"type": "callout", "label": "Ponto-chave", "text": "Poupança é um sistema, não uma meta isolada. O sistema funciona quando objetivo, conta, método de transferência e rotina de revisão combinam com o seu fluxo de caixa real."}]}], "quiz": [{"prompt": "Qual é uma finalidade financeira central da reserva de emergência?", "options": [{"text": "Cobrir despesas inesperadas sem precisar assumir dívida nova de imediato", "correct": true}, {"text": "Maximizar o retorno de investimentos de longo prazo", "correct": false}, {"text": "Pagar apenas despesas anuais previsíveis", "correct": false}, {"text": "Aumentar seu limite de crédito", "correct": false}], "feedback": "A reserva de emergência serve para absorver custos inesperados ou interrupções de renda, para que nem toda surpresa exija um empréstimo novo."}, {"prompt": "Qual a diferença entre um sinking fund e a reserva de emergência?", "options": [{"text": "O sinking fund é para despesas futuras esperadas; a reserva de emergência é para necessidades imprevistas", "correct": true}, {"text": "O sinking fund é investido em ações; a reserva de emergência precisa ser em dinheiro", "correct": false}, {"text": "A reserva de emergência só vale para despesas médicas", "correct": false}, {"text": "Não há diferença", "correct": false}], "feedback": "Sinking funds planejam despesas futuras conhecidas. Reservas de emergência ficam guardadas para eventos que você não consegue prever com exatidão."}, {"prompt": "O que torna um objetivo de poupança mais concreto?", "options": [{"text": "Um valor específico, uma data e uma finalidade", "correct": true}, {"text": "Um limite de crédito alto", "correct": false}, {"text": "Apenas um depósito inicial grande", "correct": false}, {"text": "Usar o mesmo objetivo que todo mundo", "correct": false}], "feedback": "O objetivo fica mais fácil de planejar quando valor, prazo e finalidade estão claros."}, {"prompt": "Por que transferências automáticas sustentam o hábito de poupar?", "options": [{"text": "Elas garantem retornos altos de investimento", "correct": false}, {"text": "Elas reduzem a necessidade de tomar uma decisão nova de poupança a cada mês", "correct": true}, {"text": "Elas eliminam todas as tarifas bancárias", "correct": false}, {"text": "Elas tornam a renda mais previsível", "correct": false}], "feedback": "A automação torna poupar o comportamento padrão e reduz a dependência de memória ou de força de vontade repetida."}, {"prompt": "Qual afirmação descreve melhor começar com um valor pequeno de poupança?", "options": [{"text": "Não adianta a menos que o valor seja grande", "correct": false}, {"text": "Constrói consistência e pode aumentar depois, conforme o caixa melhora", "correct": true}, {"text": "Sempre gera dinheiro suficiente para uma reserva completa em um ano", "correct": false}, {"text": "Impede que você mude o objetivo depois", "correct": false}], "feedback": "Uma transferência pequena e sustentável estabelece o hábito e pode crescer quando a renda ou as despesas mudarem."}, {"prompt": "Quais qualidades costumam ser importantes para a poupança de emergência de curto prazo?", "options": [{"text": "Liquidez e estabilidade", "correct": true}, {"text": "Volatilidade máxima de mercado", "correct": false}, {"text": "Prazos longos de carência", "correct": false}, {"text": "Alta capacidade de endividamento", "correct": false}], "feedback": "A reserva de emergência deve ser acessível e estável, porque o momento da emergência é incerto."}, {"prompt": "Qual é uma forma razoável de montar uma reserva de emergência?", "options": [{"text": "Usar etapas, começando com uma folga menor e aumentando a meta ao longo do tempo", "correct": true}, {"text": "Esperar até conseguir guardar vários meses de despesas de uma vez", "correct": false}, {"text": "Tomar emprestado para formar o saldo da reserva", "correct": false}, {"text": "Usar a reserva de emergência para as contas rotineiras todo mês", "correct": false}], "feedback": "A abordagem por etapas deixa o objetivo mais administrável e já cria proteção relevante pelo caminho."}, {"prompt": "O que funciona melhor para quem tem renda irregular?", "options": [{"text": "Poupar um per }

.fw-signin-left .fw-lang { position: absolute; top: 22px; right: 24px; }
.fw-signin-left { position: relative; }
.fw-main { flex: 1; min-width: 0; }
.fw-page { max-width: 940px; margin: 0 auto; padding: 34px 28px 90px; }

/* ---- primitives ---- */
.fw-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
.fw-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--green); color: #fff; padding: 11px 18px; border-radius: 9px;
  font-size: 14px; font-weight: 500;
}
.fw-btn:hover { background: var(--green-dark); }
.fw-btn:disabled { background: #B7C6C1; cursor: not-allowed; }
.fw-btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.fw-btn.ghost:hover { background: #EEF3F2; }
.fw-btn.quiet { background: transparent; color: var(--muted); padding: 9px 4px; }
.fw-btn.quiet:hover { color: var(--ink); }
.fw-eyebrow { font-size: 12px; color: var(--muted); font-weight: 500; }
.fw-bar { height: 6px; border-radius: 99px; background: #E4EBE9; overflow: hidden; }
.fw-bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .35s ease; }
.fw-tag { font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; }
.fw-tag.done { background: var(--green-tint); color: var(--green-dark); }
.fw-tag.now { background: var(--amber-tint); color: var(--amber); }
.fw-tag.soon { background: #EDF1F0; color: var(--muted); }

/* ---- sign in ---- */
.fw-signin { display: grid; grid-template-columns: 1.05fr .95fr; min-height: 100vh; }

.fw-signin-left .lead { font-size: 15px; line-height: 1.6; max-width: 44ch; color: #AFC4CB; }
.fw-mods { display: flex; flex-direction: column; gap: 9px; margin-top: auto; }

.fw-field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-bottom: 5px; }
.fw-field input {

.fw-form .note { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.fw-form .err { font-size: 12.5px; color: var(--red); }
.fw-agree { display: flex; align-items: flex-start; gap: 9px; font-size: 12.8px; line-height: 1.5; color: var(--ink-soft); cursor: pointer; }
.fw-agree input { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--green); flex: none; cursor: pointer; }
.fw-agree a { color: var(--green); text-decoration: underline; }

/* ---- dashboard ---- */
.fw-hello { font-size: 29px; margin-bottom: 4px; }
.fw-sub { color: var(--muted); font-size: 14.5px; }
.fw-continue { padding: 22px; display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: 24px 0 8px; }

.fw-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0 30px; }
.fw-stat { padding: 15px 16px; }
.fw-stat b { font-family: 'Source Serif 4', Georgia, serif; font-size: 25px; font-weight: 600; display: block; }
.fw-stat small { color: var(--muted); font-size: 12.5px; }
.fw-path { position: relative; padding-left: 30px; }
.fw-path::before { content: ""; position: absolute; left: 11px; top: 12px; bottom: 12px; width: 2px; background: var(--line); }
.fw-step { position: relative; margin-bottom: 12px; }
.fw-dot {
  position: absolute; left: -30px; top: 20px; width: 24px; height: 24px; border-radius: 50%;

}
.fw-dot.done { background: var(--green); border-color: var(--green); color: #fff; }
.fw-dot.open { border-color: var(--green); color: var(--green); }
.fw-modcard { padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; }

.fw-modcard:not(.locked):hover { border-color: #B9CFC7; }
.fw-modcard .ico { font-size: 21px; line-height: 1; margin-top: 2px; }
.fw-modcard h3 { font-size: 17px; }
.fw-modcard p { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin-top: 4px; }
.fw-modmeta { display: flex; align-items: center; gap: 12px; margin-top: 11px; font-size: 12.5px; color: var(--muted); }
.fw-modmeta .fw-bar { width: 120px; }

/* ---- glossary ---- */
.fw-term { padding: 15px 0; }
.fw-term h3 { font-family: 'Source Serif 4', Georgia, serif; }
.fw-term p { font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); margin-top: 5px; max-width: 72ch; }

/* ---- module reader ---- */
.fw-reader { display: grid; grid-template-columns: 232px 1fr; gap: 30px; align-items: start; }
.fw-rail { position: sticky; top: 24px; padding: 8px; }
.fw-rail button {
  display: flex; gap: 9px; align-items: flex-start; width: 100%; text-align: left;
  padding: 8px 9px; border-radius: 7px; font-size: 13px; color: var(--ink-soft); line-height: 1.35;
}
.fw-rail button:hover { background: #F1F5F4; }
.fw-rail button.on { background: var(--green-tint); color: var(--green-dark); font-weight: 500; }
.fw-rail button:disabled { color: #A9B8BF; cursor: not-allowed; }

.fw-rail .num.done { background: var(--green); border-color: var(--green); color: #fff; }

.fw-tablewrap { max-width: 100%; overflow-x: auto; }

  display: flex; gap: 11px; width: 100%; text-align: left; padding: 13px 15px; border: 1px solid var(--line);

}

.fw-opt.sel { border-color: var(--green); background: var(--green-tint); }

.fw-opt.right { border-color: var(--green); background: var(--green-tint); }
.fw-opt.wrong { border-color: var(--red); background: var(--red-tint); }
.fw-fb { border-radius: 9px; padding: 14px 16px; margin-top: 16px; font-size: 14.2px; line-height: 1.6; }
.fw-fb.ok { background: var(--green-tint); color: #123B2E; }
.fw-fb.no { background: var(--red-tint); color: #5E2019; }
.fw-fb b { display: block; margin-bottom: 3px; font-size: 13px; }
.fw-score { font-family: 'Source Serif 4', Georgia, serif; font-size: 52px; font-weight: 600; line-height: 1; }
.fw-review { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 18px; text-align: left; }
.fw-review li { font-size: 13.8px; line-height: 1.55; color: var(--ink-soft); margin-bottom: 12px; }
.fw-review li b { color: var(--ink); }

/* ---- action task ---- */
.fw-task { max-width: 720px; margin: 0 auto; padding: 28px 30px; }
.fw-check { display: flex; gap: 12px; align-items: flex-start; padding: 13px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; font-size: 14.5px; line-height: 1.55; }
.fw-check .box { flex: none; width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid #BCCBD2; display: flex; align-items: center; justify-content: center; margin-top: 1px; }

.fw-refl textarea {
  width: 100%; min-height: 78px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; line-height: 1.55; color: var(--ink); background: #FCFDFD; resize: vertical;

  .fw-shell { display: block; }
  .fw-side { display: none; }
  .fw-topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--ink); color: #fff; padding: 13px 16px; position: sticky; top: 0; z-index: 20;
  }
  .fw-topbar .fw-nav { flex-direction: row; }
  .fw-topbar .fw-nav button { padding: 7px 10px; font-size: 13px; }
  .fw-page { padding: 22px 16px 70px; }
  .fw-signin { grid-template-columns: 1fr; }
  .fw-signin-left { padding: 34px 24px; gap: 20px; }

  .fw-mods { display: none; }
  .fw-signin-right { padding: 28px 24px 48px; }
  .fw-stats { grid-template-columns: repeat(2, 1fr); }
  .fw-reader { grid-template-columns: 1fr; gap: 16px; }
  .fw-rail { position: static; }
  .fw-doc { padding: 22px 18px; }
  .fw-body { font-size: 16px; }

}
