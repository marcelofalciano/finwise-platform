 cuenta más vieja, la de la más reciente y el promedio de todas. Cuanto más largo es el historial, más datos tienen los prestamistas para evaluar tu confiabilidad. Por eso suele no ser recomendable cerrar cuentas antiguas sin necesidad. Variedad de tipos de crédito (10%) Se refiere a los tipos de crédito que tienes, incluyendo el crédito revolvente, como las tarjetas, y el crédito a plazos, como el financiamiento de vehículo, el préstamo estudiantil o el préstamo personal. Tener variedad puede ser una señal positiva, aunque no hace falta abrir cuentas que no necesitas solo para mejorar este factor. Crédito nuevo y hard inquiries (10%) Cuando solicitas un crédito nuevo, el prestamista normalmente hace una hard inquiry en tu credit report. Varias consultas de ese tipo en poco tiempo pueden reducir un poco tu puntaje. Las soft inquiries, como consultar tu propio score, no afectan el puntaje."}]}, {"n": 5, "title": "Construir historial de crédito desde cero", "blocks": [{"type": "p", "text": "Si llegaste hace poco a Estados Unidos o estás empezando ahora en el sistema de crédito estadounidense, es probable que tengas poco o ningún historial. Los caminos a continuación son los más usados para empezar a formar un perfil de crédito. Secured credit cards El secured card exige un depósito en efectivo que normalmente se convierte en tu límite. Como el riesgo para el emisor es bajo, este tipo de tarjeta suele ser accesible para quien no tiene historial. Usar la tarjeta en compras pequeñas y pagar el saldo completo todos los meses es una forma común de empezar a formar historial de pagos. Credit-builder loans Algunas credit unions y bancos comunitarios ofrecen credit-builder loans, préstamos pequeños hechos justamente para ayudar a formar crédito. El monto queda retenido en una cuenta de ahorro mientras pagas las cuotas, y los pagos se informan a los bureaus. Convertirte en authorized user Si tienes un familiar o una persona cercana con un historial de crédito sólido, que te incluyan como authorized user en la tarjeta de esa persona puede hacer que su buen historial de pagos te beneficie. Informar el alquiler y las cuentas de servicios Algunos servicios permiten informar a los bureaus el pago puntual del alquiler y de las cuentas de servicios, lo que ayuda a formar historial incluso sin productos de crédito tradicionales."}, {"type": "callout", "label": "Atención", "text": "Construir crédito toma tiempo. Un buen perfil se forma poco a poco, con pagos puntuales de forma consistente y uso responsable del crédito. No existen atajos que mejoren el puntaje de forma permanente."}]}, {"n": 6, "title": "Entender tu credit report", "blocks": [{"type": "p", "text": "El credit report es el documento a partir del cual se calcula tu credit score. Trae el registro detallado de todas tus cuentas de crédito, historial de pagos, saldos, consultas y registros públicos, como las bancarrotas. Revisar tu reporte con regularidad es un hábito financiero importante. La ley federal garantiza al menos un reporte gratuito cada 12 meses en cada uno de los tres grandes bureaus, y actualmente ellos ponen a disposición reportes gratuitos cada semana por AnnualCreditReport.com."}, {"type": "p", "text": "Qué observar al revisar tu credit report:"}, {"type": "p", "text": "Si encuentras un error en el reporte, tienes derecho a disputarlo ante el bureau. La agencia está obligada a investigar y corregir los errores legítimos."}, {"type": "ul", "items": ["Cuentas que no abriste, lo que puede indicar robo de identidad o fraude;", "Pagos marcados como atrasados que en realidad se hicieron a tiempo, lo que puede ser un error de información;", "Cuentas listadas como abiertas que ya cerraste;", "Datos personales incorrectos, como el nombre, la dirección o el número de Social Security;", "Registros negativos que ya pasaron del plazo de permanencia y no deberían seguir apareciendo."]}]}, {"n": 7, "title": "Proteger tu crédito", "blocks": [{"type": "p", "text": "Proteger el crédito es tan importante como construirlo. El robo de identidad, las cuentas abiertas sin autorización y los errores de información pueden perjudicar tu puntaje incluso cuando tu comportamiento financiero es responsable. Credit freeze Puedes solicitar gratuitamente un security freeze en tu registro en cada bureau, lo que impide que nuevos prestamistas accedan a tu reporte sin tu permiso. Es una de las herramientas más eficaces contra el robo de identidad y las solicitudes de crédito no autorizadas. Fraud alerts El fraud alert avisa a los prestamistas que deben tomar cuidados adicionales en la verificación de tu identidad antes de abrir cuentas nuevas. Basta con avisar a un bureau, que está obligado a comunicarlo a los otros dos. Monitorear el crédito con regularidad Muchos bancos y emisores de tarjetas ya ofrecen monitoreo gratuito del credit score como parte de la cuenta. Usar esos recursos junto con los reportes gratuitos de AnnualCreditReport.com da visibilidad continua sobre tu perfil de crédito."}]}, {"n": 8, "title": "Ideas equivocadas comunes sobre el crédito", "blocks": [{"type": "table", "head": ["Idea equivocada común", "Entendimiento más preciso"], "rows": [["Consultar mi propio score baja el puntaje.", "Consultar tu propio score es una soft inquiry y no afecta el puntaje."], ["Dejar saldo en la tarjeta construye crédito más rápido.", "Pagar el saldo completo todos los meses demuestra uso responsable sin pagar intereses innecesarios."], ["Cerrar tarjetas antiguas mejora mi puntaje.", "Cerrar una tarjeta a veces baja el puntaje, principalmente porque reduce el límite total disponible y puede aumentar tu credit utilization."], ["Necesito ingresos altos para tener buen crédito.", "Los ingresos no entran en el cálculo del credit score."], ["Pagar una cuenta en cobranza la quita del reporte.", "Las cuentas en cobranza ya pagadas todavía pueden aparecer en el reporte hasta por siete años a partir de la fecha original del incumplimiento."], ["Mi score de otro país vale en Estados Unidos.", "Los historiales de crédito en general no se transfieren entre países. En Estados Unidos empiezas desde cero."]]}]}, {"n": 9, "title": "Vocabulario de crédito", "blocks": [{"type": "p", "text": "El sistema de crédito estadounidense usa términos específicos que vale la pena conocer antes de solicitar crédito o revisar tu credit report."}, {"type": "table", "head": ["Término", "Definición"], "rows": [["Annual Percentage Rate (APR)", "El costo anual de tomar dinero prestado, expresado en porcentaje"], ["Credit Limit", "El monto máximo que estás autorizado a usar en una cuenta de crédito"], ["Credit Utilization", "El porcentaje del crédito disponible que estás usando en este momento"], ["Grace Period", "El período después del cierre del estado de cuenta en que puedes pagar el saldo completo sin intereses"], ["Hard Inquiry", "Consulta al crédito que hace un prestamista cuando solicitas crédito; afecta tu puntaje"], ["Soft Inquiry", "Consulta que no afecta el puntaje, como revisar tu propio crédito"], ["Charge-Off", "Cuando el prestamista da de baja la deuda como pérdida; permanece en el reporte hasta por siete años"], ["Credit Freeze", "Restricción puesta en tu registro para impedir la apertura de cuentas nuevas sin autorización"]]}]}, {"n": 10, "title": "Reflexión y tarea práctica", "blocks": [{"type": "p", "text": "Para cerrar este módulo, reserva algunos minutos para reflexionar sobre lo que aprendiste antes de hacer la tarea práctica. No existen respuestas correctas o incorrectas. El objetivo es conectar el contenido con tu propia situación financiera."}, {"type": "callout", "label": "Objetivo de aprendizaje", "text": "Aplicar lo que aprendiste en este módulo a tu propia situación financiera, por medio de una acción concreta y de bajo riesgo esta semana."}]}], "quiz": [{"prompt": "¿Cuál de las opciones describe mejor lo que mide el credit score?", "options": [{"text": "El total de tus ahorros y bienes", "correct": false}, {"text": "Tu confiabilidad para pagar dinero prestado, con base en el comportamiento pasado", "correct": true}, {"text": "Tus ingresos anuales en relación con tus gastos", "correct": false}, {"text": "La cantidad de tarjetas de crédito que tienes hoy", "correct": false}], "feedback": "El credit score resume tu confiabilidad para recibir crédito con base en el historial de administrar dinero prestado y obligaciones de pago. Los ingresos y el patrimonio quedan fuera de ese cálculo."}, {"prompt": "¿Cuál es el nombre del modelo de puntaje de crédito más usado en Estados Unidos?", "options": [{"text": "VantageScore", "correct": false}, {"text": "FICO Score", "correct": true}, {"text": "Equifax Score", "correct": false}, {"text": "TransUnion Index", "correct": false}], "feedback": "El FICO Score, desarrollado por Fair Isaac Corporation, es el modelo de puntaje de crédito más usado en Estados Unidos."}, {"prompt": "¿Cuál rango de credit score se considera generalmente bueno por la mayoría de los prestamistas estadounidenses?", "options": [{"text": "300 – 579", "correct": false}, {"text": "580 – 669", "correct": false}, {"text": "670 – 739", "correct": true}, {"text": "800 – 850", "correct": false}], "feedback": "Un puntaje de 670 a 739 suele considerarse bueno. De 740 hacia arriba, la clasificación es muy buena o excepcional."}, {"prompt": "¿Cuál factor tiene el mayor impacto en tu FICO Score?", "options": [{"text": "Antigüedad del historial de crédito (15%)", "correct": false}, {"text": "Variedad de tipos de crédito (10%)", "correct": false}, {"text": "Historial de pagos (35%)", "correct": true}, {"text": "Montos adeudados (30%)", "correct": false}], "feedback": "El historial de pagos es el factor individual más importante y responde por 35% del FICO Score. Pagar todas las cuentas a tiempo es la forma más confiable de construir y proteger tu puntaje."}, {"prompt": "¿Qué es la credit utilization?", "options": [{"text": "La cantidad de solicitudes de crédito que enviaste", "correct": false}, {"text": "La relación entre tus saldos actuales y el límite total de crédito disponible", "correct": true}, {"text": "El total de deudas que debes sumando todas las cuentas", "correct": false}, {"text": "La antigüedad promedio de todas tus cuentas de crédito abiertas", "correct": false}], "feedback": "La credit utilization es la relación entre los saldos actuales de tus tarjetas y el límite total disponible. Es un componente central de la categoría de montos adeudados, que responde por 30% del FICO Score."}, {"prompt": "¿Por cuánto tiempo puede permanecer un pago omitido en tu credit report?", "options": [{"text": "Un año", "correct": false}, {"text": "Tres años", "correct": false}, {"text": "Hasta siete años", "correct": true}, {"text": "Hasta diez años", "correct": false}], "feedback": "Un pago omitido o atrasado puede permanecer en tu credit report hasta por siete años, contados desde la fecha en que el pago dejó de hacerse."}, {"prompt": "¿Qué es una hard inquiry?", "options": [{"text": "Cuando consultas tu propio credit score", "correct": false}, {"text": "Cuando un prestamista consulta tu credit report después de que solicitas crédito", "correct": true}, {"text": "Cuando un dueño de inmueble revisa tu historial de alquiler", "correct": false}, {"text": "Cuando tu banco revisa el movimiento de tu cuenta", "correct": false}], "feedback": "La hard inquiry ocurre cuando un prestamista consulta tu credit report en respuesta a una solicitud de crédito que hiciste. Puede reducir un poco tu puntaje."}, {"prompt": "¿Cuál de estas es la única fuente autorizada por el gobierno federal para credit reports gratuitos?", "options": [{"text": "CreditKarma.com", "correct": false}, {"text": "Experian.com/free", "correct": false}, {"text": "AnnualCreditReport.com", "correct": true}, {"text": "FICO.com/free", "correct": false}], "feedback": "AnnualCreditReport.com es el único sitio autorizado por el gobierno federal para credit reports gratuitos. Tienes derecho a al menos un reporte gratuito cada 12 meses en cada uno de los tres grandes bureaus."}, {"prompt": "¿Cuál es un primer paso recomendado para quien no tiene historial de crédito en Estados Unidos?", "options": [{"text": "Solicitar de inmediato una tarjeta premium sin garantía", "correct": false}, {"text": "Abrir un secured credit card y pagar el saldo completo todos los meses", "correct": true}, {"text": "Tomar un préstamo personal de monto alto para mostrar capacidad de pago", "correct": false}, {"text": "Esperar dos años antes de solicitar cualquier crédito", "correct": false}], "feedback": "El secured credit card es un punto de partida común para construir historial en Estados Unidos. Exige un depósito, es accesible para quien no tiene historial e informa los pagos a los bureaus."}, {"prompt": "¿Qué pasa con tu credit score cuando cierras una cuenta de tarjeta antigua?", "options": [{"text": "El puntaje siempre mejora, porque pasas a tener menos cuentas", "correct": false}, {"text": "El puntaje puede caer, porque el crédito disponible disminuye y eso puede aumentar tu credit utilization", "correct": true}, {"text": "El puntaje no cambia, porque solo cuenta el historial de pagos", "correct": false}, {"text": "El puntaje mejora, porque los prestamistas prefieren menos cuentas abiertas", "correct": false}], "feedback": "Cerrar una tarjeta antigua reduce el límite total disponible, lo que puede aumentar tu credit utilization y bajar el puntaje. El efecto final depende del resto de tu perfil de crédito."}, {"prompt": "¿Cuál de estas acciones NO afecta tu credit score?", "options": [{"text": "Omitir el pago de una tarjeta de crédito", "correct": false}, {"text": "Solicitar una tarjeta de crédito nueva", "correct": false}, {"text": "Consultar tu propio credit score", "correct": true}, {"text": "Mantener un saldo alto en la tarjeta de crédito", "correct": false}], "feedback": "Consultar tu propio credit score es una soft inquiry y no afecta el puntaje. Las hard inquiries hechas por prestamistas y los pagos omitidos sí afectan."}, {"prompt": "¿Qué es un credit freeze?", "options": [{"text": "Una reducción temporal de tu límite impuesta por el emisor", "correct": false}, {"text": "Una restricción que pones en tu registro para impedir la apertura de cuentas nuevas sin autorización", "correct": true}, {"text": "Un bloqueo judicial puesto en tu crédito cuando presentas una solicitud de bancarrota", "correct": false}, {"text": "Una pausa en el cobro de intereses que ofrecen los prestamistas en momentos de dificultad financiera", "correct": false}], "feedback": "El credit freeze es una restricción que tú mismo pones en tu registro y que impide que nuevos prestamistas accedan a tu reporte sin permiso. Es una de las herramientas más eficaces contra el robo de identidad."}, {"prompt": "¿Qué significa decir que un prestamista hizo el charge-off de una deuda?", "options": [{"text": "El prestamista perdonó la deuda y ya no debes nada", "correct": false}, {"text": "El prestamista dio de baja la deuda como pérdida; la cobranza puede continuar y el registro permanece en el reporte", "correct": true}, {"text": "El prestamista transfirió la deuda a un organismo del gobierno", "correct": false}, {"text": "El prestamista aceptó un monto menor como acuerdo", "correct": false}], "feedback": "El charge-off significa que el prestamista dio de baja la deuda como pérdida en su contabilidad, pero tú sigues debiendo. El registro permanece en el credit report hasta por siete años y puede perjudicar bastante tu puntaje."}, {"prompt": "Según la ley federal, ¿con qué frecuencia mínima tienes derecho a un credit report gratuito en cada uno de los tres grandes bureaus?", "options": [{"text": "Una vez cada tres años por bureau", "correct": false}, {"text": "Una vez por año por bureau", "correct": true}, {"text": "Dos veces por año por bureau", "correct": false}, {"text": "Siempre que lo solicites, sin costo", "correct": false}], "feedback": "La ley federal garantiza como mínimo un reporte gratuito cada 12 meses en cada uno de los tres grandes bureaus. En la práctica, Equifax, Experian y TransUnion ofrecen hoy reportes gratuitos cada semana por AnnualCreditReport.com."}, {"prompt": "¿Cuál opción describe mejor la relación entre la antigüedad del historial de crédito y tu puntaje?", "options": [{"text": "Un historial más largo siempre resulta en un puntaje mayor, independientemente de los otros factores", "correct": false}, {"text": "La antigüedad del historial no tiene efecto relevante en el puntaje", "correct": false}, {"text": "Un historial más largo en general ayuda, porque les da a los prestamistas más datos para evaluar tu confiabilidad", "correct": true}, {"text": "La antigüedad del historial solo importa en el financiamiento de vivienda, no en el crédito del día a día", "correct": false}], "feedback": "La antigüedad del historial de crédito responde por 15% del FICO Score. Un historial más largo suele ayudar porque aporta más datos sobre tu comportamiento financiero a lo largo del tiempo."}], "quizIntro": "Responde las 15 preguntas a continuación para poner a prueba tu entendimiento sobre el sistema de crédito estadounidense. Elige la mejor respuesta para cada una.", "summary": [{"type": "p", "text": "En este módulo aprendiste:"}, {"type": "ul", "items": ["Qué es el crédito y por qué importa en Estados Unidos para alquilar, financiar y llevar la vida financiera del día a día;", "Cómo los tres grandes bureaus, Equifax, Experian y TransUnion, recogen e informan tus datos de crédito;", "Cómo se calculan los credit scores a partir de cinco categorías: historial de pagos, montos adeudados (incluyendo la credit utilization), antigüedad del historial, variedad de tipos de crédito y consultas nuevas;", "Qué significan en la práctica los rangos del FICO Score y cómo los interpretan los prestamistas;", "Cómo empezar a formar historial de crédito en Estados Unidos con secured cards, credit-builder loans, estatus de authorized user e información del alquiler;", "Cómo revisar tu credit report, identificar errores y protegerte contra el fraude;", "Ideas equivocadas comunes sobre el sistema de crédito estadounidense y la visión más precisa de cada una;", "Los principales términos de crédito usados en el sistema financiero estadounidense."]}], "reflection": ["¿Cuál fue tu mayor descubrimiento sobre cómo funciona el sistema de crédito estadounidense? ¿Hubo algo que te sorprendió o que entendías de otra manera?", "¿Cuál es un hábito de crédito que quieres construir o cambiar a partir de lo que aprendiste en este módulo? Sé lo más específico posible.", "¿Cuál duda sobre el credit score o el historial de crédito te quedó y quieres investigar más?"], "actionTask": {"title": "Revisa tu situación de crédito en Estados Unidos esta semana", "steps": ["Consulta tu credit report por AnnualCreditReport.com, la única fuente autorizada por el gobierno federal para reportes gratuitos, y anota cuáles factores de tu perfil todavía necesitas entender mejor.", "Si ya tienes cuentas, revisa si la información está correcta. Si todavía no tienes historial de crédito, elige una opción realista de la Lección 5 que quepa en tu situación actual.", "Escribe un hábito de crédito específico que quieras practicar de forma consistente en los próximos 30 días."]}, "disclaimer": "Este módulo es educativo y fue hecho para ayudarte a entender cómo funciona el sistema de crédito estadounidense. No constituye asesoría jurídica, financiera, de inversión ni de reparación de crédito. Para orientación sobre tu situación específica, consulta a un profesional calificado.", "practiceIntro": "", "taskPurpose": "", "taskInstruction": "Haz los tres pasos a continuación antes de que termine la semana:"}, "2": {"n": 2, "title": "Uso y comportamiento con la tarjeta de crédito", "subtitle": "Ciclos de estado de cuenta, credit utilization, APR y cargos, momento del pago y cómo usar la tarjeta sin que el hábito controle tus finanzas.", "meta": "10 Lecciones · 15 Preguntas · 1 Tarea práctica · Tiempo estimado: 35 minutos · Nivel: Fundamentos", "overview": [{"type": "p", "text": "La tarjeta de crédito es una de las herramientas financieras más comunes en Estados Unidos. Usada con atención, ofrece practicidad, ayuda a formar y mantener historial de crédito y da flexibilidad para administrar los gastos del día a día. Usada sin un entendimiento claro de cómo funciona, también genera intereses innecesarios, cargos y estrés financiero de largo plazo."}, {"type": "p", "text": "Este módulo explica cómo funciona la tarjeta de crédito en la práctica, incluyendo la relación entre el ciclo de facturación y la fecha de vencimiento, cómo se calcula la credit utilization, cuál es la diferencia entre el APR y los cargos, y cómo el momento del pago afecta tanto tus finanzas como tu perfil de crédito."}, {"type": "p", "text": "El objetivo es entender el funcionamiento de la tarjeta lo suficiente para decidir de forma intencional cuándo y cómo usarla."}, {"type": "callout", "label": "Objetivo de aprendizaje", "text": "Al final de este módulo vas a entender cómo funciona una cuenta de tarjeta de crédito, cómo se reportan los saldos y los pagos, cómo los intereses y los cargos afectan el costo de usar crédito y cuáles comportamientos del día a día ayudan a usar la tarjeta de forma responsable."}], "lessons": [{"n": 1, "title": "Cómo funciona la tarjeta de crédito", "blocks": [{"type": "p", "text": "La tarjeta de crédito es una forma de crédito revolvente que permite hacer compras con dinero del emisor, con el compromiso de devolver lo que se usó. A diferencia de la tarjeta de débito, que en general retira el dinero directo de tu cuenta, la tarjeta de crédito crea un saldo del cual tú eres responsable."}, {"type": "p", "text": "Cuando usas una tarjeta de crédito, ocurre una secuencia de cosas:"}, {"type": "ul", "items": ["Haces una compra con la tarjeta.", "La compra se suma a tu saldo pendiente.", "El emisor registra tus transacciones durante un periodo de facturación.", "Al final de ese periodo, el emisor genera un estado de cuenta.", "Recibes un pago mínimo y una fecha de vencimiento.", "En general puedes pagar el saldo completo del estado de cuenta, pagar una parte o, en ciertas situaciones, pagar solo el mínimo."]}, {"type": "callout", "label": "Punto clave", "text": "La tarjeta de crédito no aumenta tus ingresos. Te da acceso a dinero prestado que tendrás que devolver. El hábito más importante es ver la compra con tarjeta como dinero que vas a tener que pagar, y no como dinero que ganaste o recibiste."}]}, {"n": 2, "title": "Ciclos de facturación y estados de cuenta", "blocks": [{"type": "p", "text": "Los emisores organizan las transacciones en ciclos de facturación. El billing cycle es el periodo en el que se registran compras, pagos, créditos y otros movimientos de la cuenta. Al final del ciclo, el emisor genera un estado de cuenta que muestra información como:"}, {"type": "ul", "items": ["Compras y otras transacciones;", "Pagos y créditos;", "El saldo del estado de cuenta;", "El pago mínimo exigido;", "La fecha de vencimiento;", "Intereses y cargos aplicables."]}, {"type": "p", "text": "Saldo del estado de cuenta y saldo actual El saldo del estado de cuenta es, en general, el monto que se debe en el momento en que cierra el ciclo. El saldo actual puede incluir transacciones hechas después de ese cierre."}, {"type": "p", "text": "Ejemplo: tu estado de cuenta cierra el 20 de junio con un saldo de $600. Después de eso, el 23 de junio, haces otra compra de $100. El saldo del estado de cuenta sigue en $600, mientras el saldo actual puede mostrar $700."}, {"type": "callout", "label": "Punto clave", "text": "Entender la diferencia entre el saldo del estado de cuenta y el saldo actual hace que el pago de la tarjeta sea mucho más fácil de administrar."}]}, {"n": 3, "title": "Vencimiento, pago mínimo y grace period", "blocks": [{"type": "p", "text": "Todo estado de cuenta de tarjeta trae una fecha de vencimiento. El pago mínimo es el monto más bajo que el emisor exige hasta el vencimiento para que la cuenta no entre en atraso, según las condiciones del contrato."}, {"type": "p", "text": "Pagar solo el mínimo mantiene la cuenta al día, pero puede hacer que el saldo quede pendiente por más tiempo y genere un costo alto de intereses."}, {"type": "p", "text": "Saldo del estado de cuenta: $1,000. Pago mínimo: $40. Vencimiento: 15 de julio. Pagar $40 cumple con la exigencia del mínimo, pero el saldo restante puede seguir acumulando intereses según las condiciones de la cuenta.", "lead": "Ejemplo"}, {"type": "p", "text": "El costo de pagar solo el mínimo se puede estimar. La tabla de abajo supone que el saldo del estado de cuenta se mantiene en $1,000, que el APR es de 24%, que no entran compras nuevas y que se paga el mismo monto cada mes. Sirve para mostrar el orden de magnitud, no para reproducir el cálculo exacto de una tarjeta específica."}, {"type": "table", "head": ["Pagado cada mes", "Meses hasta llegar a cero", "Intereses sumados", "Total pagado"], "rows": [["$40", "~36", "~$400", "~$1,400"], ["$100", "12", "~$127", "~$1,127"], ["$1,000, el total", "1", "Ninguno, cuando hay grace period", "$1,000"]]}, {"type": "p", "text": "En este ejemplo, $1,000 en compras cuestan cerca de $1,400 cuando se pagan a $40 por mes. Muchos emisores no usan un mínimo fijo. Lo calculan como un porcentaje pequeño del saldo más los intereses del período, así que el monto exigido baja a medida que baja el saldo, lo que alarga todavía más el plazo hasta llegar a cero."}, {"type": "callout", "label": "Nota importante", "text": "Son estimaciones educativas. Los intereses reales dependen de las condiciones de tu tarjeta, del saldo diario o promedio, de la forma de capitalización, de las transacciones nuevas y de los pagos hechos en el período."}, {"type": "p", "text": "La mayoría de las tarjetas ofrece un grace period, el intervalo entre el cierre del estado de cuenta y el vencimiento en el que puedes pagar el saldo completo sin intereses sobre compras nuevas. En general solo aplica cuando el saldo anterior se pagó por completo, y normalmente no aplica a los retiros de efectivo (cash advances). Si tu cuenta ofrece ese periodo, y bajo cuáles condiciones, está en el contrato.", "lead": "Nota educativa: qué es el grace period"}, {"type": "callout", "label": "Punto clave", "text": "El pago mínimo es una exigencia, no una meta de gasto recomendada."}]}, {"n": 4, "title": "El APR y el costo de cargar saldo", "blocks": [{"type": "p", "text": "El APR, o Annual Percentage Rate, representa el costo anualizado de tomar prestado según las condiciones de la cuenta de crédito. El APR de tarjeta suele ser alto en comparación con otras formas de préstamo. Si llevas saldo de un ciclo a otro, los intereses pueden aumentar bastante el costo de tus compras."}, {"type": "p", "text": "El APR y los cargos son cosas diferentes El APR se refiere al costo de tomar prestado, expresado como tasa anual. Los cargos son cobros específicos previstos en las condiciones de la cuenta. Ejemplos de cargos:"}, {"type": "ul", "items": ["Cuota anual;", "Cargo por pago atrasado;", "Cargo por transferencia de saldo;", "Cargo por retiro de efectivo;", "Cargo por transacción internacional."]}, {"type": "callout", "label": "Punto clave", "text": "Una tarjeta con cuota anual baja no es necesariamente barata si cargas saldo con frecuencia a un APR alto. Una tarjeta con cuota anual tampoco es automáticamente una mala elección; lo que decide es cómo usas la cuenta."}]}, {"n": 5, "title": "La credit utilization y por qué importa", "blocks": [{"type": "p", "text": "La credit utilization es cuánto del crédito revolvente estás usando en relación con los límites disponibles."}, {"type": "p", "text": "Ejemplo: límite de $5,000; saldo reportado de $1,000; utilización de 20%. La cuenta es $1,000 dividido entre $5,000, que da 20%."}, {"type": "p", "text": "La credit utilization forma parte de la categoría de montos adeudados que usa FICO, que responde por cerca de 30% del puntaje. Un saldo alto en relación con el límite disponible puede indicar mayor dependencia del crédito revolvente y afectar negativamente tu credit score."}, {"type": "callout", "label": "Nota educativa", "text": "El saldo de tu tarjeta cambia a lo largo del mes. El saldo que se reporta a los bureaus suele ser el de la fecha de cierre del estado de cuenta, que puede ser diferente del que ves justo después de pagar. Mantener la utilización reportada por debajo de cerca de 30% es una orientación citada con frecuencia por educadores financieros; es una referencia general, no una regla fijada en la ley."}, {"type": "callout", "label": "Punto clave", "text": "Usar tarjeta de crédito no perjudica automáticamente tu crédito. Lo que pesa es la relación entre tus saldos y el crédito disponible, junto con el resto de tu comportamiento de crédito."}]}, {"n": 6, "title": "Momento del pago y fecha de cierre", "blocks": [{"type": "p", "text": "Mucha gente cree que la única fecha importante de la tarjeta es el vencimiento. Dos fechas merecen atención."}, {"type": "p", "text": "Es cuando termina el ciclo y el saldo del estado de cuenta queda, en general, definido. Ese suele ser también el saldo que se reporta a los credit bureaus.", "lead": "Fecha de cierre del estado de cuenta"}, {"type": "p", "text": "Es el plazo final para hacer el pago exigido.", "lead": "Fecha de vencimiento"}, {"type": "p", "text": "Ejemplo: el estado de cuenta cierra el 10 de agosto y vence el 5 de septiembre. Las compras hechas antes del 10 de agosto pueden entrar en ese estado de cuenta, mientras las compras hechas después del cierre pueden aparecer en el estado de cuenta siguiente."}, {"type": "callout", "label": "Punto clave", "text": "No necesitas pagar la tarjeta antes de cada compra. El objetivo es entender tu ciclo de facturación y mantener una rutina de pago que evite atrasos e intereses innecesarios."}]}, {"n": 7, "title": "Usar la tarjeta sin crear deuda", "blocks": [{"type": "p", "text": "La tarjeta se vuelve difícil de administrar cuando la decisión de gastar se separa de la capacidad de pagar. Una guía útil es hacerte tres preguntas antes de una compra relevante."}, {"type": "ol", "items": ["¿Puedo pagar esta compra? Evalúa si el gasto cabe en los recursos que tienes.", "¿Cuándo voy a pagarla? Define si piensas liquidar la compra por completo o cargar saldo.", "¿Cuánto va a costar de verdad? Si vas a cargar el saldo, considera los intereses y los demás costos aplicables."]}, {"type": "p", "text": "Señales de alerta comunes"}, {"type": "ul", "items": ["Pagar solo el mínimo con frecuencia;", "Usar una tarjeta para pagar otra deuda;", "Acercarte al límite de forma recurrente;", "Depender de la tarjeta para gastos rutinarios que no podrías pagar de otra manera;", "Evitar mirar el saldo o el estado de cuenta;", "Acumular saldo más rápido de lo que puedes pagar."]}, {"type": "callout", "label": "Punto clave", "text": "Usar crédito está bien. El problema aparece cuando el uso del crédito se desconecta de tu capacidad de pagar."}]}, {"n": 8, "title": "Cargos comunes de la tarjeta y cómo evitarlos", "blocks": [{"type": "p", "text": "El cargo por pago atrasado puede aplicarse cuando el pago exigido no se hace hasta el vencimiento. Un atraso suficientemente largo también puede reportarse a los credit bureaus y perjudicar tu historial.", "lead": "Cargo por pago atrasado"}, {"type": "p", "text": "Algunas tarjetas cobran una cuota anual solo por el mantenimiento de la cuenta. Una tarjeta con cuota anual todavía puede valer la pena si los beneficios justifican el costo.", "lead": "Cuota anual"}, {"type": "p", "text": "Algunas tarjetas cobran por transacciones procesadas fuera de Estados Unidos o en moneda extranjera. Conocer las condiciones antes de viajar evita costos inesperados.", "lead": "Cargo por transacción internacional"}, {"type": "p", "text": "Usar la tarjeta para obtener dinero en efectivo puede implicar cargos y condiciones de intereses diferentes de las compras comunes, y el retiro en general no cuenta con el grace period.", "lead": "Cargo por retiro de efectivo"}, {"type": "callout", "label": "Punto clave", "text": "Los cargos forman parte del precio de un producto financiero. Leer las condiciones de la cuenta antes de usar la tarjeta ayuda a entender lo que estás pagando de verdad."}]}, {"n": 9, "title": "Hábitos con la tarjeta que sostienen la salud financiera", "blocks": [{"type": "p", "text": "El uso responsable de la tarjeta suele venir de la consistencia, más que de estrategias complicadas. Entre los hábitos que ayudan:"}, {"type": "p", "text": "Paga a tiempo Programa recordatorios o pago automático para no perder un vencimiento sin querer."}, {"type": "p", "text": "Da seguimiento al saldo Revisa la cuenta con regularidad en lugar de esperar el estado de cuenta del mes."}, {"type": "p", "text": "Entiende tu estado de cuenta Revisa transacciones, cargos, intereses y el monto adeudado."}, {"type": "p", "text": "Mantén la utilización bajo control Evita usar de forma constante una parte grande del crédito revolvente disponible."}, {"type": "p", "text": "Evita intereses innecesarios Cuando quepa en el presupuesto, pagar el saldo completo del estado de cuenta ayuda a evitar intereses sobre compras en las cuentas que ofrecen grace period."}, {"type": "p", "text": "Revisa las condiciones de la cuenta Las reglas cambian de tarjeta en tarjeta. Conoce el APR, los cargos, las condiciones del programa de puntos y los demás términos de tu cuenta."}, {"type": "callout", "label": "Punto clave", "text": "La mejor estrategia con la tarjeta suele ser simple: gastar con intención, dar seguimiento a la cuenta, pagar a tiempo y entender el costo de tomar prestado."}]}, {"n": 10, "title": "Confusiones comunes sobre la tarjeta de crédito", "blocks": [{"type": "p", "text": "La tabla de abajo compara creencias comunes sobre la tarjeta de crédito con una visión más precisa de cómo funciona."}, {"type": "table", "head": ["Confusión común", "Entendimiento más preciso"], "rows": [["Cargar saldo todos los meses construye crédito más rápido.", "En general no necesitas cargar saldo ni pagar intereses para construir crédito."], ["Pagar solo el mínimo es siempre la mejor estrategia.", "El mínimo mantiene la cuenta al día, pero pagar más reduce el costo de intereses y el tiempo de liquidación."], ["La tarjeta de crédito es básicamente dinero gratis.", "La tarjeta da acceso a dinero prestado que hay que devolver."], ["Usar tarjeta perjudica automáticamente tu crédito.", "El uso responsable de la tarjeta puede contribuir a un perfil de crédito saludable."], ["Tengo que pagar el saldo justo después de cada compra.", "Una rutina de pago constante suele bastar; entender las fechas de cierre y de vencimiento importa más."], ["Un límite alto significa que puedo gastar más.", "El límite es el techo del emisor, no tu presupuesto personal de gastos."], ["El APR y la cuota anual son lo mismo.", "El APR se refiere al costo de tomar prestado; los cargos son cobros separados previstos en el contrato."], ["Los puntos y los beneficios siempre compensan una tarjeta.", "Los beneficios pueden tener valor, pero no deben justificar gasto innecesario ni costo de intereses."]]}, {"type": "callout", "label": "Punto clave", "text": "La mayor parte de los errores con la tarjeta viene de un puñado de malentendidos sobre cómo funcionan de verdad los saldos, los intereses y la información que llega al bureau. Corregir eso suele bastar para cambiar el resultado."}]}], "quiz": [{"prompt": "¿Cuál de las opciones describe mejor una tarjeta de crédito?", "options": [{"text": "Una cuenta bancaria usada solo para compras", "correct": false}, {"text": "Una forma de crédito revolvente que permite tomar dinero prestado y pagarlo después", "correct": true}, {"text": "Una cuenta de ahorro con límite de gasto", "correct": false}, {"text": "Un programa de beneficios del gobierno", "correct": false}], "feedback": "La tarjeta de crédito da acceso a crédito revolvente. Las compras crean un saldo que el titular es responsable de pagar."}, {"prompt": "¿Qué es un billing cycle?", "options": [{"text": "El periodo en el que la tarjeta queda inactiva", "correct": false}, {"text": "El periodo en el que se registran las transacciones antes de que se genere el estado de cuenta", "correct": true}, {"text": "El tiempo que falta para que la tarjeta expire", "correct": false}, {"text": "El periodo en el que nunca se pueden cobrar intereses", "correct": false}], "feedback": "El billing cycle es el periodo en el que se acumulan los movimientos de la cuenta antes de que el emisor genere el estado de cuenta."}, {"prompt": "¿Qué es el saldo del estado de cuenta?", "options": [{"text": "El monto máximo que puedes tomar prestado", "correct": false}, {"text": "El saldo que muestra el estado de cuenta cuando cierra el ciclo de facturación", "correct": true}, {"text": "El monto mínimo que necesitas gastar por mes", "correct": false}, {"text": "Tu ingreso anual total", "correct": false}], "feedback": "El saldo del estado de cuenta refleja el monto informado en el estado de cuenta de ese ciclo de facturación."}, {"prompt": "¿Qué es el pago mínimo?", "options": [{"text": "El monto que necesitas gastar todos los meses", "correct": false}, {"text": "El pago más bajo que exige el emisor hasta el vencimiento, según las condiciones de la cuenta", "correct": true}, {"text": "El total de intereses cobrados", "correct": false}, {"text": "Tu límite de crédito disponible", "correct": false}], "feedback": "El pago mínimo es el monto mínimo exigido. Pagar solo el mínimo deja saldo pendiente y puede generar un costo adicional de intereses."}, {"prompt": "¿Qué mide el APR?", "options": [{"text": "Tu ingreso anual", "correct": false}, {"text": "Tu límite de crédito", "correct": false}, {"text": "El costo anualizado de tomar prestado según las condiciones aplicables", "correct": true}, {"text": "El porcentaje del límite que ya usaste", "correct": false}], "feedback": "El APR, o Annual Percentage Rate, expresa el costo anualizado de tomar prestado según las condiciones de la cuenta."}, {"prompt": "¿Qué es la credit utilization?", "options": [{"text": "La cantidad de tarjetas que tienes", "correct": false}, {"text": "La relación entre los saldos del crédito revolvente y los límites disponibles", "correct": true}, {"text": "La tasa de interés de tu tarjeta", "correct": false}, {"text": "La cantidad de compras que haces por mes", "correct": false}], "feedback": "La credit utilization mide cuánto del crédito revolvente estás usando en relación con el crédito disponible para ti."}, {"prompt": "Si tu límite es de $5,000 y el saldo reportado es de $1,000, ¿cuál es tu credit utilization?", "options": [{"text": "5%", "correct": false}, {"text": "10%", "correct": false}, {"text": "20%", "correct": true}, {"text": "50%", "correct": false}], "feedback": "$1,000 dividido entre $5,000 da 20%. El saldo reportado representa 20% del límite disponible."}, {"prompt": "¿Cuál fecha suele determinar el saldo que se reporta a los credit bureaus?", "options": [{"text": "La fecha de vencimiento", "correct": false}, {"text": "La fecha de cierre del estado de cuenta", "correct": true}, {"text": "La fecha de expiración de la tarjeta", "correct": false}, {"text": "La fecha en que se calcula tu credit score", "correct": false}], "feedback": "La fecha de cierre marca el final del ciclo de facturación y se usa para generar el estado de cuenta de ese periodo."}, {"prompt": "¿Cuál afirmación sobre cargar saldo es correcta?", "options": [{"text": "Necesitas cargar saldo para construir crédito", "correct": false}, {"text": "En general no necesitas cargar saldo ni pagar intereses para construir crédito", "correct": true}, {"text": "Cargar un saldo mayor siempre mejora tu credit score", "correct": false}, {"text": "Cargar saldo elimina todos los cargos de la tarjeta", "correct": false}], "feedback": "En general no hace falta cargar saldo ni pagar intereses para demostrar un comportamiento de crédito responsable."}, {"prompt": "¿Qué puede pasar cuando tu saldo queda alto en relación con el límite?", "options": [{"text": "Tu límite aumenta automáticamente", "correct": false}, {"text": "Tu credit utilization puede subir y afectar negativamente tu credit score", "correct": true}, {"text": "Tu APR baja automáticamente", "correct": false}, {"text": "Tu tarjeta de crédito se convierte en tarjeta de débito", "correct": false}], "feedback": "Una utilización alta puede afectar negativamente el puntaje. Dar seguimiento a los saldos en relación con el crédito disponible es, por eso, un hábito importante."}, {"prompt": "¿Cuál de estos es un cargo que algunos emisores cobran solo por el mantenimiento de la cuenta?", "options": [{"text": "Credit utilization", "correct": false}, {"text": "Saldo del estado de cuenta", "correct": false}, {"text": "Cuota anual", "correct": true}, {"text": "Límite de crédito", "correct": false}], "feedback": "La cuota anual es un cobro que hacen algunos emisores por el mantenimiento de la cuenta."}, {"prompt": "¿Cuál es una consecuencia de pagar solo el mínimo?", "options": [{"text": "Reduce automáticamente tu límite de crédito", "correct": false}, {"text": "Puede dejar un saldo pendiente que sigue generando intereses", "correct": true}, {"text": "Cancela los puntos de tu tarjeta", "correct": false}, {"text": "Impide que la empresa reporte tu cuenta a los bureaus", "correct": false}], "feedback": "Pagar solo el mínimo mantiene la cuenta al día, pero el saldo restante continúa y puede generar intereses adicionales según las condiciones de la cuenta."}, {"prompt": "¿Cuál hábito reduce de forma más directa el riesgo de perder un pago?", "options": [{"text": "Aumentar tu límite de crédito", "correct": false}, {"text": "Programar recordatorios o pago automático", "correct": true}, {"text": "Abrir varias tarjetas nuevas", "correct": false}, {"text": "Ignorar los estados de cuenta mensuales", "correct": false}], "feedback": "Los recordatorios de pago y el pago automático ayudan a reducir el riesgo de perder una fecha de vencimiento sin querer."}, {"prompt": "¿Qué representa el límite de crédito?", "options": [{"text": "El monto que tienes ahorrado", "correct": false}, {"text": "El monto máximo que el emisor permite que uses en la cuenta", "correct": true}, {"text": "El monto que deberías gastar todos los meses", "correct": false}, {"text": "El monto de intereses que debes", "correct": false}], "feedback": "El límite representa el máximo de crédito revolvente disponible en la cuenta. No representa lo que puedes pagar."}, {"prompt": "¿Cuál enfoque resume mejor el uso responsable de la tarjeta de crédito?", "options": [{"text": "Usar lo máximo posible del crédito disponible", "correct": false}, {"text": "Cargar saldo todos los meses para construir crédito", "correct": false}, {"text": "Gastar con intención, dar seguimiento a la cuenta, pagar a tiempo y entender el costo de tomar prestado", "correct": true}, {"text": "Abrir varias tarjetas siempre que el saldo aumente", "correct": false}], "feedback": "El uso responsable combina gasto intencional, seguimiento constante de la cuenta, pagos a tiempo y entendimiento de los intereses y los cargos."}], "quizIntro": "Responde las 15 preguntas que siguen para poner a prueba tu entendimiento sobre el uso y el comportamiento con la tarjeta de crédito. Elige la mejor respuesta para cada una.", "summary": [{"type": "p", "text": "En este módulo aprendiste:"}, {"type": "ul", "items": ["Cómo funciona la tarjeta de crédito como forma de crédito revolvente;", "Cómo se relacionan el ciclo de facturación, la fecha de cierre y la fecha de vencimiento;", "La diferencia entre el saldo del estado de cuenta, el saldo actual y el pago mínimo;", "Qué es el grace period y cuándo aplica;", "Qué significa el APR y cómo los intereses aumentan el costo de tomar prestado;", "Cómo se calcula la credit utilization y por qué importa;", "Cómo el momento del pago afecta el saldo reportado y la utilización;", "Los cargos más comunes de la tarjeta y cómo reconocer costos innecesarios;", "Hábitos prácticos para usar la tarjeta sin que el gasto se salga de control;", "Confusiones comunes sobre el uso de la tarjeta y la visión más precisa de cada una;", "Cómo revisar un estado de cuenta e identificar un hábito concreto para mejorar."]}], "reflection": ["¿Cuál fue tu mayor descubrimiento sobre cómo funciona de verdad la tarjeta de crédito? ¿Hubo algo sobre el saldo del estado de cuenta, el vencimiento, la utilización, el APR o los cargos que entendías de otra manera?", "¿Cuál es un hábito con la tarjeta que quieres construir o cambiar a partir de lo que aprendiste? Sé lo más específico posible.", "¿Cuál duda te quedó sobre los costos de la tarjeta, el momento del pago o el uso responsable?"], "actionTask": {"title": "Revisa un estado de cuenta de tu tarjeta", "steps": ["Revisa un estado de cuenta reciente de la tarjeta. Identifica la fecha de cierre, el saldo del estado de cuenta, el pago mínimo, la fecha de vencimiento, el APR y los cargos o intereses que te hayan cobrado.", "Revisa tus gastos recientes. Identifica al menos una categoría de compra en la que podrías gastar de forma más intencional.", "Elige un hábito con la tarjeta para practicar en los próximos 30 días. Ejemplos: revisar la cuenta una vez por semana, programar recordatorios de pago, pagar el saldo completo cuando quepa en el presupuesto, dar seguimiento a tu credit utilization o revisar el estado de cuenta antes de las compras del mes siguiente."]}, "disclaimer": "Este módulo es educativo y se hizo para ayudarte a entender cómo funciona la tarjeta de crédito y cómo el comportamiento del día a día afecta tus finanzas. No constituye asesoría legal, financiera, de inversión ni de reparación de crédito. Para orientación sobre tu situación específica, consulta a un profesional calificado.", "practiceIntro": "Para cerrar este módulo, tómate unos minutos para reflexionar sobre lo que aprendiste antes de hacer la tarea práctica. No hay respuestas correctas ni incorrectas. El objetivo es conectar el contenido con tu propio comportamiento financiero.", "taskPurpose": "Aplicar lo que aprendiste en este módulo a tu propia situación financiera, por medio de una acción concreta y de bajo riesgo esta semana.", "taskInstruction": "Haz los tres pasos que siguen antes de que termine la semana:"}, "3": {"n": 3, "title": "Presupuesto y gastos recurrentes", "subtitle": "Cómo separar los gastos intencionales de los gastos por costumbre, identificar costos recurrentes y prepararte para gastos irregulares antes de que se conviertan en sustos financieros.", "meta": "10 Lecciones · 15 Preguntas · 1 Tarea práctica · Tiempo estimado: 35 minutos · Nivel: Fundamentos", "overview": [{"type": "p", "text": "Un presupuesto es un plan para el dinero que todavía no gastaste. Es una forma de entender a dónde va tu dinero, separar los gastos necesarios de los opcionales y decidir los gastos con anticipación, en lugar de reconstruirlos al final del mes."}, {"type": "p", "text": "La mayor parte de las dificultades financieras no viene de una compra grande y fuera de lo común. Se forma con gastos recurrentes, suscripciones automáticas, gastos por costumbre y costos irregulares que eran previsibles pero nunca entraron en el plan."}, {"type": "p", "text": "Este módulo explica cómo armar un presupuesto práctico, cómo identificar gastos recurrentes y evaluar si todavía entregan valor, cómo distinguir un gasto intencional de un gasto por costumbre y cómo prepararte para los gastos irregulares antes de que lleguen."}, {"type": "callout", "label": "Objetivo de aprendizaje", "text": "Al terminar este módulo vas a saber organizar tus ingresos y tus gastos en un presupuesto práctico, identificar costos recurrentes y gastos por costumbre, separar las necesidades de los gastos opcionales y de las prioridades financieras, y anticiparte a los gastos irregulares."}], "lessons": [{"n": 1, "title": "Qué es un presupuesto", "blocks": [{"type": "p", "text": "El presupuesto suele describirse como una forma de gastar menos. Esa descripción queda incompleta. El presupuesto es una herramienta de decisión: le dice a tu dinero a dónde ir antes de que empiece el mes, para que el gasto refleje lo que decidiste y no lo que pasó."}, {"type": "p", "text": "Un presupuesto práctico contempla seis categorías:"}, {"type": "ul", "items": ["Ingresos: el dinero que de verdad entra después de los impuestos y las deducciones de nómina, lo que se conoce como ingreso neto.", "Gastos fijos: costos que se mantienen más o menos iguales todos los meses, como la renta y el seguro.", "Gastos variables: costos necesarios cuyo monto cambia, como el supermercado, los servicios y el transporte.", "Gastos opcionales: gastos que mejoran la comodidad o el disfrute, sin ser obligatorios.", "Ahorro y objetivos: dinero apartado a propósito, incluido el fondo de emergencia y las metas específicas.", "Gastos irregulares: costos que no ocurren todos los meses, pero son bastante previsibles, como los seguros anuales y el mantenimiento del carro."]}, {"type": "callout", "label": "Punto clave", "text": "El presupuesto es una herramienta de decisión. Su función es ayudarte a decidir a dónde debe ir el dinero antes de que se gaste."}]}, {"n": 2, "title": "Gastos fijos y variables", "blocks": [{"type": "p", "text": "Los gastos fijos se mantienen casi constantes de un mes a otro. Los gastos variables cambian según el uso, la temporada del año o la decisión del momento. Los dos pueden ser necesarios y los dos pueden reducirse, aunque se comportan de forma distinta en el presupuesto: los fijos son más fáciles de planear y más difíciles de cambiar rápido, mientras los variables son más difíciles de prever y más fáciles de ajustar."}, {"type": "table", "head": ["Gastos fijos", "Gastos variables"], "rows": [["Renta o cuota del préstamo hipotecario", "Supermercado"], ["Primas de seguro", "Transporte y gasolina"], ["Pagos mínimos de deudas", "Servicios, como luz y agua"], ["Ciertas suscripciones y cuotas mensuales", "Comer fuera y entretenimiento"]]}, {"type": "p", "text": "Una distinción importa más que las etiquetas: fijo no quiere decir necesario. Una suscripción mensual es un gasto fijo porque el monto se repite, y puede ser totalmente opcional. La renta es fija y necesaria. Agrupar los gastos por su comportamiento (fijo o variable) y por su finalidad (necesario, opcional o prioridad) da dos vistas útiles del mismo presupuesto."}, {"type": "callout", "label": "Punto clave", "text": "Fijo describe cómo se comporta el gasto y no qué tan importante es. Buena parte de los ahorros más fáciles viene de gastos fijos que nunca fueron necesarios."}]}, {"n": 3, "title": "Gastos recurrentes y la vista anual", "blocks": [{"type": "p", "text": "Un gasto recurrente es cualquier costo que se repite con regularidad: mensual, trimestral o anual. Ejemplos comunes son los servicios de streaming, el gimnasio, las primas de seguro, los planes de celular, las suscripciones de software, las cuotas profesionales y los pagos automáticos que se configuran una vez y casi nunca se revisan."}, {"type": "p", "text": "Es fácil subestimar los gastos recurrentes porque aparecen con un monto mensual. El número del mes parece pequeño; el número del año es el compromiso real."}, {"type": "table", "head": ["Costo mensual", "Costo anual"], "rows": [["$9.99", "Cerca de $120"], ["$15", "$180"], ["$25", "$300"], ["$50", "$600"], ["$120", "$1,440"]]}, {"type": "p", "text": "Ejemplo: tres suscripciones de $15, $12 y $9 por mes cuestan $36 mensuales y $432 por año. Si ese es un buen uso de $432 es una pregunta legítima, y es una pregunta distinta de si $36 caben en este mes."}, {"type": "callout", "label": "Nota educativa", "text": "Un hábito práctico es revisar los cargos recurrentes dos veces por año, repasando uno o dos meses de estados de cuenta del banco y de la tarjeta en busca de montos que se repiten. Las suscripciones de renovación automática están hechas para continuar sin decisión; la revisión es lo que te devuelve la decisión."}, {"type": "callout", "label": "Punto clave", "text": "Evalúa los gastos recurrentes por su costo anual. Un monto mensual pequeño puede representar un compromiso relevante en el año."}]}, {"n": 4, "title": "Gasto intencional y gasto por costumbre", "blocks": [{"type": "p", "text": "Dos gastos del mismo tamaño pueden tener significados muy distintos. El gasto intencional es el que elegirías de nuevo hoy, porque entrega un valor que puedes nombrar. El gasto por costumbre sigue existiendo sobre todo porque ya existía antes."}, {"type": "table", "head": ["Intencional", "Por costumbre"], "rows": [["Pedir comida por aplicación porque elegiste la practicidad en una noche ocupada", "Pedir comida todos los viernes sin pensar en el costo"], ["Mantener una suscripción que usas con frecuencia", "Mantener una suscripción porque cancelarla da trabajo"], ["Pagar más por un servicio cuya calidad te importa", "Pagar por un plan que elegiste hace años y nunca revisaste"]]}, {"type": "p", "text": "Esta distinción conserva el disfrute dentro del presupuesto. Lo que busca es que el gasto refleje una decisión actual y no una decisión vieja."}, {"type": "callout", "label": "Punto clave", "text": "Un gasto recurrente puede ser un buen gasto. La pregunta es si sigue siendo intencional."}]}, {"n": 5, "title": "Necesidades, deseos y prioridades", "blocks": [{"type": "p", "text": "Los consejos de presupuesto suelen dividir el gasto en necesidades y deseos, tratando uno como responsable y el otro como superfluo. Un esquema más útil tiene tres categorías."}, {"type": "p", "text": "Necesidades Gastos exigidos para mantener la vida básica y cumplir obligaciones: vivienda, servicios, alimentación, transporte al trabajo, seguro y pagos obligatorios de deudas."}, {"type": "p", "text": "Deseos Gastos que mejoran la practicidad, la comodidad o el disfrute, sin ser esenciales."}, {"type": "p", "text": "Prioridades Gastos que no son estrictamente necesarios este mes, y que importan para tus objetivos: ahorrar para educación o desarrollo profesional, formar un fondo de emergencia, pagar una deuda más rápido de lo exigido o apartar dinero para una compra planeada."}, {"type": "p", "text": "La tercera categoría es la que mantiene realista el presupuesto. Tratar todo gasto no esencial como un deseo suele producir presupuestos abandonados, porque deja sin espacio todo lo que la persona valora de verdad."}, {"type": "callout", "label": "Punto clave", "text": "Un presupuesto que no tiene lugar para tus prioridades es un presupuesto que vas a dejar de usar."}]}, {"n": 6, "title": "Cómo armar un presupuesto mensual", "blocks": [{"type": "p", "text": "Un presupuesto que funciona se puede armar en seis pasos."}, {"type": "p", "lead": "Paso 1: identifica tu ingreso neto mensual", "text": "Usa el monto que de verdad llega a tu cuenta después de impuestos y deducciones. Si tu ingreso varía, usa un promedio reciente y conservador."}, {"type": "p", "lead": "Paso 2: enumera los gastos fijos recurrentes", "text": "Renta, seguro, pagos mínimos de deudas, suscripciones y cualquier otro monto que se repita."}, {"type": "p", "lead": "Paso 3: estima los gastos variables", "text": "Supermercado, servicios, transporte. Dos o tres meses de estados de cuenta dan una estimación más exacta que la memoria."}, {"type": "p", "lead": "Paso 4: identifica los gastos opcionales", "text": "Asígnales un monto en lugar de dejarlos como lo que sobre, que suele ser justamente la manera en que el gasto opcional crece."}, {"type": "p", "lead": "Paso 5: destina dinero al ahorro y a tus objetivos", "text": "Incluye el fondo de emergencia, tus prioridades y las cuotas mensuales para gastos irregulares, que se tratan en la Lección 8."}, {"type": "p", "lead": "Paso 6: compara el plan con el gasto real", "text": "Al final del mes, compara lo que planeaste con lo que pasó. La diferencia es la información."}, {"type": "table", "head": ["Categoría", "Ejemplo de plan mensual"], "rows": [["Ingreso neto", "$3,600"], ["Gastos fijos", "$1,900"], ["Gastos variables", "$800"], ["Opcionales", "$350"], ["Ahorro y prioridades", "$400"], ["Reserva para gastos irregulares", "$150"]]}, {"type": "callout", "label": "Nota educativa", "text": "Los montos de arriba son solo ilustrativos. Lo que importa es la estructura: cada dólar del ingreso neto queda asignado a una categoría, incluido lo que se ahorra o se aparta."}, {"type": "callout", "label": "Punto clave", "text": "El presupuesto funciona cuando cada categoría se define con anticipación, incluidos el gasto opcional y el ahorro."}]}, {"n": 7, "title": "Gastos irregulares", "blocks": [{"type": "p", "text": "Un gasto irregular es el que no ocurre todos los meses. Puede ser previsible aunque irregular, estacional, o de verdad inesperado."}, {"type": "p", "text": "El error más común de presupuesto es tratar los dos primeros como si fueran el tercero. Un seguro anual que llega todos los febreros es una sorpresa conocida; funciona como un gasto mensual que por casualidad se cobra una vez por año."}, {"type": "ul", "items": ["Previsibles aunque irregulares: primas anuales de seguro, trámite de placas del vehículo, cuotas profesionales, preparación de la declaración de impuestos.", "Estacionales: gastos de fin de año, regreso a clases, viajes, cuentas de energía más altas en el verano o en el invierno.", "Inesperados: reparación del carro, costos médicos o dentales, arreglos en la casa, cambio de un electrodoméstico."]}, {"type": "callout", "label": "Punto clave", "text": "Irregular no siempre quiere decir imprevisible. Los gastos que sabes que vienen pertenecen al plan, aunque no sean mensuales."}]}, {"n": 8, "title": "Sinking funds y planeación de gastos", "blocks": [{"type": "p", "text": "El sinking fund es el dinero que apartas poco a poco para un gasto futuro que ya conoces. En lugar de pagar $1,200 en un solo mes, apartas $100 por mes y pagas el gasto con lo que ya acumulaste. La cuenta es el costo anual esperado dividido entre doce."}, {"type": "table", "head": ["Gasto", "Costo anual esperado", "Reserva mensual"], "rows": [["Mantenimiento del carro", "$600", "$50"], ["Prima de seguro", "$1,200", "$100"], ["Gastos de fin de año", "$600", "$50"], ["Cuota anual", "$240", "$20"], ["Total", "$2,640", "$220"]]}, {"type": "p", "text": "Dos observaciones prácticas. Primera, mantén ese dinero separado del gasto del día a día, en una cuenta propia o en una parte claramente identificada de una cuenta, para que no se use sin querer. Segunda, el sinking fund y el fondo de emergencia cumplen funciones distintas: el sinking fund es para los gastos que esperas, mientras el fondo de emergencia cubre lo que no puedes prever."}, {"type": "callout", "label": "Punto clave", "text": "Dividir entre doce un gasto anual conocido convierte un susto financiero en una línea mensual común."}]}, {"n": 9, "title": "Cómo revisar y ajustar tu presupuesto", "blocks": [{"type": "p", "text": "El presupuesto funciona como un documento vivo y no como una planilla que se llena una sola vez. Su valor viene de la comparación mensual entre lo que planeaste y lo que de verdad gastaste."}, {"type": "table", "head": ["Categoría", "Planeado", "Real"], "rows": [["Supermercado", "$400", "$465"], ["Restaurantes y entregas a domicilio", "$150", "$240"], ["Transporte", "$220", "$195"], ["Suscripciones", "$60", "$84"]]}, {"type": "p", "text": "Después, hazte cinco preguntas:"}, {"type": "ul", "items": ["¿Dónde gasté más de lo que esperaba, y por qué?", "¿Cuáles de esos gastos fueron intencionales?", "¿Cuáles fueron por costumbre?", "¿Qué gastos recurrentes ya no entregan suficiente valor?", "¿Para qué gastos irregulares debería empezar a apartar dinero?"]}, {"type": "callout", "label": "Punto clave", "text": "Un presupuesto útil es el que revisas y ajustas, no el que cumples con perfección."}]}, {"n": 10, "title": "Ideas equivocadas comunes sobre el presupuesto", "blocks": [{"type": "p", "text": "La tabla de abajo compara creencias comunes sobre el presupuesto con un entendimiento más preciso."}, {"type": "p", "lead": "Idea equivocada común y entendimiento más preciso", "text": "Hacer un presupuesto significa eliminar los gastos opcionales. En realidad, el presupuesto te ayuda a decidir de forma intencional cuánto gasto opcional cabe en tu ingreso y en tus prioridades."}, {"type": "table", "head": ["Idea equivocada común", "Entendimiento más preciso"], "rows": [["Los gastos pequeños no importan.", "Los gastos recurrentes pequeños se vuelven relevantes cuando se miden en el año."], ["Los gastos irregulares no se pueden planear.", "Muchos gastos irregulares son previsibles aunque no ocurran todos los meses."], ["El presupuesto nunca debe cambiar.", "El presupuesto debe revisarse y ajustarse conforme cambian las circunstancias."], ["Todo gasto recurrente es necesario.", "Los gastos recurrentes deben revisarse de vez en cuando para ver si todavía entregan valor."], ["Gastar menos es siempre el objetivo.", "El objetivo es alinear el gasto con el ingreso y con las prioridades."], ["Si sobró dinero al final del mes, mi presupuesto funcionó.", "El presupuesto también necesita contemplar el ahorro, los objetivos y los gastos irregulares que están por venir."]]}, {"type": "callout", "label": "Punto clave", "text": "La mayoría de los presupuestos fracasa por ignorar los gastos irregulares o por no dejar espacio para las prioridades. Los dos problemas se resuelven en el propio plan."}]}], "quiz": [{"prompt": "¿Cuál es la función principal de un presupuesto?", "options": [{"text": "Eliminar los gastos opcionales", "correct": false}, {"text": "Decidir a dónde debe ir el dinero antes de gastarlo", "correct": true}, {"text": "Registrar los gastos solo después de que termina el mes", "correct": false}, {"text": "Aumentar tu límite de crédito", "correct": false}], "feedback": "El presupuesto es una herramienta de decisión que asigna el ingreso a categorías con anticipación."}, {"prompt": "¿Cuál de las opciones describe mejor un gasto fijo?", "options": [{"text": "Un gasto que cambia según el uso cada mes", "correct": false}, {"text": "Un gasto que se mantiene aproximadamente igual de un mes a otro", "correct": true}, {"text": "Cualquier gasto que sea necesario", "correct": false}, {"text": "Un gasto que ocurre solo una vez por año", "correct": false}], "feedback": "Los gastos fijos se repiten con un monto aproximadamente igual, como la renta o la prima de seguro."}, {"prompt": "¿Cuál de estos es un gasto variable?", "options": [{"text": "La renta", "correct": false}, {"text": "El supermercado", "correct": true}, {"text": "El pago mínimo de una deuda", "correct": false}, {"text": "Una cuota anual que se cobra una vez por año", "correct": false}], "feedback": "Los gastos variables cambian de un mes a otro según el uso, la temporada del año o la decisión del momento."}, {"prompt": "¿Qué es un gasto recurrente?", "options": [{"text": "Cualquier gasto por encima de $100", "correct": false}, {"text": "Un costo que se repite con regularidad, por ejemplo mensual o anual", "correct": true}, {"text": "Un gasto que ocurre solo una vez", "correct": false}, {"text": "Un cargo hecho por el emisor de la tarjeta", "correct": false}], "feedback": "Los gastos recurrentes se repiten con regularidad e incluyen suscripciones, cuotas y primas."}, {"prompt": "¿Por qué es útil evaluar los gastos recurrentes por su costo anual?", "options": [{"text": "Porque los costos anuales siempre son menores", "correct": false}, {"text": "Porque el monto mensual puede disimular el tamaño del compromiso en el año", "correct": true}, {"text": "Porque la mayoría de las suscripciones se cobra de forma anual", "correct": false}, {"text": "Porque los credit bureaus informan los gastos anuales", "correct": false}], "feedback": "Una suscripción de $25 por mes representa $300 por año. La vista anual muestra el compromiso real."}, {"prompt": "¿Qué diferencia a un gasto intencional de un gasto por costumbre?", "options": [{"text": "El monto del gasto", "correct": false}, {"text": "Si elegirías ese gasto de nuevo hoy", "correct": true}, {"text": "Si se paga con tarjeta o en efectivo", "correct": false}, {"text": "Si es fijo o variable", "correct": false}], "feedback": "El gasto intencional refleja una decisión actual; el gasto por costumbre continúa sobre todo porque ya existía."}, {"prompt": "¿Qué es un gasto opcional?", "options": [{"text": "Un gasto exigido para atender las necesidades básicas", "correct": false}, {"text": "Un gasto que mejora la comodidad o el disfrute, sin ser obligatorio", "correct": true}, {"text": "Cualquier gasto que se paga de forma automática", "correct": false}, {"text": "Un pago exigido por un acreedor", "correct": false}], "feedback": "El gasto opcional queda fuera de lo esencial; el presupuesto le asigna un monto de forma deliberada."}, {"prompt": "¿Por qué los gastos recurrentes pequeños pueden volverse relevantes?", "options": [{"text": "Porque aumentan tu credit utilization", "correct": false}, {"text": "Porque se repiten, y el total del año puede ser alto", "correct": true}, {"text": "Porque siempre se cobran el mismo día", "correct": false}, {"text": "Porque se informan a los credit bureaus", "correct": false}], "feedback": "La repetición es lo que vuelve relevantes los montos pequeños: $36 por mes son $432 por año."}, {"prompt": "¿Qué es un gasto irregular?", "options": [{"text": "Un gasto que nunca se repite", "correct": false}, {"text": "Un costo que no ocurre todos los meses, como un seguro anual o el mantenimiento del carro", "correct": true}, {"text": "Cualquier gasto que no planeaste", "correct": false}, {"text": "Un gasto pagado con tarjeta de crédito", "correct": false}], "feedback": "Los gastos irregulares no ocurren todos los meses. Muchos de ellos aun así son previsibles."}, {"prompt": "¿Por qué los gastos irregulares previsibles pueden entrar en el presupuesto?", "options": [{"text": "Porque suelen ser pequeños", "correct": false}, {"text": "Porque en general sabes que vienen y puedes estimar el costo", "correct": true}, {"text": "Porque los acreedores lo exigen", "correct": false}, {"text": "Porque se cobran todos los meses", "correct": false}], "feedback": "Un gasto que llega todos los años es una sorpresa conocida; se puede planear con anticipación."}, {"prompt": "¿Qué es un sinking fund?", "options": [{"text": "Una cuenta de ahorro solo para emergencias", "correct": false}, {"text": "Dinero apartado poco a poco para un gasto futuro que ya conoces", "correct": true}, {"text": "Un tipo de préstamo usado para cubrir costos irregulares", "correct": false}, {"text": "Una función de la tarjeta que aplaza pagos", "correct": false}], "feedback": "El sinking fund acumula dinero para un gasto que esperas, para que no llegue como un susto."}, {"prompt": "Si un gasto anual es de $1,200, ¿cuánto apartarías por mes?", "options": [{"text": "$50", "correct": false}, {"text": "$100", "correct": true}, {"text": "$120", "correct": false}, {"text": "$200", "correct": false}], "feedback": "$1,200 divididos entre 12 dan $100 por mes."}, {"prompt": "¿Cuál es la diferencia entre un sinking fund y un fondo de emergencia?", "options": [{"text": "El sinking fund es para los gastos que esperas; el fondo de emergencia es para lo que no se puede prever", "correct": true}, {"text": "El sinking fund es exigido por los acreedores", "correct": false}, {"text": "El fondo de emergencia solo puede usarse para costos médicos", "correct": false}, {"text": "Los dos son lo mismo", "correct": false}], "feedback": "Los sinking funds son planeados; los fondos de emergencia cubren lo que no se planeó."}, {"prompt": "¿Por qué el presupuesto debe revisarse con regularidad?", "options": [{"text": "Porque los acreedores exigen reportes mensuales", "correct": false}, {"text": "Porque comparar el plan con el gasto real muestra lo que hay que ajustar", "correct": true}, {"text": "Porque los presupuestos expiran en 30 días", "correct": false}, {"text": "Porque el credit score depende de eso", "correct": false}], "feedback": "La comparación entre lo planeado y lo realizado es lo que vuelve útil el presupuesto con el tiempo."}, {"prompt": "¿Qué enfoque describe mejor un buen presupuesto?", "options": [{"text": "Gastar lo mínimo posible en todas las categorías", "correct": false}, {"text": "Asignar el ingreso a categorías con anticipación, incluidos el ahorro y los gastos irregulares, y revisar los resultados", "correct": true}, {"text": "Dar seguimiento a los gastos solo cuando el dinero aprieta", "correct": false}, {"text": "Concentrar todos los gastos en una sola tarjeta", "correct": false}], "feedback": "Un buen presupuesto alinea el gasto con el ingreso y con las prioridades, y se revisa y se ajusta con el tiempo."}], "quizIntro": "Responde las 15 preguntas a continuación para poner a prueba lo que entendiste sobre el presupuesto y los gastos recurrentes. Elige la mejor respuesta para cada una.", "summary": [{"type": "p", "text": "En este módulo aprendiste:"}, {"type": "ul", "items": ["Qué es un presupuesto y cuáles son las seis categorías que contempla un presupuesto práctico;", "La diferencia entre gastos fijos y variables, y por qué fijo no quiere decir necesario;", "Cómo identificar gastos recurrentes y evaluarlos por su costo anual;", "Cómo distinguir un gasto intencional de un gasto por costumbre;", "En qué se diferencian las necesidades, los deseos y las prioridades financieras, y por qué las prioridades mantienen realista el presupuesto;", "Un método de seis pasos para armar tu presupuesto mensual;", "La diferencia entre gastos irregulares previsibles, costos estacionales y gastos de verdad inesperados;", "Cómo los sinking funds convierten los gastos anuales en cuotas mensuales, y en qué se diferencian del fondo de emergencia;", "Cómo comparar el gasto planeado con el real y ajustar el plan;", "Ideas equivocadas comunes sobre el presupuesto y la visión más precisa de cada una."]}], "reflection": ["¿Qué categoría de gasto te sorprendió más cuando pensaste en su total mensual o anual?", "¿Qué gasto recurrente de tu presupuesto te entrega más valor? ¿Y cuál te entrega menos?", "¿Qué gasto irregular te crearía más estrés financiero si tuvieras que pagarlo mañana?"], "actionTask": {"title": "Arma tu mapa de gastos de un mes", "steps": ["Enumera tus gastos recurrentes. Anota todo gasto mensual, trimestral o anual que tengas hoy, con el costo anual de cada uno.", "Identifica un gasto irregular previsible. Estima su costo anual y divídelo entre doce para encontrar la reserva mensual que te exigiría.", "Elige un ajuste de gasto para los próximos 30 días. Puede ser cancelar una suscripción sin uso, reducir un gasto por costumbre, empezar un sinking fund, definir un límite para una categoría opcional o dirigir dinero a una prioridad financiera."]}, "disclaimer": "Este módulo es educativo y fue hecho para ayudarte a entender cómo funcionan el presupuesto y los gastos recurrentes. No constituye asesoría legal, financiera, de inversión ni de reparación de crédito. Para orientación sobre tu situación específica, consulta a un profesional calificado.", "practiceIntro": "Para cerrar este módulo, tómate unos minutos para reflexionar sobre lo que aprendiste antes de hacer la tarea práctica. No hay respuestas correctas ni incorrectas. El objetivo es conectar el contenido con tu propia situación financiera.", "taskPurpose": "Aplicar lo que aprendiste en este módulo a tu propia situación financiera, por medio de una acción concreta y de bajo riesgo esta semana.", "taskInstruction": "Haz los tres pasos a continuación antes del fin de semana:"}, "4": {"n": 4, "title": "Entendiendo los cargos y los intereses", "subtitle": "Cargos por pago atrasado, cargos por saldo negativo, suscripciones innecesarias y el precio real de arrastrar un saldo de un mes al otro.", "meta": "9 Lecciones · 12 Preguntas · 1 Tarea práctica · Tiempo estimado: 30 minutos · Nivel: Intermedio", "overview": [{"type": "p", "text": "Los cargos y los intereses pasan desapercibidos porque suelen aparecer después de que la decisión financiera ya fue tomada. Una cuota mensual parece cómoda mientras los intereses se acumulan en segundo plano. Una cuenta bancaria parece gratuita hasta que se activa un saldo negativo, un retiro en un cajero de otra red o un cargo de mantenimiento. Una suscripción parece barata hasta que ves el monto mensual como un compromiso anual."}, {"type": "p", "text": "Este módulo explica cómo funcionan los cargos y los intereses más comunes en tarjetas, cuentas bancarias, préstamos y servicios recurrentes. El enfoque está en el costo total: qué dispara un cobro, cómo se acumula con el tiempo el costo de pedir prestado y cuáles comportamientos del día a día reducen gastos innecesarios."}, {"type": "callout", "label": "Objetivo de aprendizaje", "text": "Identificar los cargos y los intereses más comunes del sistema financiero estadounidense y entender cómo evitar costos innecesarios."}], "lessons": [{"n": 1, "title": "Los cargos y los intereses son costos distintos", "blocks": [{"type": "p", "text": "Un producto financiero puede costarte dinero de más de una forma. Dos de los costos más comunes son los cargos y los intereses, y entender la diferencia facilita comparar cuentas y decisiones de crédito."}, {"type": "p", "lead": "Los cargos", "text": "son cobros específicos que se disparan por una característica de la cuenta, una transacción, un servicio o un comportamiento. Ejemplos: cuota anual, cargo por saldo negativo, cargo por retiro en un cajero de otra red, cargo de apertura de un préstamo o multa por pago atrasado."}, {"type": "p", "lead": "Los intereses", "text": "son el costo de usar dinero prestado a lo largo del tiempo. Suelen expresarse como una tasa, por ejemplo el APR, y el monto que pagas depende del saldo, de la tasa, del tiempo que el saldo queda abierto y del método de cálculo del producto."}, {"type": "table", "head": ["Costo", "Cómo funciona", "Ejemplos"], "rows": [["Cargo", "Cobro específico previsto en las condiciones del producto", "Cuota anual; multa por pago atrasado; cargo por retiro; cargo de apertura"], ["Intereses", "Costo que corre sobre el dinero prestado a lo largo del tiempo", "Intereses de tarjeta; intereses de préstamo personal; intereses de financiamiento de auto"]]}, {"type": "callout", "label": "Punto clave", "text": "El precio anunciado de un producto financiero no siempre es su costo total. Las tasas, los cargos, los plazos y tu propio comportamiento influyen en lo que acabas pagando."}]}, {"n": 2, "title": "El APR y cómo se acumulan los intereses", "blocks": [{"type": "p", "text": "El APR, o Annual Percentage Rate, expresa el costo anualizado de pedir prestado según las condiciones aplicables. Resulta útil porque crea una tasa común para comparar el costo de distintos préstamos, aunque el monto en dólares depende de cómo funciona la cuenta."}, {"type": "p", "text": "Para una estimación educativa simple, multiplicar el saldo por el APR da una idea del costo anual de intereses si el saldo se mantuviera igual durante un año entero. Por ejemplo, un saldo de $2,000 a un APR de 20% da alrededor de $400 de intereses en el año, antes de considerar pagos, compras nuevas, cálculo por saldo diario o capitalización."}, {"type": "p", "text": "Las tarjetas de crédito suelen calcular los intereses usando saldos diarios o el saldo promedio diario. Los préstamos a plazos pueden usar un cronograma fijo en el que cada cuota incluye principal e intereses. Como los métodos varían, el contrato y el estado de cuenta de tu cuenta son la mejor fuente para entender la mecánica de un producto específico."}, {"type": "callout", "label": "Nota educativa", "text": "El APR sirve como herramienta de comparación y no como pronóstico exacto de los intereses que vas a pagar. El costo real depende del saldo, del momento de los pagos y de las condiciones de la cuenta."}]}, {"n": 3, "title": "El costo real de arrastrar un saldo", "blocks": [{"type": "p", "text": "Llevar un saldo de un mes al otro convierte una compra común en algo bastante más caro. Mientras más tiempo queda abierto el saldo, más tiempo tienen los intereses para acumularse."}, {"type": "p", "text": "La tabla de abajo trae estimaciones anuales simplificadas, suponiendo que el saldo se mantenga igual durante un año. Sirve para mostrar el orden de magnitud y no para reproducir el cálculo exacto de una tarjeta específica."}, {"type": "table", "head": ["Saldo", "APR ilustrativo", "Intereses anuales aproximados"], "rows": [["$500", "20%", "~$100"], ["$1,000", "24%", "~$240"], ["$2,500", "24%", "~$600"], ["$5,000", "28%", "~$1,400"]]}, {"type": "callout", "label": "Atención", "text": "Son estimaciones educativas. Los intereses reales dependen de las condiciones de tu tarjeta, de los saldos diarios o promedio, de la capitalización, de las transacciones nuevas y de los pagos hechos durante el año."}, {"type": "callout", "label": "Punto clave", "text": "El costo de arrastrar un saldo no aparece en el precio de la compra. Antes de financiar una compra, piensa en lo que puede costarte ese saldo si queda abierto durante varios ciclos de facturación."}]}, {"n": 4, "title": "La multa por pago atrasado y el costo de perder la fecha de vencimiento", "blocks": [{"type": "p", "text": "Un pago atrasado genera más de un costo. Según las condiciones de la cuenta y el tamaño del atraso, las consecuencias pueden incluir una multa, intereses adicionales, la pérdida de una tasa promocional o un registro negativo en tu historial de crédito."}, {"type": "p", "text": "Tres hábitos reducen el riesgo de un atraso por descuido:"}, {"type": "ul", "items": ["Programa un recordatorio en el calendario algunos días antes del vencimiento.", "Usa el pago automático por lo menos del pago mínimo exigido, cuando eso quepa en tu flujo de caja.", "Revisa los estados de cuenta en lugar de suponer que el monto adeudado siempre es el mismo."]}, {"type": "p", "text": "Si ya sabes que tal vez no puedas hacer un pago exigido, buscar al acreedor antes del vencimiento suele ser más útil que esperar a que la cuenta entre en atraso. Las opciones varían de un acreedor a otro y no están garantizadas."}, {"type": "callout", "label": "Punto clave", "text": "La multa es solo el costo visible. Un pago perdido también puede afectar el costo y la situación de la cuenta en el largo plazo."}]}, {"n": 5, "title": "Saldo negativo, pagos devueltos y cargos bancarios", "blocks": [{"type": "p", "text": "Las cuentas corrientes también generan cargos cuando el movimiento y el saldo disponible no se encuentran. Ejemplos comunes:"}, {"type": "table", "head": ["Cargo o cobro", "Qué lo puede disparar"], "rows": [["Cargo por saldo negativo (overdraft fee)", "Una transacción se paga incluso sin saldo suficiente en la cuenta, según las políticas del banco y la configuración de tu cuenta."], ["Cargo por pago devuelto o fondos insuficientes", "Un pago o una transacción se devuelve por falta de saldo, cuando lo permiten las condiciones de la cuenta."], ["Maintenance fee mensual", "Cobro recurrente de la cuenta, que a veces se dispensa cuando se cumplen ciertas condiciones."], ["Cargo por retiro en un cajero de otra red", "Cobro que puede aplicarse cuando usas un cajero automático fuera de tu banco o de la red de tu cuenta."], ["Cargo por transferencia o envío urgente", "Cobro por ciertos servicios de transferencia, según la institución y el método usado."]]}, {"type": "p", "text": "La forma más eficaz de entender estos costos es revisar la tabla de cargos de tu propia cuenta e identificar cuáles cobros se pueden evitar con alertas de saldo, ajustes en la configuración u otros medios de transacción."}, {"type": "callout", "label": "Nota educativa", "text": "Las polít
