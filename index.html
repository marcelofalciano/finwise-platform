icas de los bancos y las protecciones al consumidor varían según el tipo de transacción y de cuenta. Usa los documentos actuales de tu institución para conocer las reglas que aplican en tu caso."}]}, {"n": 6, "title": "Suscripciones y renovación automática", "blocks": [{"type": "p", "text": "Las suscripciones no siempre se clasifican como cargos de un producto financiero, aunque se comportan de forma parecida en el presupuesto, porque se repiten solas y pueden continuar después de que dejaste de usar el servicio."}, {"type": "p", "text": "La manera más fácil de evaluar una suscripción es convertir el monto mensual en un compromiso anual."}, {"type": "table", "head": ["Cobro mensual", "Costo anual"], "rows": [["$7.99", "Cerca de $96"], ["$14.99", "Cerca de $180"], ["$24.99", "Cerca de $300"], ["$49.99", "Cerca de $600"]]}, {"type": "p", "text": "Los periodos de prueba gratuita también se vuelven un gasto recurrente cuando la prueba se convierte automáticamente en un plan pago. El comportamiento que importa es verificar si cada cobro recurrente todavía refleja una decisión actual, en lugar de eliminar toda suscripción."}, {"type": "callout", "label": "Punto clave", "text": "Un cobro automático pequeño se convierte en un gasto anual relevante. Revisa los cobros recurrentes por su costo anual y no solo por el monto del mes."}]}, {"n": 7, "title": "Cargos de préstamo y el costo total de pedir prestado", "blocks": [{"type": "p", "text": "Los préstamos pueden tener costos más allá de la tasa de interés informada. Según el producto, eso incluye cargo de apertura, cargo de análisis, costos de cierre, condiciones de pago anticipado o productos adicionales opcionales."}, {"type": "p", "text": "Al comparar dos opciones de préstamo, mira más allá de la cuota mensual. Una cuota menor puede venir de un plazo más largo, lo que puede aumentar el total de intereses pagados."}, {"type": "table", "head": ["Pregunta que hacer", "Por qué importa"], "rows": [["¿Cuánto dinero recibo de verdad?", "Los cargos cobrados al inicio pueden reducir el monto que llega a tus manos."], ["¿Cuál es el APR o la tasa aplicada?", "La tasa determina la velocidad con la que se acumulan los intereses."], ["¿Cuántas cuotas se exigen?", "Un plazo más largo puede reducir la cuota y aumentar el costo total."], ["¿Cuál es el monto total pagado al final?", "Muestra el efecto combinado del principal, los intereses y los cobros aplicables."]]}, {"type": "callout", "label": "Punto clave", "text": "La cuota mensual más baja no corresponde automáticamente al préstamo más barato. Compara el monto total pagado y los cargos ligados al producto."}]}, {"n": 8, "title": "Comparar productos financieros por el costo total", "blocks": [{"type": "p", "text": "Una guía útil de comparación hace cuatro preguntas antes de elegir una cuenta o un producto de crédito:"}, {"type": "table", "head": ["Pregunta", "Qué revisar"], "rows": [["1. ¿Cuál tasa aplica?", "APR, tasa de interés o APY, según si estás pidiendo prestado o ahorrando."], ["2. ¿Cuáles cargos aplican?", "Cuota anual, mantenimiento, apertura, transferencia, atraso, retiro u otros cobros."], ["3. ¿Cuándo ocurren los costos?", "Al inicio, por mes, por año, después de un pago perdido, o solo cuando se usa una característica."], ["4. ¿Cómo salgo?", "Plazo de pago, reglas de cancelación, fin del periodo promocional y eventuales penalidades o condiciones."]]}, {"type": "p", "text": "Ejemplo: un producto puede anunciar exención de cuota anual y tener una tasa de interés más alta; otro puede cobrar cuota anual y ofrecer condiciones que encajan mejor con tu uso real de la cuenta. La mejor comparación parte de tu comportamiento esperado y no de un solo número destacado."}, {"type": "callout", "label": "Punto clave", "text": "Compara los costos que es probable que pagues, no todos los costos que podrían existir en teoría. Tu uso esperado del producto es lo que decide."}]}, {"n": 9, "title": "Confusiones comunes sobre cargos e intereses", "blocks": [{"type": "table", "head": ["Confusión común", "Entendimiento más preciso"], "rows": [["Una cuota mensual baja significa deuda barata.", "Un plazo más largo reduce la cuota y aumenta el total de intereses pagados."], ["El APR y los cargos son lo mismo.", "El APR describe el costo de pedir prestado como una tasa; los cargos son cobros separados previstos en el contrato."], ["Si el cargo es pequeño, no hace diferencia.", "Los cargos pequeños y recurrentes se vuelven relevantes cuando se repiten durante el año."], ["La protección contra saldo negativo significa que las transacciones son gratuitas.", "Los servicios de overdraft y la configuración de la cuenta pueden implicar cobros; revisa las condiciones de tu banco."], ["Una tasa promocional es permanente.", "Las condiciones promocionales en general tienen reglas y fecha de vencimiento."], ["Pagar el mínimo evita los intereses.", "El pago mínimo mantiene la cuenta al día, aunque el saldo abierto puede seguir generando intereses."], ["La cuota anunciada es el costo total.", "El costo total también depende del plazo, de los intereses y de los cargos aplicables."]]}, {"type": "callout", "label": "Punto clave", "text": "Buena parte de los costos financieros innecesarios viene de mirar un solo número, la cuota mensual, la cuota anual o la tasa anunciada, en lugar de la estructura completa de costos."}]}], "quiz": [{"prompt": "¿Cuál afirmación describe mejor la diferencia entre un cargo y los intereses?", "options": [{"text": "El cargo siempre es opcional, mientras que los intereses son exigidos por ley", "correct": false}, {"text": "El cargo es un cobro específico; los intereses son el costo de usar dinero prestado a lo largo del tiempo", "correct": true}, {"text": "Los intereses solo aplican a cuentas bancarias; los cargos solo aplican a préstamos", "correct": false}, {"text": "Cargo e intereses son dos nombres para el mismo costo", "correct": false}], "feedback": "El cargo es un cobro específico previsto en las condiciones del producto. Los intereses son el costo de usar dinero prestado a lo largo del tiempo."}, {"prompt": "¿Qué representa el APR en general?", "options": [{"text": "Tu ingreso anual total", "correct": false}, {"text": "El costo anualizado de pedir prestado según las condiciones aplicables", "correct": true}, {"text": "El monto que ya pagaste de vuelta", "correct": false}, {"text": "El porcentaje de tu saldo bancario que está asegurado", "correct": false}], "feedback": "El APR es una medida anualizada de la tasa del préstamo. El monto efectivo en dólares depende del saldo, del momento, de los pagos y de las condiciones de la cuenta."}, {"prompt": "Usando una estimación simplificada, ¿cuánto daría de intereses anuales un saldo de $1,000 a un APR de 24%, si el saldo se mantuviera igual durante un año?", "options": [{"text": "$24", "correct": false}, {"text": "$120", "correct": false}, {"text": "$240", "correct": true}, {"text": "$2,400", "correct": false}], "feedback": "La estimación simplificada es $1,000 x 24% = cerca de $240. El cálculo real de los intereses de una tarjeta puede ser distinto."}, {"prompt": "¿Cuál acción ayuda más a evitar intereses sobre compras nuevas cuando existe grace period?", "options": [{"text": "Pagar solo el pago mínimo", "correct": false}, {"text": "Pagar el saldo completo del estado de cuenta hasta la fecha de vencimiento", "correct": true}, {"text": "Mantener la tarjeta por debajo del límite", "correct": false}, {"text": "Hacer por lo menos una compra por mes", "correct": false}], "feedback": "Cuando el grace period aplica, pagar el saldo completo del estado de cuenta hasta la fecha de vencimiento en general evita los intereses sobre las compras nuevas."}, {"prompt": "¿Cuál de estos es un ejemplo de costo recurrente de una cuenta?", "options": [{"text": "Un maintenance fee mensual", "correct": true}, {"text": "Tu límite de crédito disponible", "correct": false}, {"text": "Tu saldo de ahorros", "correct": false}, {"text": "Tu credit score", "correct": false}], "feedback": "El maintenance fee mensual se repite en intervalos fijos, a menos que las condiciones de la cuenta prevean una exención o que aplique otra situación."}, {"prompt": "¿Por qué una suscripción de $25 por mes puede ser financieramente relevante?", "options": [{"text": "Porque toda suscripción afecta el credit score", "correct": false}, {"text": "Porque representa $300 a lo largo de un año", "correct": true}, {"text": "Porque los cobros mensuales siempre son más caros que los anuales", "correct": false}, {"text": "Porque las suscripciones no se pueden cancelar", "correct": false}], "feedback": "Anualizar los costos recurrentes muestra el compromiso completo: $25 por mes equivalen a $300 por año."}, {"prompt": "¿Por qué vale la pena comparar el monto total pagado en un préstamo?", "options": [{"text": "Porque combina el efecto del principal, los intereses y los costos aplicables a lo largo del plazo", "correct": true}, {"text": "Porque muestra tu credit score", "correct": false}, {"text": "Porque garantiza que el préstamo te quepa en el bolsillo", "correct": false}, {"text": "Porque define si el acreedor tiene seguro", "correct": false}], "feedback": "El monto total pagado da un retrato más amplio que la cuota mensual por sí sola."}, {"prompt": "¿Cuál afirmación sobre una cuota mensual menor es correcta?", "options": [{"text": "Significa siempre que el préstamo cuesta menos", "correct": false}, {"text": "Puede venir de un plazo más largo y aumentar el total de intereses pagados", "correct": true}, {"text": "Garantiza un APR menor", "correct": false}, {"text": "Significa que no hay cargos", "correct": false}], "feedback": "Un plazo más largo reduce la cuota y aumenta el tiempo durante el cual corren los intereses."}, {"prompt": "¿Cuál es la mejor primera fuente para entender los cargos de tu cuenta corriente?", "options": [{"text": "Un amigo que usa otro banco", "correct": false}, {"text": "La tabla de cargos actual y los documentos de tu institución", "correct": true}, {"text": "Un sitio de credit score", "correct": false}, {"text": "Una calculadora de financiamiento de vivienda", "correct": false}], "feedback": "Los cargos varían por cuenta y por institución, así que los documentos actuales de tu cuenta son la fuente más relevante."}, {"prompt": "¿Cuál de estas acciones tiene más chance de reducir las multas por atraso accidental?", "options": [{"text": "Ignorar los estados de cuenta mensuales", "correct": false}, {"text": "Programar recordatorios de pago o un débito automático adecuado", "correct": true}, {"text": "Abrir varias cuentas nuevas", "correct": false}, {"text": "Pagar solo cuando llega un aviso de cobro", "correct": false}], "feedback": "Los recordatorios y los pagos automáticos bien administrados reducen el riesgo de perder una fecha de vencimiento."}, {"prompt": "Al comparar dos productos financieros, ¿cuál factor considerar?", "options": [{"text": "Solo la tasa anunciada", "correct": false}, {"text": "Solo la cuota anual", "correct": false}, {"text": "La tasa, los cargos, el momento de los cobros y cómo esperas usar el producto", "correct": true}, {"text": "Solo las recompensas ofrecidas", "correct": false}], "feedback": "El costo total depende de varios atributos y de tu comportamiento esperado, no de un único número destacado."}, {"prompt": "¿Cuál afirmación es más precisa sobre las tasas promocionales?", "options": [{"text": "Siempre son permanentes", "correct": false}, {"text": "En general tienen reglas, condiciones y fecha de vencimiento", "correct": true}, {"text": "Eliminan todos los cargos", "correct": false}, {"text": "No exigen pago", "correct": false}], "feedback": "Las condiciones promocionales normalmente tienen reglas y un periodo definido. Verifica qué pasa cuando la promoción termina."}], "quizIntro": "Responde las 12 preguntas a continuación para poner a prueba lo que entendiste sobre cargos e intereses. Elige la mejor respuesta en cada una.", "summary": [{"type": "p", "text": "En este módulo aprendiste:"}, {"type": "ul", "items": ["La diferencia entre un cargo y los intereses, y por qué los dos afectan el costo total de los productos financieros;", "Cómo el APR da una medida anualizada de la tasa del préstamo y por qué el monto en dólares depende de los saldos y del tiempo;", "Cómo arrastrar un saldo aumenta el costo real de las compras a lo largo del tiempo;", "Cómo las multas por atraso y los pagos perdidos generan costos inmediatos y de largo plazo;", "Cómo surgen los cargos por saldo negativo, pago devuelto, mantenimiento, retiro y transferencia en las cuentas bancarias;", "Por qué las suscripciones y las renovaciones automáticas deben evaluarse por su costo anual;", "Por qué los cargos de un préstamo, el plazo y el monto total pagado importan al comparar opciones de crédito;", "Una guía de cuatro preguntas para comparar productos financieros por el costo total esperado;", "Confusiones comunes sobre cargos e intereses y la visión más precisa de cada una."]}], "reflection": ["¿Alguna vez te cobraron un cargo que no entendiste bien en el momento? ¿Cuál fue?", "Si hoy arrastras un saldo en una tarjeta u otra cuenta rotativa, ¿sabes el APR aproximado y cuánto te cuesta mantener ese saldo?", "¿Cuál cargo o cobro de intereses podrías reducir o eliminar con un cambio específico de comportamiento?"], "actionTask": {"title": "Haz una auditoría de tus cargos de los últimos 3 meses", "steps": ["Revisa los estados de cuenta de los últimos tres meses del banco y de la tarjeta e identifica todo cargo o cobro de intereses que haya aparecido.", "Lista cada cobro e identifica qué lo disparó. Marca si parece evitable, recurrente o ligado a un préstamo.", "Toma una acción concreta para impedir que el cobro evitable más frecuente o más caro se repita."]}, "disclaimer": "Este módulo es educativo y fue hecho para ayudarte a entender cargos comunes, costos de préstamo y cobros financieros recurrentes. No constituye asesoría legal, financiera, de inversión, bancaria ni de reparación de crédito. Para orientación sobre tu situación específica, consulta a un profesional calificado.", "practiceIntro": "Para cerrar este módulo, reserva algunos minutos para reflexionar sobre lo que aprendiste antes de hacer la tarea práctica. No existen respuestas correctas ni incorrectas. El objetivo es conectar el contenido con tu propia situación financiera.", "taskPurpose": "Aplicar lo que aprendiste en este módulo a tu propia situación financiera, por medio de una acción concreta y de bajo riesgo esta semana.", "taskInstruction": "Haz los tres pasos a continuación antes del fin de la semana:"}, "5": {"n": 5, "title": "Estrategias de educación sobre deudas", "subtitle": "Guías prácticas para evaluar decisiones de deuda, comparar escenarios de pago y entender el costo real del crédito caro.", "meta": "10 Lecciones · 12 Preguntas · 1 Tarea práctica · Tiempo estimado: 35 minutos · Nivel: Intermedio", "overview": [{"type": "p", "text": "La deuda puede ser útil, necesaria, cara o peligrosa, según el motivo por el que se contrajo, cuánto cuesta y si el plan de pago cabe en el presupuesto real. El problema pocas veces es una deuda aislada. Está en la interacción entre tasa, saldo, plazo, flujo de caja y la posibilidad de que el endeudamiento nuevo siga mientras los saldos antiguos permanecen."}, {"type": "p", "text": "Este módulo trae una guía práctica para evaluar una deuda nueva antes de contraerla, mapear las obligaciones existentes, priorizar el pago, comparar opciones de consolidation y reducir los comportamientos que convierten un préstamo de corto plazo en un ciclo largo."}, {"type": "callout", "label": "Objetivo de aprendizaje", "text": "Desarrollar una guía para evaluar decisiones de deuda y entender cómo priorizar estrategias de pago que reducen el total de intereses a lo largo del tiempo."}], "lessons": [{"n": 1, "title": "La deuda es un compromiso sobre el ingreso futuro", "blocks": [{"type": "p", "text": "La deuda te permite usar dinero hoy y pagarlo con el ingreso de mañana. Esto puede ser útil cuando el préstamo financia algo importante o reparte un costo grande a lo largo del tiempo. Al mismo tiempo, toda deuda crea una obligación de pago futura."}, {"type": "p", "text": "La pregunta más útil apunta a tres cosas: si la deuda tiene un propósito claro, un costo comprensible y un plan de pago realista."}, {"type": "table", "head": ["Característica de la deuda", "Pregunta que debes hacerte"], "rows": [["Propósito", "¿Qué estoy financiando y por qué pedir prestado tiene sentido para esta compra o necesidad?"], ["Costo", "¿Qué tasa, qué fees y qué monto total voy a pagar?"], ["Plazo", "¿Por cuánto tiempo esta obligación va a estar en mi presupuesto?"], ["Capacidad de pago", "¿Puedo pagar la cuota sin sacrificar gastos esenciales ni recurrir a deuda nueva?"]]}, {"type": "callout", "label": "Punto clave", "text": "Pedir prestado mueve parte del gasto de hoy al presupuesto de mañana. La decisión de endeudarte se evalúa antes de gastar el dinero, y no solo cuando llega la cuenta."}]}, {"n": 2, "title": "Deuda productiva, necesaria y cara", "blocks": [{"type": "p", "text": "La deuda suele separarse en categorías como buena y mala. Esas etiquetas simplifican demasiado las decisiones reales. Una guía más útil mira el propósito, el costo, el riesgo y el plan de pago."}, {"type": "table", "head": ["Situación", "Qué evaluar"], "rows": [["Educación o inversión en la carrera", "El beneficio esperado, la tasa, la flexibilidad de pago y si existen alternativas más baratas."], ["Financiamiento de casa o de vehículo", "La capacidad de pago, el costo total, el plazo, el seguro y el mantenimiento, y el riesgo de comprometer ingreso futuro."], ["Préstamo en una emergencia", "Si el gasto de verdad es urgente, cuánto cuesta la deuda y cómo va a caber el pago después de que pase la emergencia."], ["Consumo de rutina financiado con APR alto", "Si la compra se puede posponer, reducir o pagar con lo que ya tienes, en lugar de volverse un saldo de largo plazo."]]}, {"type": "p", "text": "La categoría de la compra por sí sola no determina si la deuda es adecuada. Las condiciones y la capacidad de pago también cuentan."}, {"type": "callout", "label": "Punto clave", "text": "La calidad de una deuda se define por la decisión que hay detrás, más que por la etiqueta. Un propósito razonable igual sale caro si la tasa o la estructura de pago es desfavorable."}]}, {"n": 3, "title": "Cómo la deuda cara se vuelve un ciclo", "blocks": [{"type": "p", "text": "La high-interest debt rotativa se vuelve difícil de dejar atrás cuando el gasto nuevo entra más rápido de lo que se pagan los saldos antiguos. Los intereses aumentan el monto que hay que liquidar, mientras los pagos mínimos hacen que el progreso parezca lento."}, {"type": "p", "text": "Un ciclo común es este:"}, {"type": "table", "head": ["Etapa", "Qué pasa"], "rows": [["1. Falta", "El gasto de rutina supera el dinero disponible."], ["2. Préstamo", "Una tarjeta u otra deuda cubre la diferencia."], ["3. Intereses", "El saldo pendiente se vuelve más caro con el tiempo."], ["4. Menos holgura", "Más del ingreso del mes siguiente tiene que ir a pagos de deuda."], ["5. Nueva falta", "Queda menos dinero para los gastos corrientes, lo que presiona a pedir prestado de nuevo."]]}, {"type": "p", "text": "Romper el ciclo suele exigir trabajar en los dos lados a la vez: reducir el costo o el saldo de la deuda existente y reducir la necesidad de nuevos préstamos."}, {"type": "callout", "label": "Punto clave", "text": "Pagar deuda sin cambiar el problema de flujo de caja que la creó suele traer el mismo saldo de vuelta."}]}, {"n": 4, "title": "Pago mínimo y tiempo de liquidación", "blocks": [{"type": "p", "text": "El pago mínimo es el monto más bajo que se exige para mantener la cuenta al día según las condiciones del contrato. Cumple un requisito de la cuenta, y por sí solo no es necesariamente una estrategia de liquidación."}, {"type": "p", "text": "Cuando la tasa de interés es alta y el pago es pequeño, buena parte de ese pago puede ir a intereses en lugar de reducir el principal. Eso alarga bastante el tiempo de pago."}, {"type": "p", "text": "Tu estado de cuenta o el contrato del préstamo puede mostrar cuánto tiempo tomaría liquidar la deuda con distintos montos de pago. Mirar esos documentos vuelve más concreta la disyuntiva entre lo que cabe en el mes y el costo total."}, {"type": "callout", "label": "Nota educativa", "text": "Hacer por lo menos el pago exigido en todas las deudas sigue siendo esencial. Cualquier estrategia de pago extra empieza solo después de cubrir los pagos obligatorios y los costos esenciales de vida."}]}, {"n": 5, "title": "Evaluar una decisión de deuda", "blocks": [{"type": "p", "text": "Antes de asumir una deuda nueva, tres preguntas ayudan a decidir si la decisión tiene sentido financiero."}, {"type": "table", "head": ["Pregunta", "Por qué importa"], "rows": [["¿Cuál es el costo total?", "Considera el principal, los intereses, las fees y el monto total pagado a lo largo del plazo."], ["¿Se puede evitar?", "¿Esperar, ahorrar, reducir la compra o usar un recurso que ya tienes podría sustituir parte del préstamo o todo?"], ["¿Cuál es el plan de salida?", "Ten claro cómo y cuándo termina la deuda, incluyendo el monto de la cuota y la fecha prevista de liquidación."]]}, {"type": "p", "lead": "Una cuarta pregunta refuerza la guía:", "text": "¿qué pasa si mi ingreso o mis gastos cambian? Una cuota cómoda hoy puede volverse difícil si el presupuesto no tiene ninguna holgura."}, {"type": "callout", "label": "Principio clave", "text": "El carácter de una deuda depende del costo, del propósito, del riesgo y de que tengas un plan claro de pago antes de pedir prestado. Esos factores pesan más que cualquier etiqueta."}]}, {"n": 6, "title": "Mapea tu panorama actual de deudas", "blocks": [{"type": "p", "text": "La deuda se administra mejor cuando está visible en un solo lugar. Arma un mapa simple usando la factura o el estado de cuenta más reciente de cada obligación."}, {"type": "table", "head": ["Deuda", "Saldo", "APR / tasa", "Pago mínimo", "Tipo de tasa", "Notas"], "rows": [["Tarjeta A", "$3,200", "24%", "$95", "Variable", "Saldo rotativo"], ["Auto loan", "$14,500", "6,5%", "$420", "Fija", "Faltan 36 cuotas"], ["Student loan", "$8,000", "5,0%", "$110", "Fija", "Ejemplo ilustrativo"]]}, {"type": "p", "text": "Los números de arriba son solo ejemplos. Para tu propio mapa, usa estados de cuenta reales e incluye todas las obligaciones de las que eres responsable."}, {"type": "p", "text": "Campos útiles incluyen el saldo, el APR o la tasa de interés, el pago mínimo, la fecha de vencimiento, si la tasa es fija o variable y el periodo promocional cuando exista."}, {"type": "callout", "label": "Punto clave", "text": "El mapa de deudas convierte un problema emocional en un conjunto de saldos, tasas y obligaciones medibles."}]}, {"n": 7, "title": "Priorizar el pago: debt avalanche y debt snowball", "blocks": [{"type": "p", "text": "Después de hacer el pago exigido en todas las deudas, dos guías conocidas ayudan a decidir a dónde va un pago extra."}, {"type": "table", "head": ["Método", "Cómo funciona", "Disyuntiva"], "rows": [["Debt avalanche", "Dirige los pagos extras a la deuda de mayor APR y después a la siguiente.", "En general reduce al máximo el total de intereses cuando los demás factores son iguales."], ["Debt snowball", "Dirige los pagos extras al saldo más pequeño y después suma ese monto al saldo siguiente.", "Genera victorias visibles más rápido, algo que a algunas personas les resulta motivador."]]}, {"type": "p", "text": "Ninguno de los dos te libera de mantener todas las cuentas al día. La mejor estrategia de comportamiento es la que puedes seguir de forma consistente, sin crear deuda nueva en otro punto del presupuesto."}, {"type": "callout", "label": "Punto clave", "text": "El debt avalanche mira el costo de intereses desde el punto de vista matemático; el debt snowball mira el progreso visible desde el punto de vista del comportamiento. La consistencia cuenta en los dos casos."}]}, {"n": 8, "title": "Consolidation, refinanciamiento y balance transfer", "blocks": [{"type": "p", "text": "La consolidation o el refinanciamiento pueden reducir el costo cuando un producto nuevo sustituye deuda más cara por una tasa efectiva menor. Transferir un saldo, por sí solo, deja la deuda en el mismo tamaño."}, {"type": "p", "text": "Antes de refinanciar o transferir deuda, revisa:"}, {"type": "ul", "items": ["El nuevo APR y si es fijo, variable o promocional;", "Las fees de apertura, de transferencia o de cierre;", "El plazo de pago y el monto total que se espera pagar;", "Qué tasa pasa a aplicar cuando termina el periodo promocional;", "Si las cuentas antiguas van a seguir disponibles para nuevos gastos;", "Si la nueva cuota de verdad cabe en tu presupuesto."]}, {"type": "p", "text": "Una cuota más baja ayuda al flujo de caja, y un plazo más largo aumenta el total de intereses pagados. Compara la estructura completa."}, {"type": "callout", "label": "Punto clave", "text": "La consolidation cambia la estructura de la deuda. El patrón de gasto o de flujo de caja que está detrás sigue en pie, a menos que ese patrón también cambie."}]}, {"n": 9, "title": "Evitar deuda nueva mientras pagas la antigua", "blocks": [{"type": "p", "text": "Pagar deuda es más difícil cuando cada gasto inesperado crea un saldo nuevo. Una reserva pequeña de dinero ayuda a separar los imprevistos de rutina del endeudamiento."}, {"type": "p", "text": "Crear un poco de fricción también reduce el endeudamiento por impulso:"}, {"type": "ul", "items": ["Haz una pausa antes de financiar compras no esenciales y compara el costo total con el precio de contado;", "Quita los datos de la tarjeta guardados en los sitios de compra si comprar con un clic se volvió costumbre;", "Mantén una reserva pequeña de emergencia o de flujo de caja, para que los costos inesperados menores no se vuelvan deuda de inmediato;", "Usa el presupuesto del Módulo 3 para planear gastos recurrentes e irregulares;", "Cuando liquides una deuda, decide con antelación a dónde va la cuota que quedó libre."]}, {"type": "callout", "label": "Punto clave", "text": "Un plan de pago funciona mejor cuando el endeudamiento nuevo también se atiende. Sin eso, la deuda cambia de cuenta sin disminuir de verdad."}]}, {"n": 10, "title": "Señales de alerta y cuándo pedir ayuda", "blocks": [{"type": "p", "text": "Los problemas con deuda son más fáciles de resolver antes de volverse una emergencia. Entre las señales de alerta:"}, {"type": "ul", "items": ["Perder pagos exigidos o pagarlos con atraso de forma repetida;", "Usar una deuda para pagar otra;", "Depender del crédito para gastos esenciales todos los meses porque el ingreso ya está comprometido;", "Recibir avisos de collections o evitar mirar los estados de cuenta porque los saldos parecen demasiado grandes;", "Usar cash advances de la tarjeta o crédito caro de forma repetida para cubrir gastos comunes del mes."]}, {"type": "p", "text": "Si tienes dificultad para pagar, acercarte a los acreedores temprano puede revelar opciones de renegociación o condiciones especiales. Las organizaciones de credit counseling sin fines de lucro también pueden ofrecer orientación y apoyo estructurado. Desconfía de cualquier empresa que prometa eliminación garantizada de deudas, te pida dejar de hablar con los acreedores sin explicar los riesgos, o exija pagos altos por adelantado sin servicios claros."}, {"type": "callout", "label": "Atención", "text": "La administración de deudas, los acuerdos, la bancarrota y los derechos legales traen consecuencias que dependen de la situación individual. Este módulo no ofrece asesoría legal."}]}], "quiz": [{"prompt": "¿Cuál afirmación describe mejor qué es la deuda?", "options": [{"text": "Dinero que nunca hay que devolver", "correct": false}, {"text": "Un compromiso sobre el ingreso futuro, creado al pedir prestado hoy", "correct": true}, {"text": "Cualquier gasto pagado con tarjeta", "correct": false}, {"text": "Solo el saldo de tarjeta de crédito con intereses altos", "correct": false}], "feedback": "La deuda te permite usar dinero hoy a cambio de una obligación de pago en el futuro."}, {"prompt": "¿Cuál combinación es más útil para evaluar una decisión de deuda?", "options": [{"text": "Propósito, costo, riesgo y plan de pago", "correct": true}, {"text": "Los puntos de la tarjeta, el límite y el color de la tarjeta", "correct": false}, {"text": "Solo la cuota mensual", "correct": false}, {"text": "Solo el ingreso", "correct": false}], "feedback": "La decisión de endeudarte es más amplia que la cuota mensual. El propósito, el costo total, el riesgo y el plan de pago también cuentan."}, {"prompt": "¿Cómo se forma un ciclo de deuda cara?", "options": [{"text": "Los intereses reducen el saldo automáticamente", "correct": false}, {"text": "Nuevos préstamos cubren la falta de caja mientras los intereses encarecen los saldos antiguos", "correct": true}, {"text": "Los pagos mínimos siempre eliminan el principal rápidamente", "correct": false}, {"text": "Los límites de crédito bajan todos los meses", "correct": false}], "feedback": "Cuando el endeudamiento nuevo continúa mientras los intereses corren sobre los saldos antiguos, más del ingreso futuro queda comprometido con deuda."}, {"prompt": "¿Qué es el pago mínimo?", "options": [{"text": "El monto ideal a pagar cada mes", "correct": false}, {"text": "El pago más bajo que exigen las condiciones de la cuenta", "correct": true}, {"text": "El monto que elimina todos los intereses", "correct": false}, {"text": "El saldo total que debes", "correct": false}], "feedback": "El pago mínimo es un requisito para mantener la cuenta al día; por sí solo no es necesariamente una estrategia eficiente de liquidación."}, {"prompt": "Antes de asumir una deuda, ¿cuál pregunta forma parte de la guía de tres preguntas?", "options": [{"text": "¿Cuál es el costo total?", "correct": true}, {"text": "¿Cuántos puntos voy a acumular?", "correct": false}, {"text": "¿Va a subir mi límite?", "correct": false}, {"text": "¿Puedo ignorar el vencimiento?", "correct": false}], "feedback": "El costo total es una de las preguntas centrales, junto con la posibilidad de evitar el préstamo y el plan de salida."}, {"prompt": "¿Qué información entra en un mapa de deudas?", "options": [{"text": "El saldo, el APR o la tasa, el pago mínimo y las condiciones relevantes", "correct": true}, {"text": "Solo el precio original de la compra", "correct": false}, {"text": "Solo la fecha de vencimiento", "correct": false}, {"text": "Solo el credit score ligado a la cuenta", "correct": false}], "feedback": "Un mapa útil vuelve medible cada obligación, listando saldo, tasa, pago exigido, vencimiento y condiciones relevantes."}, {"prompt": "¿Cuál método de liquidación ataca más directamente el costo total de intereses cuando los demás factores son iguales?", "options": [{"text": "Debt avalanche", "correct": true}, {"text": "Debt snowball", "correct": false}, {"text": "Pagar montos extras iguales en todas las cuentas para siempre", "correct": false}, {"text": "Abrir una tarjeta nueva para cada saldo", "correct": false}], "feedback": "El método debt avalanche dirige los pagos extras a la deuda de mayor APR y suele reducir al máximo el total de intereses cuando los demás factores son iguales."}, {"prompt": "¿Cuál es la principal ventaja de comportamiento del método debt snowball?", "options": [{"text": "Siempre produce el menor total de intereses", "correct": false}, {"text": "Genera victorias visibles más rápido al eliminar primero los saldos más pequeños", "correct": true}, {"text": "Elimina los pagos exigidos en las otras deudas", "correct": false}, {"text": "Convierte la deuda en ahorro", "correct": false}], "feedback": "El debt snowball trae motivación por el progreso visible, aunque puede no reducir los intereses con la misma eficiencia que el debt avalanche."}, {"prompt": "¿Cuál afirmación sobre la consolidation de deuda es más precisa?", "options": [{"text": "Elimina la deuda automáticamente", "correct": false}, {"text": "Puede cambiar la tasa y la estructura de pago, y la deuda todavía hay que pagarla", "correct": true}, {"text": "Garantiza un costo total menor", "correct": false}, {"text": "Elimina la necesidad de un presupuesto", "correct": false}], "feedback": "La consolidation cambia la estructura de la deuda. Que el costo total baje depende de la tasa, de las fees, del plazo y del comportamiento de pago."}, {"prompt": "¿Por qué una reserva pequeña de dinero ayuda a pagar deudas?", "options": [{"text": "Porque aumenta el APR de tus deudas", "correct": false}, {"text": "Porque reduce la necesidad de pedir prestado otra vez por imprevistos pequeños", "correct": true}, {"text": "Porque garantiza que los acreedores van a bajar tu tasa", "correct": false}, {"text": "Porque elimina todos los gastos recurrentes", "correct": false}], "feedback": "Una reserva de caja impide que un imprevisto pequeño se vuelva deuda nueva de inmediato."}, {"prompt": "¿Cuál es una señal de alerta de que la deuda puede estar volviéndose difícil de administrar?", "options": [{"text": "Revisar tus estados de cuenta todos los meses", "correct": false}, {"text": "Usar una deuda para pagar otra", "correct": true}, {"text": "Pagar más que el mínimo cuando se puede", "correct": false}, {"text": "Comparar tasas antes de pedir prestado", "correct": false}], "feedback": "Pedir prestado para pagar otro préstamo puede indicar que los pagos de deuda ya superaron el efectivo disponible."}, {"prompt": "Cuando prevés dificultad para hacer un pago exigido, ¿qué suele ser más constructivo que ignorar la cuenta?", "options": [{"text": "Acercarte al acreedor temprano para preguntar por las opciones disponibles", "correct": true}, {"text": "Tomar otro préstamo caro sin comparar condiciones", "correct": false}, {"text": "Parar todos los pagos sin evaluar las consecuencias", "correct": false}, {"text": "Sacar la cuenta de tu presupuesto", "correct": false}], "feedback": "Acercarte al acreedor antes de que la cuenta se atrase más puede revelar alternativas. La disponibilidad y las condiciones varían de un acreedor a otro."}], "quizIntro": "Responde las 12 preguntas que siguen para poner a prueba tu entendimiento sobre decisiones de deuda y estrategias de pago. Elige la mejor respuesta en cada una.", "summary": [{"type": "p", "text": "En este módulo aprendiste:"}, {"type": "ul", "items": ["Por qué la deuda se evalúa mejor por propósito, costo, riesgo y plan de pago que por una simple etiqueta de deuda buena o mala;", "Cómo el crédito caro crea un ciclo en el que el ingreso futuro queda cada vez más comprometido con saldos antiguos;", "Por qué los pagos mínimos mantienen las cuentas al día y aun así pueden no producir una liquidación eficiente;", "Una guía de tres preguntas para evaluar una deuda nueva: el costo total, la posibilidad de evitarla y el plan de salida;", "Cómo armar un mapa de deudas con saldos, tasas, pagos mínimos y condiciones de las cuentas;", "La diferencia entre los métodos debt avalanche y debt snowball y la disyuntiva que trae cada uno;", "Cómo evaluar consolidation, refinanciamiento y balance transfers por tasa, fees, plazo y comportamiento;", "Por qué una reserva de caja y un poco de fricción en los gastos reducen el riesgo de sustituir deuda pagada por deuda nueva;", "Señales de alerta comunes de que la deuda se está volviendo difícil de administrar y por qué actuar temprano hace la diferencia."]}], "reflection": ["¿Cuál decisión de deuda de tu pasado te enseñó más sobre el costo real de pedir prestado?", "Si hoy tienes deuda, ¿cuál saldo crea más presión en tu presupuesto mensual, y eso pasa por su tamaño, por la tasa o por la cuota exigida?", "¿Cuál cambio de comportamiento o de planeación reduciría tu necesidad de pedir prestado otra vez mientras pagas la deuda actual?"], "actionTask": {"title": "Mapea tu panorama actual de deudas", "steps": ["Lista todas las deudas que tienes hoy, con el saldo, el APR o la tasa de interés, el pago mínimo y la fecha de vencimiento de cada una. Si por ahora no tienes deuda, usa un ejemplo realista para practicar la guía.", "Identifica cuál deuda tiene el APR más alto y estima lo que esa tasa significa en el costo de cargar el saldo.", "Identifica un monto pequeño que podrías dirigir a tu prioridad de pago este mes, sin dejar de hacer los pagos exigidos ni recortar gastos esenciales."]}, "disclaimer": "Este módulo es educativo y está hecho para ayudarte a entender los costos de la deuda, las guías de pago y las decisiones comunes de administración de deudas. No constituye asesoría legal, financiera, de inversión, de acuerdo de deudas, de bancarrota ni de reparación de crédito. Para orientación sobre tu situación específica, consulta a un profesional calificado del área financiera o legal.", "practiceIntro": "Para cerrar este módulo, tómate unos minutos para reflexionar sobre lo que aprendiste antes de hacer la tarea práctica. No hay respuestas correctas ni incorrectas. El objetivo es conectar el contenido con tu propia situación financiera.", "taskPurpose": "Aplicar lo que aprendiste en este módulo a tu propia situación financiera, con una acción concreta y de bajo riesgo esta semana.", "taskInstruction": "Haz los tres pasos siguientes antes de que termine la semana:"}, "6": {"n": 6, "title": "Hábitos de ahorro y objetivos", "subtitle": "Construir hábitos consistentes de ahorro, estrategias de fondo de emergencia y cómo automatizar la disciplina financiera en tu rutina.", "meta": "9 Lecciones · 10 Preguntas · 1 Tarea práctica · Tiempo estimado: 30 minutos · Nivel: Intermedio", "overview": [{"type": "p", "text": "El ahorro suele tratarse como lo que sobra después de pagar todo. Así, ahorrar depende de la memoria, de la motivación y de que el mes haya salido bien. Un camino más confiable trata el ahorro como un sistema: una finalidad clara, una meta realista, un lugar donde guardar el dinero y un método repetible para llevar dinero hacia el objetivo."}, {"type": "p", "text": "Este módulo explica en qué se diferencia el fondo de emergencia del ahorro planificado, cómo convertir un objetivo en un monto mensual, por qué la automatización reduce la fricción de comportamiento, cómo empezar con una cantidad sostenible y cómo ajustar el sistema cuando el ingreso es irregular o las prioridades cambian."}, {"type": "callout", "label": "Objetivo de aprendizaje", "text": "Construir un hábito sostenible de ahorro, entendiendo cómo la automatización, la definición de objetivos y la planificación del fondo de emergencia reducen la vulnerabilidad financiera a lo largo del tiempo."}], "lessons": [{"n": 1, "title": "Por qué ahorrar importa", "blocks": [{"type": "p", "text": "El ahorro crea distancia entre un gasto inesperado y una deuda nueva. También te da más libertad en las decisiones planificadas: cambiar de trabajo, cubrir un deducible, reemplazar una computadora, mudarte de casa, pagar un curso o aprovechar una oportunidad sin depender solo del crédito."}, {"type": "p", "text": "El ahorro cumple tres funciones diferentes:"}, {"type": "table", "head": ["Función", "Finalidad"], "rows": [["Protección", "Crea un margen para gastos inesperados o para una interrupción temporal del ingreso."], ["Planificación", "Separa dinero para costos futuros conocidos, como un viaje, un seguro anual, educación o una compra grande."], ["Elección", "Da flexibilidad para decidir sin tener que financiar cada gasto."]]}, {"type": "callout", "label": "Punto clave", "text": "Ahorrar hace más que generar intereses. El primer valor financiero del ahorro es la flexibilidad: tener dinero disponible cuando el tiempo de la vida no coincide con el tiempo del sueldo."}]}, {"n": 2, "title": "Fondo de emergencia, sinking funds y ahorro por objetivo", "blocks": [{"type": "p", "text": "Objetivos de ahorro diferentes conviene mantenerlos separados en lugar de juntarlos en una sola bolsa de dinero."}, {"type": "table", "head": ["Tipo de ahorro", "Para qué sirve", "Ejemplo"], "rows": [["Fondo de emergencia (emergency fund)", "Gastos inesperados o interrupción del ingreso", "Reparación urgente del carro; pérdida temporal del trabajo; una factura médica inesperada"], ["Sinking fund", "Un gasto conocido que va a ocurrir más adelante", "Seguro anual; registro del vehículo; gastos de fin de año"], ["Ahorro por objetivo", "Un objetivo futuro específico", "Educación; costos de una mudanza; una compra planificada; un viaje"]]}, {"type": "p", "text": "La distinción importa porque el dinero destinado a una emergencia se agota rápido si también se usa para cuentas anuales previsibles. Las etiquetas claras ayudan a proteger la finalidad de cada saldo."}, {"type": "callout", "label": "Punto clave", "text": "El fondo de emergencia cubre lo que no puedes prever. El sinking fund cubre lo que sí prevés, pero no pagas todos los meses."}]}, {"n": 3, "title": "Convierte un objetivo en un monto mensual", "blocks": [{"type": "p", "text": "Un objetivo de ahorro se vuelve más concreto cuando tiene tres elementos: un monto específico, una fecha y una finalidad."}, {"type": "p", "text": "Ejemplo: quieres $1,200 para un curso profesional en doce meses. Al dividir $1,200 entre 12, la meta mensual queda en $100. Si ya tienes $300 guardados, te faltan $900, o $75 por mes a lo largo de doce meses."}, {"type": "table", "head": ["Objetivo", "Monto meta", "Tiempo disponible", "Monto mensual ilustrativo"], "rows": [["Primera etapa del fondo de emergencia", "$600", "6 meses", "$100"], ["Prima anual de seguro", "$1,200", "12 meses", "$100"], ["Fondo para una mudanza", "$2,400", "12 meses", "$200"]]}, {"type": "p", "text": "El monto mensual funciona como un número de planificación y puedes modificarlo. Si tu ingreso cambia, puedes cambiar la fecha, el monto o las dos cosas."}, {"type": "callout", "label": "Punto clave", "text": "Un objetivo sin monto y sin fecha es fácil de postergar. Convertir el objetivo en un monto mensual transforma la intención en un comportamiento repetible."}]}, {"n": 4, "title": "Por qué la automatización sostiene el hábito de ahorrar", "blocks": [{"type": "p", "text": "Ahorrar con consistencia se vuelve más difícil cuando exige una decisión nueva cada mes. La automatización elimina parte de esa decisión y acerca el ahorro a un comportamiento predeterminado."}, {"type": "table", "head": ["Enfoque", "Confiabilidad"], "rows": [["Transferencia manual cada mes", "Depende de la memoria y de la motivación mes a mes."], ["Transferencia automática el día del pago", "Consistente y reduce la posibilidad de que el dinero se gaste antes."], ["División del depósito directo por el empleador, cuando está disponible", "Dirige parte del ingreso al ahorro antes de que llegue a la cuenta de gastos."], ["Redondeo o transferencia por regla", "Crea un ahorro gradual y de baja fricción, aunque los montos pueden ser pequeños o variables."]]}, {"type": "p", "text": "La automatización igual necesita revisión. Una transferencia automática que te deja el saldo en negativo o te obliga a pedir prestado está demasiado agresiva para tu flujo de caja actual."}, {"type": "callout", "label": "Punto clave", "text": "La automatización reduce la necesidad de fuerza de voluntad repetida. El mejor monto automático es el que resulta sostenible para poder continuar."}]}, {"n": 5, "title": "Empieza en pequeño y hazlo crecer", "blocks": [{"type": "p", "text": "Mucha gente posterga el ahorro porque el monto posible le parece demasiado pequeño. Eso convierte una limitación temporal en una postergación permanente."}, {"type": "p", "text": "Empezar con $10, $25 u otra cantidad realista es útil porque primero construye la rutina. El monto puede subir después, cuando el ingreso aumente, cuando se liquide una deuda, cuando se elimine un gasto recurrente o cuando el presupuesto quede más estable."}, {"type": "p", "text": "Una regla simple de aumento consiste en subir el ahorro después de un evento positivo de caja. Por ejemplo, cuando canceles una suscripción de $60 por mes, puedes dirigir parte o todo ese monto al ahorro, en lugar de dejar que se diluya en el gasto general."}, {"type": "callout", "label": "Punto clave", "text": "Al principio, la consistencia importa más que el tamaño. Un hábito de ahorro que sobrevive un año vale más que una meta ambiciosa que se detiene en el primer mes."}]}, {"n": 6, "title": "Dónde guardar el ahorro de corto plazo", "blocks": [{"type": "p", "text": "El dinero destinado a emergencias o a objetivos cercanos suele necesitar dos cualidades: liquidez y estabilidad. La liquidez es poder acceder al dinero cuando lo necesitas. La estabilidad es que el saldo quede fuera del alcance de grandes oscilaciones de corto plazo."}, {"type": "p", "text": "Los lugares más comunes para el ahorro de corto plazo incluyen cuentas corrientes o de ahorro, high-yield savings accounts y otros productos equivalentes a efectivo. Al usar un banco o una credit union, verifica que la institución y la cuenta estén cubiertas por el seguro federal de depósito que corresponda y entiende los límites legales que aplican."}, {"type": "table", "head": ["Característica", "Por qué importa"], "rows": [["Acceso", "El dinero de la emergencia tiene que estar disponible cuando la emergencia ocurre."], ["Separación", "Una cuenta separada reduce el gasto accidental."], ["Rendimiento / APY", "Los intereses ayudan a que el saldo crezca, aunque el rendimiento queda en segundo plano frente al acceso y la estabilidad en el fondo de emergencia."], ["Cargos o saldo mínimo", "Los cobros de la cuenta pueden desgastar el valor de un saldo pequeño."]]}, {"type": "callout", "label": "Nota educativa", "text": "La inversión de largo plazo y el fondo de emergencia de corto plazo resuelven problemas diferentes. Este módulo trata del ahorro y de las reservas en efectivo, y no de la selección de inversiones."}]}, {"n": 7, "title": "Armando el fondo de emergencia por etapas", "blocks": [{"type": "p", "text": "Una meta grande de fondo de emergencia parece imposible cuando empiezas desde cero. Un enfoque por etapas vuelve el objetivo más práctico."}, {"type": "table", "head": ["Etapa", "Finalidad"], "rows": [["Etapa 1: primer margen pequeño", "Cubrir un costo inesperado menor sin recurrir en el momento a crédito caro."], ["Etapa 2: un mes de gastos esenciales", "Crear espacio para una interrupción mayor o una falla temporal del ingreso."], ["Etapa 3: reserva de plazo más largo", "Muchos materiales de educación financiera usan algunos meses de gastos esenciales como referencia de largo plazo, ajustada por la estabilidad y el riesgo de cada familia."]]}, {"type": "p", "text": "Algunos materiales educativos usan $500 a $1,000 como primera marca y tres a seis meses de gastos esenciales como referencia de largo plazo. Esas cifras funcionan como referencias generales, no como reglas. Una meta razonable depende de la estabilidad del ingreso, de las obligaciones de la familia, de la cobertura de seguros, de las necesidades de salud y del acceso a otros recursos."}, {"type": "callout", "label": "Punto clave", "text": "La primera finalidad del fondo de emergencia es reducir la probabilidad de que el próximo gasto inesperado se convierta en deuda cara. Alcanzar un número perfecto queda en segundo lugar."}]}, {"n": 8, "title": "Ahorrar con ingreso irregular", "blocks": [{"type": "p", "text": "Ahorrar se vuelve más difícil cuando el ingreso cambia de un mes a otro. Una transferencia mensual fija funciona mal cuando un mes es fuerte y el siguiente es flojo."}, {"type": "p", "text": "Entre las alternativas:"}, {"type": "ul", "items": ["Ahorrar un porcentaje de cada pago en lugar de un monto fijo;", "Basar el gasto esencial en una estimación conservadora del ingreso y dirigir parte de los meses mejores al ahorro;", "Formar un margen de caja de un mes antes de perseguir objetivos mayores;", "Usar una revisión trimestral para comparar el ingreso real con el presupuesto y hacer una transferencia adicional cuando la caja lo permita."]}, {"type": "p", "text": "El objetivo sigue siendo la consistencia, y la consistencia puede significar seguir la misma regla en lugar de transferir el mismo monto."}, {"type": "callout", "label": "Punto clave", "text": "Con ingreso irregular, una regla flexible de ahorro suele ser más sostenible que un monto fijo que solo funciona en los mejores meses."}]}, {"n": 9, "title": "Confusiones comunes sobre el ahorro", "blocks": [{"type": "table", "head": ["Confusión común", "Entendimiento más preciso"], "rows": [["Tengo que esperar a que mi ingreso aumente para empezar a ahorrar.", "Un monto pequeño y repetible ya establece el hábito ahora y puede crecer después."], ["Voy a ahorrar lo que sobre al final del mes.", "Ahorrar primero o automatizar la transferencia evita que el objetivo dependa solo de las sobras."], ["El fondo de emergencia y el ahorro para compras son lo mismo.", "Separar los dos ayuda a proteger el dinero de la emergencia de los gastos previsibles."], ["Un fondo de emergencia pequeño no sirve para nada.", "Incluso un margen modesto cubre parte o todo un gasto inesperado menor y reduce la dependencia de la deuda."], ["El mayor rendimiento siempre es el mejor lugar para el fondo de emergencia.", "El acceso, la estabilidad, los cargos y las condiciones de la cuenta importan junto con el rendimiento."], ["Una vez que automatizo el ahorro, ya nunca necesito revisarlo.", "La automatización se debe ajustar conforme cambian el ingreso, los gastos y los objetivos."], ["Ahorrar e invertir son lo mismo.", "El ahorro se enfoca en la liquidez y la estabilidad de corto plazo; la inversión en general acepta más incertidumbre a cambio de objetivos de crecimiento de largo plazo."]]}, {"type": "callout", "label": "Punto clave", "text": "El ahorro funciona como un sistema, y no como una meta aislada. El sistema funciona cuando el objetivo, la cuenta, el método de transferencia y la rutina de revisión coinciden con tu flujo de caja real."}]}], "quiz": [{"prompt": "¿Cuál es una finalidad financiera central del fondo de emergencia?", "options": [{"text": "Cubrir gastos inesperados sin tener que asumir deuda nueva de inmediato", "correct": true}, {"text": "Maximizar el retorno de las inversiones de largo plazo", "correct": false}, {"text": "Pagar solamente gastos anuales previsibles", "correct": false}, {"text": "Aumentar tu límite de crédito", "correct": false}], "feedback": "El fondo de emergencia sirve para absorber costos inesperados o interrupciones del ingreso, para que no toda sorpresa exija un préstamo nuevo."}, {"prompt": "¿Cuál es la diferencia entre un sinking fund y el fondo de emergencia?", "options": [{"text": "El sinking fund es para gastos futuros esperados; el fondo de emergencia es para necesidades imprevistas", "correct": true}, {"text": "El sinking fund se invierte en acciones; el fondo de emergencia tiene que estar en efectivo", "correct": false}, {"text": "El fondo de emergencia solo vale para gastos médicos", "correct": false}, {"text": "No hay diferencia", "correct": false}], "feedback": "Los sinking funds planifican gastos futuros conocidos. Los fondos de emergencia quedan guardados para eventos que no puedes prever con exactitud."}, {"prompt": "¿Qué vuelve más concreto un objetivo de ahorro?", "options": [{"text": "Un monto específico, una fecha y una finalidad", "correct": true}, {"text": "Un límite de crédito alto", "correct": false}, {"text": "Solamente un depósito inicial grande", "correct": false}, {"text": "Usar el mismo objetivo que todo el mundo", "correct": false}], "feedback": "El objetivo se vuelve más fácil de planificar cuando el monto, el plazo y la finalidad están claros."}, {"prompt": "¿Por qué las transferencias automáticas sostienen el hábito de ahorrar?", "options": [{"text": "Garantizan retornos altos de inversión", "correct": false}, {"text": "Reducen la necesidad de tomar una decisión nueva de ahorro cada mes", "correct": true}, {"text": "Eliminan todos los cargos bancarios", "correct": false}, {"text": "Vuelven el ingreso más previsible", "correct": false}], "feedback": "La automatización convierte el ahorro en el comportamiento predeterminado y reduce la dependencia de la memoria o de la fuerza de voluntad repetida."}, {"prompt": "¿Cuál afirmación describe mejor empezar con un monto pequeño de ahorro?", "options": [{"text": "No sirve de nada a menos que el monto sea grande", "correct": false}, {"text": "Construye consistencia y puede aumentar después, conforme mejora la caja", "correct": true}, {"text": "Siempre genera dinero suficiente para una reserva completa en un año", "correct": false}, {"text": "Te impide cambiar el objetivo más adelante", "correct": false}], "feedback": "Una transferencia pequeña y sostenible establece el hábito y puede crecer cuando el ingreso o los gastos cambien."}, {"prompt": "¿Cuáles cualidades suelen ser importantes para el ahorro de emergencia de corto plazo?", "options": [{"text": "Liquidez y estabilidad", "correct": true}, {"text": "Volatilidad máxima de mercado", "correct": false}, {"text": "Plazos largos de carencia", "correct": false}, {"text": "Alta capacidad de endeudamiento", "correct": false}], "feedback": "El fondo de emergencia debe ser accesible y estable, porque el momento de la emergencia es incierto."}, {"prompt": "¿Cuál es una forma razonable de armar un fondo de emergencia?", "options": [{"text": "Usar etapas, empezando con un margen menor y aumentando la meta con el tiempo", "correct": true}, {"text": "Esperar hasta poder guardar varios meses de gastos de una sola vez", "correct": false}, {"text": "Pedir prestado para formar el saldo de la reserva", "correct": false}, {"text": "Usar el fondo de emergencia para las cuentas rutinarias de cada mes", "correct": false}], "feedback": "El enfoque por etapas vuelve el objetivo más manejable y ya crea protección relevante en el camino."}, {"prompt": "¿Qué funciona mejor para quien tiene ingreso irregular?", "options": [{"text": "Ahorrar un porcentaje de cada pago o usar una regla flexible", "correct": true}, {"text": "Comprometerse con un monto que solo cabe en el mes de mayor ingreso", "correct": false}, {"text": "Nunca ahorrar hasta que el ingreso quede fijo", "correct": false}, {"text": "Usar la tarjeta de crédito en lugar del ahorro", "correct": false}], "feedback": "Una regla basada en cada pago se adapta a la variación del ingreso y preserva la consistencia."}, {"prompt": "¿Por qué es útil una cuenta de ahorro separada?", "options": [{"text": "Garantiza un credit score más alto", "correct": false}, {"text": "Crea una separación práctica y psicológica del gasto del día a día", "correct": true}, {"text": "Elimina todos los impuestos", "correct": false}, {"text": "Impide cualquier retiro", "correct": false}], "feedback": "La separación reduce el gasto accidental y deja más clara la finalidad de ese dinero."}, {"prompt": "¿Cuál afirmación sobre la automatización del ahorro es más precisa?", "options": [{"text": "Una vez configurada, nunca se debe modificar", "correct": false}, {"text": "Es útil, y el monto se debe revisar conforme cambian el ingreso, los gastos y los objetivos", "correct": true}, {"text": "Funciona solo para familias de ingreso alto", "correct": false}, {"text": "Garantiza que nunca más vas a necesitar deuda", "correct": false}], "feedback": "La automatización reduce la fricción, y un sistema sostenible igual necesita revisión y ajuste periódicos."}], "quizIntro": "Responde las 10 preguntas a continuación para poner a prueba lo que entendiste sobre hábitos de ahorro y objetivos. Elige la mejor respuesta en cada una.", "summary": [{"type": "p", "text": "En este módulo aprendiste:"}, {"type": "ul", "items": ["Por qué el ahorro crea flexibilidad financiera y reduce la necesidad de pedir prestado frente a gastos inesperados;", "La diferencia entre el fondo de emergencia, los sinking funds y el ahorro para objetivos específicos;", "Cómo convertir un monto meta y un plazo en un número mensual práctico de ahorro;", "Por qué la automatización reduce la fricción de comportamiento y vuelve el ahorro más consistente;", "Por qué empezar con un monto pequeño y sostenible suele funcionar mejor que esperar el momento perfecto;", "Qué significan la liquidez, la estabilidad, la separación de la cuenta, el rendimiento y los cargos para el ahorro de corto plazo;", "Cómo armar el fondo de emergencia por etapas, en lugar de tratar una meta grande como la única definición de éxito;", "Cómo una regla de ahorro por porcentaje o flexible funciona con ingreso irregular;", "Confusiones comunes sobre el ahorro y un entendimiento más práctico de cada una."]}], "reflection": ["¿Tienes un fondo de emergencia hoy? Si lo tienes, ¿qué tipo de gasto cubriría? Si no lo tienes, ¿qué te ha dificultado empezar?", "En tu vida financiera, ¿cuál es la diferencia entre ahorrar para un objetivo específico y ahorrar como hábito general?", "¿Qué pequeña acción automática de ahorro podrías configurar esta semana y mantener de forma realista durante los próximos tres meses?"], "actionTask": {"title": "Configura tu primera transferencia automática de ahorro", "steps": ["Elige un monto realista, aunque sea de $10 o $25, que puedas transferir automáticamente de forma recurrente sin afectar gastos esenciales.", "Configura una transferencia automática hacia una cuenta de ahorro separada el día de tu próximo pago o justo después, o define la regla exacta de transferencia que vas a usar si tu ingreso es irregular.", "Define un objetivo de ahorro de tres meses y escribe qué debe proteger o lograr ese dinero."]}, "disclaimer": "Este módulo es educativo y está hecho para ayudarte a entender los hábitos de ahorro, los fondos de emergencia, la automatización y la definición de objetivos financieros. No constituye asesoría legal, financiera, de inversión, bancaria ni tributaria. Para orientación sobre tu situación específica, consulta a un profesional calificado.", "practiceIntro": "Para cerrar este módulo, tómate unos minutos para reflexionar sobre lo que aprendiste antes de hacer la tarea práctica. No hay respuestas correctas ni incorrectas. El objetivo es conectar el contenido con tu propia situación financiera.", "taskPurpose": "Aplicar lo que aprendiste en este módulo a tu propia situación financiera, por medio de una acción concreta y de bajo riesgo esta semana.", "taskInstruction": "Haz los tres pasos a continuación antes del fin de semana:"}};
const GLOSSARY_ES = [{"term": "Annual Percentage Rate (APR)", "def": "El APR, o Annual Percentage Rate, representa el costo anualizado de pedir dinero prestado según las condiciones de la cuenta de crédito.", "m": 2, "l": 4}, {"term": "Annual Percentage Yield (APY)", "def": "El APY expresa el rendimiento anualizado de una cuenta de ahorros o de depósito. En un fondo de emergencia, el rendimiento es secundario frente al acceso y la estabilidad.", "m": 6, "l": 6}, {"term": "Authorized user", "def": "Si tienes un familiar o una persona cercana con historial de crédito sólido, que te incluyan como authorized user en su tarjeta puede hacer que su buen historial de pagos te beneficie a ti.", "m": 1, "l": 5}, {"term": "Automatic transfer", "def": "Transferencia recurrente programada con anticipación, muchas veces el día de pago, que lleva dinero a la cuenta de ahorros antes de que llegue a la cuenta de gastos. Convierte el ahorro en algo más parecido a un comportamiento predeterminado que a una decisión mensual.", "m": 6, "l": 4}, {"term": "Billing cycle", "def": "El billing cycle es el período en el que se registran las compras, los pagos, los créditos y otros movimientos de la cuenta.", "m": 2, "l": 2}, {"term": "Budget", "def": "Un presupuesto es un plan para el dinero que todavía no has gastado.", "m": 3, "l": 1}, {"term": "Cash-flow buffer", "def": "Pequeña reserva de dinero accesible, guardada para que los costos inesperados menores no se conviertan de inmediato en una deuda nueva.", "m": 6, "l": 8}, {"term": "Charge-Off", "def": "Cuando el acreedor da la deuda por pérdida; permanece en el reporte hasta por siete años", "m": 1, "l": 9}, {"term": "Credit", "def": "El crédito es la posibilidad de pedir dinero prestado o de acceder a bienes y servicios ahora, con el compromiso de pagar después.", "m": 1, "l": 1}, {"term": "Credit bureaus", "def": "Los credit bureaus, también llamados agencias de información al consumidor, reúnen y mantienen información sobre tu historial de préstamos y pagos, y organizan esos datos en credit reports.", "m": 1, "l": 2}, {"term": "Credit card", "def": "La tarjeta de crédito es una forma de crédito rotativo que te permite hacer compras con dinero del emisor, con el compromiso de devolver lo que usaste.", "m": 2, "l": 1}, {"term": "Credit counseling", "def": "Orientación y apoyo estructurado que ofrecen organizaciones, incluidas entidades sin fines de lucro, a personas que administran deudas. Desconfía de las empresas que prometen la eliminación garantizada de deudas o que exigen pagos altos por adelantado sin servicios claros.", "m": 5, "l": 10}, {"term": "Credit Freeze", "def": "Restricción que se coloca en tu expediente para impedir la apertura de cuentas nuevas sin autorización", "m": 1, "l": 9}, {"term": "Credit Limit", "def": "El monto máximo que estás autorizado a usar en una cuenta de crédito", "m": 1, "l": 9}, {"term": "Credit report", "def": "El credit report es el documento a partir del cual se calcula tu credit score.", "m": 1, "l": 6}, {"term": "Credit score", "def": "El credit score es un número de tres dígitos, normalmente entre 300 y 850, que resume qué tan confiable te consideran para recibir crédito, con base en tu historial.", "m": 1, "l": 3}, {"term": "Credit utilization", "def": "El credit utilization es cuánto del crédito rotativo estás usando en relación con los límites disponibles.", "m": 2, "l": 5}, {"term": "Credit-builder loan", "def": "Algunas credit unions y bancos comunitarios ofrecen credit-builder loans, préstamos pequeños hechos específicamente para ayudar a las personas a formar crédito.", "m": 1, "l": 5}, {"term": "Debt", "def": "La deuda es un compromiso sobre el ingreso futuro, creado al pedir prestado hoy. Toda deuda genera una obligación de pago que queda en tu presupuesto hasta que se liquida.", "m": 5, "l": 1}, {"term": "Debt avalanche", "def": "Método de pago que dirige los pagos extra primero a la deuda con el APR más alto y después a la siguiente. Suele redu
