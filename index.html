ks": [{"type": "p", "text": "APR, ou Annual Percentage Rate, expressa o custo anualizado de tomar emprestado segundo as condições aplicáveis. É útil porque cria uma taxa comum para comparar o custo de diferentes empréstimos, mas o valor em dólares depende de como a conta funciona."}, {"type": "p", "text": "Para uma estimativa educacional simples, multiplicar o saldo pelo APR dá uma ideia do custo anual de juros caso o saldo ficasse igual por um ano inteiro. Por exemplo, um saldo de US$ 2.000 a um APR de 20% dá cerca de US$ 400 de juros no ano, antes de considerar pagamentos, compras novas, cálculo por saldo diário ou capitalização."}, {"type": "p", "text": "Cartões de crédito costumam calcular juros usando saldos diários ou saldo médio diário. Empréstimos parcelados podem usar um cronograma fixo em que cada parcela inclui principal e juros. Como os métodos variam, o contrato e a fatura da sua conta são a melhor fonte para entender a mecânica de um produto específico."}, {"type": "callout", "label": "Nota educacional", "text": "O APR é uma ferramenta de comparação, não uma previsão exata dos juros que você vai pagar. O custo real depende do saldo, do momento dos pagamentos e das condições da conta."}]}, {"n": 3, "title": "O custo real de carregar saldo", "blocks": [{"type": "p", "text": "Levar saldo de um mês para o outro transforma uma compra comum em algo bem mais caro. Quanto mais tempo o saldo fica em aberto, mais tempo os juros têm para se acumular."}, {"type": "p", "text": "A tabela abaixo traz estimativas anuais simplificadas, supondo que o saldo fique igual por um ano. Ela serve para mostrar a ordem de grandeza, não para reproduzir o cálculo exato de um cartão específico."}, {"type": "table", "head": ["Saldo", "APR ilustrativo", "Juros anuais aproximados"], "rows": [["US$ 500", "20%", "~US$ 100"], ["US$ 1.000", "24%", "~US$ 240"], ["US$ 2.500", "24%", "~US$ 600"], ["US$ 5.000", "28%", "~US$ 1.400"]]}, {"type": "callout", "label": "Atenção", "text": "São estimativas educacionais. Os juros reais dependem das condições do seu cartão, dos saldos diários ou médios, da capitalização, das transações novas e dos pagamentos feitos durante o ano."}, {"type": "callout", "label": "Ponto-chave", "text": "O custo de carregar saldo não aparece no preço da compra. Antes de financiar uma compra, pense no que o saldo pode custar se ficar em aberto por vários ciclos de fatura."}]}, {"n": 4, "title": "Multa por atraso e o custo de perder o vencimento", "blocks": [{"type": "p", "text": "Um pagamento atrasado gera mais de um custo. Dependendo das condições da conta e do tamanho do atraso, as consequências podem incluir multa, juros adicionais, perda de uma taxa promocional ou registro negativo no histórico de crédito."}, {"type": "p", "text": "Três hábitos reduzem o risco de atraso por descuido:"}, {"type": "ul", "items": ["Programe um lembrete no calendário alguns dias antes do vencimento.", "Use pagamento automático pelo menos do valor mínimo exigido, quando isso couber no seu fluxo de caixa.", "Revise as faturas em vez de supor que o valor devido é sempre o mesmo."]}, {"type": "p", "text": "Se você já sabe que talvez não consiga fazer um pagamento exigido, procurar o credor antes do vencimento costuma ser mais útil do que esperar a conta ficar em atraso. As opções variam de credor para credor e não são garantidas."}, {"type": "callout", "label": "Ponto-chave", "text": "A multa é apenas o custo visível. Um pagamento perdido também pode afetar o custo e a situação da conta no longo prazo."}]}, {"n": 5, "title": "Saldo negativo, devolução de pagamento e tarifas bancárias", "blocks": [{"type": "p", "text": "Contas correntes também geram tarifas quando a movimentação e o saldo disponível não se encontram. Exemplos comuns:"}, {"type": "table", "head": ["Tarifa ou cobrança", "O que pode disparar"], "rows": [["Tarifa de saldo negativo (overdraft)", "Uma transação é paga mesmo sem saldo suficiente na conta, conforme as políticas do banco e as configurações da sua conta."], ["Tarifa por pagamento devolvido ou fundos insuficientes", "Um pagamento ou transação é devolvido por falta de saldo, quando permitido pelas condições da conta."], ["Tarifa mensal de manutenção", "Cobrança recorrente da conta, que às vezes é dispensada quando certas condições são cumpridas."], ["Tarifa de saque em caixa de outra rede", "Cobrança que pode incidir quando você usa um caixa eletrônico fora do seu banco ou da rede da sua conta."], ["Tarifa de transferência ou envio urgente", "Cobrança por certos serviços de transferência, conforme a instituição e o método usado."]]}, {"type": "p", "text": "A forma mais eficaz de entender esses custos é revisar a tabela de tarifas da sua própria conta e identificar quais cobranças dá para evitar com alertas de saldo, ajustes nas configurações ou outros meios de transação."}, {"type": "callout", "label": "Nota educacional", "text": "As políticas dos bancos e as proteções ao consumidor variam conforme o tipo de transação e de conta. Use os documentos atuais da sua instituição para saber as regras que valem para você."}]}, {"n": 6, "title": "Assinaturas e renovação automática", "blocks": [{"type": "p", "text": "Assinaturas nem sempre são classificadas como tarifas de produto financeiro, mas se comportam de forma parecida no orçamento, porque se repetem sozinhas e podem continuar depois que você parou de usar o serviço."}, {"type": "p", "text": "A forma mais fácil de avaliar uma assinatura é converter o valor mensal em compromisso anual."}, {"type": "table", "head": ["Cobrança mensal", "Custo anual"], "rows": [["US$ 7,99", "Cerca de US$ 96"], ["US$ 14,99", "Cerca de US$ 180"], ["US$ 24,99", "Cerca de US$ 300"], ["US$ 49,99", "Cerca de US$ 600"]]}, {"type": "p", "text": "Períodos de teste gratuito também viram despesa recorrente quando o teste se converte automaticamente em plano pago. O comportamento importante não é evitar toda assinatura; é verificar se cada cobrança recorrente ainda reflete uma decisão atual."}, {"type": "callout", "label": "Ponto-chave", "text": "Uma cobrança automática pequena vira uma despesa anual relevante. Revise as cobranças recorrentes pelo custo anual, não só pelo valor do mês."}]}, {"n": 7, "title": "Tarifas de empréstimo e o custo total de tomar emprestado", "blocks": [{"type": "p", "text": "Empréstimos podem ter custos além da taxa de juros informada. Dependendo do produto, isso inclui tarifa de abertura, tarifa de análise, custos de fechamento, condições de pagamento antecipado ou produtos adicionais opcionais."}, {"type": "p", "text": "Ao comparar duas opções de empréstimo, olhe além da parcela mensal. Uma parcela menor pode vir de um prazo mais longo, o que pode aumentar o total de juros pagos."}, {"type": "table", "head": ["Pergunta a fazer", "Por que importa"], "rows": [["Quanto dinheiro eu de fato recebo?", "Tarifas cobradas na largada podem reduzir o valor que chega até você."], ["Qual é o APR ou a taxa aplicada?", "A taxa determina a velocidade com que os juros se acumulam."], ["Quantas parcelas são exigidas?", "Um prazo mais longo pode reduzir a parcela e aumentar o custo total."], ["Qual é o valor total pago no fim?", "Mostra o efeito combinado de principal, juros e cobranças aplicáveis."]]}, {"type": "callout", "label": "Ponto-chave", "text": "A menor parcela mensal não é automaticamente o empréstimo mais barato. Compare o valor total pago e as tarifas ligadas ao produto."}]}, {"n": 8, "title": "Comparando produtos financeiros pelo custo total", "blocks": [{"type": "p", "text": "Um roteiro útil de comparação faz quatro perguntas antes de escolher uma conta ou um produto de crédito:"}, {"type": "table", "head": ["Pergunta", "O que revisar"], "rows": [["1. Qual taxa se aplica?", "APR, taxa de juros ou APY, dependendo de você estar tomando emprestado ou guardando."], ["2. Quais tarifas se aplicam?", "Anuidade, manutenção, abertura, transferência, atraso, saque ou outras cobranças."], ["3. Quando os custos acontecem?", "Na largada, por mês, por ano, após um pagamento perdido, ou só quando um recurso é usado."], ["4. Como eu saio?", "Prazo de pagamento, regras de cancelamento, fim do período promocional e eventuais penalidades ou condições."]]}, {"type": "p", "text": "Exemplo: um produto pode anunciar isenção de anuidade e ter uma taxa de juros mais alta; outro pode cobrar anuidade e oferecer condições que combinam melhor com o seu uso real da conta. A comparação melhor é a baseada no seu comportamento esperado, não em um único número de destaque."}, {"type": "callout", "label": "Ponto-chave", "text": "Compare os custos que você provavelmente vai pagar, não todos os custos que poderiam teoricamente existir. O seu uso esperado do produto é o que decide."}]}, {"n": 9, "title": "Enganos comuns sobre tarifas e juros", "blocks": [{"type": "table", "head": ["Engano comum", "Entendimento mais preciso"], "rows": [["Parcela mensal baixa significa dívida barata.", "Um prazo mais longo reduz a parcela e aumenta o total de juros pagos."], ["APR e tarifas são a mesma coisa.", "O APR descreve o custo de tomar emprestado como taxa; tarifas são cobranças separadas previstas no contrato."], ["Se a tarifa é pequena, não faz diferença.", "Tarifas pequenas e recorrentes ficam relevantes quando se repetem ao longo do ano."], ["Proteção contra saldo negativo significa que as transações são gratuitas.", "Os serviços de overdraft e as configurações da conta podem envolver cobranças; revise as condições do seu banco."], ["Taxa promocional é permanente.", "Condições promocionais em geral têm regras e data de validade."], ["Pagar o mínimo evita juros.", "O mínimo mantém a conta em dia, mas o saldo em aberto pode continuar gerando juros."], ["A parcela anunciada é o custo total.", "O custo total também depende do prazo, dos juros e das tarifas aplicáveis."]]}, {"type": "callout", "label": "Ponto-chave", "text": "Boa parte dos custos financeiros desnecessários vem de olhar um número só, a parcela mensal, a anuidade ou a taxa anunciada, em vez da estrutura completa de custos."}]}], "quiz": [{"prompt": "Qual afirmação descreve melhor a diferença entre tarifa e juros?", "options": [{"text": "A tarifa é sempre opcional, enquanto os juros são exigidos por lei", "correct": false}, {"text": "A tarifa é uma cobrança específica; os juros são o custo de usar dinheiro emprestado ao longo do tempo", "correct": true}, {"text": "Juros só valem para contas bancárias; tarifas só valem para empréstimos", "correct": false}, {"text": "Tarifa e juros são dois nomes para o mesmo custo", "correct": false}], "feedback": "A tarifa é uma cobrança específica prevista nas condições do produto. Os juros são o custo de usar dinheiro emprestado ao longo do tempo."}, {"prompt": "O que o APR representa em geral?", "options": [{"text": "Sua renda anual total", "correct": false}, {"text": "O custo anualizado de tomar emprestado segundo as condições aplicáveis", "correct": true}, {"text": "O valor que você já pagou de volta", "correct": false}, {"text": "O percentual do seu saldo bancário que é segurado", "correct": false}], "feedback": "O APR é uma medida anualizada da taxa de empréstimo. O valor efetivo em dólares depende do saldo, do momento, dos pagamentos e das condições da conta."}, {"prompt": "Usando uma estimativa simplificada, quanto daria de juros anuais um saldo de US$ 1.000 a um APR de 24%, caso o saldo ficasse igual por um ano?", "options": [{"text": "US$ 24", "correct": false}, {"text": "US$ 120", "correct": false}, {"text": "US$ 240", "correct": true}, {"text": "US$ 2.400", "correct": false}], "feedback": "A estimativa simplificada é US$ 1.000 x 24% = cerca de US$ 240. O cálculo real dos juros de cartão pode ser diferente."}, {"prompt": "Qual ação ajuda mais a evitar juros sobre compras novas quando existe grace period?", "options": [{"text": "Pagar só o valor mínimo", "correct": false}, {"text": "Pagar o saldo integral da fatura até o vencimento", "correct": true}, {"text": "Manter o cartão abaixo do limite", "correct": false}, {"text": "Fazer pelo menos uma compra por mês", "correct": false}], "feedback": "Quando o grace period se aplica, pagar o saldo integral da fatura até o vencimento em geral evita juros sobre as compras novas."}, {"prompt": "Qual destes é um exemplo de custo recorrente de conta?", "options": [{"text": "Uma tarifa mensal de manutenção", "correct": true}, {"text": "Seu limite de crédito disponível", "correct": false}, {"text": "Seu saldo de poupança", "correct": false}, {"text": "Seu credit score", "correct": false}], "feedback": "A tarifa mensal de manutenção se repete em intervalos fixos, a menos que as condições da conta prevejam isenção ou outra situação se aplique."}, {"prompt": "Por que uma assinatura de US$ 25 por mês pode ser financeiramente relevante?", "options": [{"text": "Porque toda assinatura afeta o credit score", "correct": false}, {"text": "Porque representa US$ 300 ao longo de um ano", "correct": true}, {"text": "Porque cobranças mensais são sempre mais caras que as anuais", "correct": false}, {"text": "Porque assinaturas não podem ser canceladas", "correct": false}], "feedback": "Anualizar custos recorrentes mostra o compromisso completo: US$ 25 por mês equivalem a US$ 300 por ano."}, {"prompt": "Por que vale comparar o valor total pago em um empréstimo?", "options": [{"text": "Porque ele combina o efeito de principal, juros e custos aplicáveis ao longo do prazo", "correct": true}, {"text": "Porque mostra seu credit score", "correct": false}, {"text": "Porque garante que o empréstimo cabe no bolso", "correct": false}, {"text": "Porque define se o credor tem seguro", "correct": false}], "feedback": "O valor total pago dá um retrato mais amplo do que a parcela mensal sozinha."}, {"prompt": "Qual afirmação sobre uma parcela mensal menor está correta?", "options": [{"text": "Significa sempre que o empréstimo custa menos", "correct": false}, {"text": "Pode vir de um prazo mais longo e aumentar o total de juros pagos", "correct": true}, {"text": "Garante um APR menor", "correct": false}, {"text": "Significa que não há tarifas", "correct": false}], "feedback": "Um prazo mais longo reduz a parcela e aumenta o tempo durante o qual os juros correm."}, {"prompt": "Qual é a melhor primeira fonte para entender as tarifas da sua conta corrente?", "options": [{"text": "Um amigo que usa outro banco", "correct": false}, {"text": "A tabela de tarifas atual e os documentos da sua instituição", "correct": true}, {"text": "Um site de credit score", "correct": false}, {"text": "Uma calculadora de financiamento imobiliário", "correct": false}], "feedback": "As tarifas variam por conta e por instituição, então os documentos atuais da sua conta são a fonte mais relevante."}, {"prompt": "Qual destas ações tem mais chance de reduzir multas por atraso acidental?", "options": [{"text": "Ignorar as faturas mensais", "correct": false}, {"text": "Programar lembretes de pagamento ou débito automático adequado", "correct": true}, {"text": "Abrir várias contas novas", "correct": false}, {"text": "Pagar só quando chega um aviso de cobrança", "correct": false}], "feedback": "Lembretes e pagamentos automáticos bem administrados reduzem o risco de perder uma data de vencimento."}, {"prompt": "Ao comparar dois produtos financeiros, qual fator considerar?", "options": [{"text": "Só a taxa anunciada", "correct": false}, {"text": "Só a anuidade", "correct": false}, {"text": "Taxa, tarifas, momento das cobranças e como você espera usar o produto", "correct": true}, {"text": "Só as recompensas oferecidas", "correct": false}], "feedback": "O custo total depende de vários atributos e do seu comportamento esperado, não de um único número de destaque."}, {"prompt": "Qual afirmação é mais precisa sobre taxas promocionais?", "options": [{"text": "São sempre permanentes", "correct": false}, {"text": "Em geral têm regras, condições e data de validade", "correct": true}, {"text": "Eliminam todas as tarifas", "correct": false}, {"text": "Não exigem pagamento", "correct": false}], "feedback": "Condições promocionais normalmente têm regras e um período definido. Verifique o que acontece quando a promoção termina."}], "quizIntro": "Responda às 12 questões a seguir para testar seu entendimento sobre tarifas e juros. Escolha a melhor resposta para cada uma.", "summary": [{"type": "p", "text": "Neste módulo, você aprendeu:"}, {"type": "ul", "items": ["A diferença entre tarifa e juros, e por que os dois afetam o custo total dos produtos financeiros;", "Como o APR dá uma medida anualizada da taxa de empréstimo e por que o valor em dólares depende dos saldos e do tempo;", "Como carregar saldo aumenta o custo real das compras ao longo do tempo;", "Como multas por atraso e pagamentos perdidos geram custos imediatos e de longo prazo;", "Como surgem tarifas de saldo negativo, pagamento devolvido, manutenção, saque e transferência nas contas bancárias;", "Por que assinaturas e renovações automáticas devem ser avaliadas pelo custo anual;", "Por que tarifas de empréstimo, prazo e valor total pago importam na comparação de opções de crédito;", "Um roteiro de quatro perguntas para comparar produtos financeiros pelo custo total esperado;", "Enganos comuns sobre tarifas e juros e a visão mais precisa de cada um."]}], "reflection": ["Você já foi cobrado por uma tarifa que não entendeu direito na hora? Qual foi?", "Se você carrega saldo hoje em um cartão ou outra conta rotativa, sabe o APR aproximado e quanto custa manter esse saldo?", "Qual tarifa ou cobrança de juros você conseguiria reduzir ou eliminar com uma mudança específica de comportamento?"], "actionTask": {"title": "Faça uma auditoria das suas tarifas dos últimos 3 meses", "steps": ["Revise os extratos dos últimos três meses do banco e do cartão e identifique toda tarifa ou cobrança de juros que apareceu.", "Liste cada cobrança e identifique o que a disparou. Marque se ela parece evitável, recorrente ou ligada a um empréstimo.", "Tome uma ação concreta para impedir que a cobrança evitável mais frequente ou mais cara se repita."]}, "disclaimer": "Este módulo é educacional e foi feito para ajudar você a entender tarifas comuns, custos de empréstimo e cobranças financeiras recorrentes. Ele não constitui aconselhamento jurídico, financeiro, de investimento, bancário ou de reparação de crédito. Para orientação sobre a sua situação específica, consulte um profissional qualificado.", "practiceIntro": "Para encerrar este módulo, reserve alguns minutos para refletir sobre o que aprendeu antes de fazer a tarefa prática. Não existem respostas certas ou erradas. O objetivo é conectar o conteúdo à sua própria situação financeira.", "taskPurpose": "Aplicar o que você aprendeu neste módulo à sua própria situação financeira, por meio de uma ação concreta e de baixo risco nesta semana.", "taskInstruction": "Faça os três passos a seguir antes do fim da semana:"}, "5": {"n": 5, "title": "Estratégias de educação sobre dívida", "subtitle": "Roteiros práticos para avaliar decisões de dívida, comparar cenários de pagamento e entender o custo real do crédito caro.", "meta": "10 Lições · 12 Questões · 1 Tarefa prática · Tempo estimado: 35 minutos · Nível: Intermediário", "overview": [{"type": "p", "text": "A dívida pode ser útil, necessária, cara ou perigosa, dependendo do motivo pelo qual foi contraída, do quanto custa e de o plano de pagamento caber no orçamento real. O problema raramente é uma dívida isolada. É a interação entre taxa, saldo, prazo, fluxo de caixa e a possibilidade de o endividamento novo continuar enquanto os saldos antigos permanecem."}, {"type": "p", "text": "Este módulo traz um roteiro prático para avaliar uma dívida nova antes de contraí-la, mapear as obrigações existentes, priorizar o pagamento, comparar opções de consolidação e reduzir os comportamentos que transformam um empréstimo de curto prazo em um ciclo longo."}, {"type": "callout", "label": "Objetivo de aprendizagem", "text": "Desenvolver um roteiro para avaliar decisões de dívida e entender como priorizar estratégias de pagamento que reduzem o total de juros ao longo do tempo."}], "lessons": [{"n": 1, "title": "Dívida é um compromisso sobre a renda futura", "blocks": [{"type": "p", "text": "A dívida permite usar dinheiro hoje e pagar com a renda de amanhã. Isso pode ser útil quando o empréstimo financia algo importante ou distribui um custo grande ao longo do tempo, mas toda dívida também cria uma obrigação de pagamento futura."}, {"type": "p", "text": "A pergunta mais útil não é se a dívida é boa ou ruim por natureza. É se ela tem uma finalidade clara, um custo compreensível e um plano de pagamento realista."}, {"type": "table", "head": ["Característica da dívida", "Pergunta a fazer"], "rows": [["Finalidade", "O que estou financiando e por que tomar emprestado faz sentido para esta compra ou necessidade?"], ["Custo", "Qual taxa, quais tarifas e qual valor total vou pagar?"], ["Prazo", "Por quanto tempo essa obrigação vai ficar no meu orçamento?"], ["Capacidade de pagamento", "Consigo pagar a parcela sem sacrificar despesas essenciais nem recorrer a dívida nova?"]]}, {"type": "callout", "label": "Ponto-chave", "text": "Tomar emprestado move parte do gasto de hoje para o orçamento de amanhã. A decisão de se endividar deve ser avaliada antes de o dinheiro ser gasto, não só quando a conta chega."}]}, {"n": 2, "title": "Dívida produtiva, necessária e cara", "blocks": [{"type": "p", "text": "A dívida costuma ser separada em categorias como boa e ruim. Esses rótulos simplificam demais decisões reais. Um roteiro mais útil olha para finalidade, custo, risco e plano de pagamento."}, {"type": "table", "head": ["Situação", "O que avaliar"], "rows": [["Educação ou investimento na carreira", "Benefício esperado, taxa, flexibilidade de pagamento e se existem alternativas mais baratas."], ["Financiamento de casa ou veículo", "Capacidade de pagar, custo total, prazo, seguro e manutenção, e o risco de comprometer renda futura."], ["Empréstimo em emergência", "Se a despesa é mesmo urgente, quanto custa a dívida e como o pagamento vai caber depois que a emergência passar."], ["Consumo rotineiro financiado a APR alto", "Se a compra pode ser adiada, reduzida ou paga com o que você já tem, em vez de virar saldo de longo prazo."]]}, {"type": "p", "text": "A categoria da compra não determina sozinha se a dívida é adequada. Condições e capacidade de pagamento importam."}, {"type": "callout", "label": "Ponto-chave", "text": "A qualidade da dívida depende da decisão, não do rótulo. Uma finalidade razoável ainda fica cara se a taxa ou a estrutura de pagamento for desfavorável."}]}, {"n": 3, "title": "Como a dívida cara vira um ciclo", "blocks": [{"type": "p", "text": "A dívida rotativa de juros altos fica difícil de escapar quando o gasto novo entra mais rápido do que os saldos antigos são pagos. Os juros aumentam o valor que precisa ser quitado, enquanto os pagamentos mínimos fazem o progresso parecer lento."}, {"type": "p", "text": "Um ciclo comum é este:"}, {"type": "table", "head": ["Etapa", "O que acontece"], "rows": [["1. Falta", "O gasto rotineiro supera o dinheiro disponível."], ["2. Empréstimo", "Um cartão ou outra dívida cobre a diferença."], ["3. Juros", "O saldo em aberto fica mais caro com o tempo."], ["4. Menos folga", "Mais da renda do mês seguinte precisa ir para pagamentos de dívida."], ["5. Nova falta", "Sobra menos dinheiro para as despesas correntes, o que pressiona a tomar emprestado de novo."]]}, {"type": "p", "text": "Quebrar o ciclo costuma exigir trabalhar nos dois lados ao mesmo tempo: reduzir o custo ou o saldo da dívida existente e reduzir a necessidade de novos empréstimos."}, {"type": "callout", "label": "Ponto-chave", "text": "Pagar dívida sem mudar o problema de fluxo de caixa que a criou costuma trazer o mesmo saldo de volta."}]}, {"n": 4, "title": "Pagamento mínimo e tempo de quitação", "blocks": [{"type": "p", "text": "O pagamento mínimo é o menor valor exigido para manter a conta em dia segundo as condições do contrato. Ele não é necessariamente uma estratégia de quitação."}, {"type": "p", "text": "Quando a taxa de juros é alta e o pagamento é pequeno, boa parte dele pode ir para juros em vez de reduzir o principal. Isso estica bastante o tempo de pagamento."}, {"type": "p", "text": "Sua fatura ou o contrato do empréstimo pode mostrar quanto tempo a quitação levaria com diferentes valores de pagamento. Olhar esses documentos torna mais concreta a troca entre o que cabe no mês e o custo total."}, {"type": "callout", "label": "Nota educacional", "text": "Fazer pelo menos o pagamento exigido em todas as dívidas continua sendo essencial. Qualquer estratégia de pagamento extra deve começar só depois que os pagamentos obrigatórios e os custos essenciais de vida estiverem cobertos."}]}, {"n": 5, "title": "Avaliando uma decisão de dívida", "blocks": [{"type": "p", "text": "Antes de assumir uma dívida nova, três perguntas ajudam a decidir se a decisão faz sentido financeiro."}, {"type": "table", "head": ["Pergunta", "Por que importa"], "rows": [["Qual é o custo total?", "Considere principal, juros, tarifas e o valor total pago ao longo do prazo."], ["Dá para evitar?", "Esperar, poupar, reduzir a compra ou usar um recurso que você já tem poderia substituir parte ou todo o empréstimo?"], ["Qual é o plano de saída?", "Saiba como e quando a dívida termina, incluindo o valor da parcela e a data prevista de quitação."]]}, {"type": "p", "lead": "Uma quarta pergunta fortalece o roteiro:", "text": "o que acontece se minha renda ou minhas despesas mudarem? Uma parcela confortável hoje pode ficar difícil se o orçamento não tiver nenhuma folga."}, {"type": "callout", "label": "Princípio-chave", "text": "Dívida não é ruim por natureza. Depende do custo, da finalidade, do risco e de você ter um plano claro de pagamento antes de tomar emprestado."}]}, {"n": 6, "title": "Mapeie seu quadro atual de dívidas", "blocks": [{"type": "p", "text": "A dívida fica mais fácil de administrar quando está visível em um só lugar. Monte um mapa simples usando a fatura ou o extrato mais recente de cada obrigação."}, {"type": "table", "head": ["Dívida", "Saldo", "APR / taxa", "Pagamento mínimo", "Tipo de taxa", "Observações"], "rows": [["Cartão A", "US$ 3.200", "24%", "US$ 95", "Variável", "Saldo rotativo"], ["Financiamento do carro", "US$ 14.500", "6,5%", "US$ 420", "Fixa", "Faltam 36 parcelas"], ["Empréstimo estudantil", "US$ 8.000", "5,0%", "US$ 110", "Fixa", "Exemplo ilustrativo"]]}, {"type": "p", "text": "Os números acima são apenas exemplos. Para o seu próprio mapa, use extratos reais e inclua todas as obrigações pelas quais você é responsável."}, {"type": "p", "text": "Campos úteis incluem saldo, APR ou taxa de juros, pagamento mínimo, data de vencimento, se a taxa é fixa ou variável e eventual período promocional."}, {"type": "callout", "label": "Ponto-chave", "text": "O mapa de dívidas transforma um problema emocional em um conjunto de saldos, taxas e obrigações mensuráveis."}]}, {"n": 7, "title": "Priorizando o pagamento: avalanche e bola de neve", "blocks": [{"type": "p", "text": "Depois de fazer o pagamento exigido em todas as dívidas, dois roteiros conhecidos ajudam a decidir para onde vai um pagamento extra."}, {"type": "table", "head": ["Método", "Como funciona", "Troca envolvida"], "rows": [["Avalanche", "Direciona os pagamentos extras para a dívida de maior APR e depois para a seguinte.", "Em geral reduz ao máximo o total de juros quando os demais fatores são iguais."], ["Bola de neve", "Direciona os pagamentos extras para o menor saldo e depois soma esse valor ao saldo seguinte.", "Gera vitórias visíveis mais rápido, o que algumas pessoas acham motivador."]]}, {"type": "p", "text": "Nenhum dos dois dispensa manter todas as contas em dia. A melhor estratégia de comportamento é aquela que você consegue seguir de forma consistente, sem criar dívida nova em outro ponto do orçamento."}, {"type": "callout", "label": "Ponto-chave", "text": "A avalanche olha para o custo de juros do ponto de vista matemático; a bola de neve olha para o progresso visível do ponto de vista comportamental. A consistência conta nos dois casos."}]}, {"n": 8, "title": "Consolidação, refinanciamento e transferências promocionais", "blocks": [{"type": "p", "text": "Consolidação ou refinanciamento podem reduzir o custo quando um produto novo substitui dívida mais cara por uma taxa efetiva menor. Mas transferir um saldo não reduz a dívida sozinho."}, {"type": "p", "text": "Antes de refinanciar ou transferir dívida, revise:"}, {"type": "ul", "items": ["O novo APR e se ele é fixo, variável ou promocional;", "Tarifas de abertura, de transferência ou de fechamento;", "O prazo de pagamento e o valor total que se espera pagar;", "Qual taxa passa a valer quando o período promocional termina;", "Se as contas antigas vão continuar disponíveis para novos gastos;", "Se a nova parcela cabe de fato no seu orçamento."]}, {"type": "p", "text": "Uma parcela menor ajuda o fluxo de caixa, mas um prazo mais longo aumenta o total de juros pagos. Compare a estrutura inteira."}, {"type": "callout", "label": "Ponto-chave", "text": "A consolidação muda a estrutura da dívida. Ela não resolve o padrão de gasto ou de fluxo de caixa que está por trás, a menos que esse padrão também mude."}]}, {"n": 9, "title": "Evitar dívida nova enquanto paga a antiga", "blocks": [{"type": "p", "text": "Pagar dívida é mais difícil quando toda despesa inesperada cria um saldo novo. Uma reserva pequena de dinheiro ajuda a separar os imprevistos rotineiros do endividamento."}, {"type": "p", "text": "Criar um pouco de atrito também reduz o endividamento por impulso:"}, {"type": "ul", "items": ["Faça uma pausa antes de financiar compras não essenciais e compare o custo total com o preço à vista;", "Remova os dados do cartão salvos em sites de compra se a compra em um clique virou hábito;", "Mantenha uma reserva pequena de emergência ou de fluxo de caixa, para que custos inesperados menores não virem dívida na hora;", "Use o orçamento do Módulo 3 para planejar despesas recorrentes e irregulares;", "Quando uma dívida for quitada, decida com antecedência para onde vai a parcela que ficou livre."]}, {"type": "callout", "label": "Ponto-chave", "text": "Um plano de pagamento funciona melhor quando o endividamento novo também é tratado. Sem isso, a dívida muda de conta sem de fato diminuir."}]}, {"n": 10, "title": "Sinais de alerta e quando pedir ajuda", "blocks": [{"type": "p", "text": "Problemas com dívida são mais fáceis de resolver antes de virarem emergência. Entre os sinais de alerta:"}, {"type": "ul", "items": ["Perder pagamentos exigidos ou pagá-los com atraso de forma repetida;", "Usar uma dívida para pagar outra;", "Depender de crédito para despesas essenciais todo mês porque a renda já está comprometida;", "Receber avisos de cobrança ou evitar olhar as faturas porque os saldos parecem grandes demais;", "Usar saques no cartão ou crédito caro repetidamente para cobrir despesas comuns do mês."]}, {"type": "p", "text": "Se você está com dificuldade para pagar, procurar os credores cedo pode revelar opções de renegociação ou condições especiais. Organizações de credit counseling sem fins lucrativos também podem oferecer orientação e apoio estruturado. Desconfie de qualquer empresa que prometa eliminação garantida de dívidas, peça para você parar de falar com os credores sem explicar os riscos, ou exija pagamentos altos adiantados sem serviços claros."}, {"type": "callout", "label": "Atenção", "text": "Administração de dívidas, acordos, falência e direitos legais envolvem consequências que dependem da situação individual. Este módulo não oferece aconselhamento jurídico."}]}], "quiz": [{"prompt": "Qual afirmação descreve melhor o que é dívida?", "options": [{"text": "Dinheiro que nunca precisa ser devolvido", "correct": false}, {"text": "Um compromisso sobre a renda futura, criado ao tomar emprestado hoje", "correct": true}, {"text": "Qualquer despesa paga com cartão", "correct": false}, {"text": "Apenas o saldo de cartão de crédito com juros altos", "correct": false}], "feedback": "A dívida permite usar dinheiro hoje em troca de uma obrigação de pagamento no futuro."}, {"prompt": "Qual combinação é mais útil para avaliar uma decisão de dívida?", "options": [{"text": "Finalidade, custo, risco e plano de pagamento", "correct": true}, {"text": "Pontos do cartão, limite e cor do cartão", "correct": false}, {"text": "Apenas a parcela mensal", "correct": false}, {"text": "Apenas a renda", "correct": false}], "feedback": "A decisão de se endividar é mais ampla que a parcela mensal. Finalidade, custo total, risco e plano de pagamento importam."}, {"prompt": "Como um ciclo de dívida cara se forma?", "options": [{"text": "Os juros reduzem o saldo automaticamente", "correct": false}, {"text": "Novos empréstimos cobrem a falta de caixa enquanto os juros encarecem os saldos antigos", "correct": true}, {"text": "Os pagamentos mínimos sempre eliminam o principal rapidamente", "correct": false}, {"text": "Os limites de crédito caem todo mês", "correct": false}], "feedback": "Quando o endividamento novo continua enquanto os juros correm sobre os saldos antigos, mais da renda futura fica comprometida com dívida."}, {"prompt": "O que é o pagamento mínimo?", "options": [{"text": "O valor ideal a pagar todo mês", "correct": false}, {"text": "O menor pagamento exigido pelas condições da conta", "correct": true}, {"text": "O valor que elimina todos os juros", "correct": false}, {"text": "O saldo total devido", "correct": false}], "feedback": "O pagamento mínimo é uma exigência para manter a conta em dia; não é necessariamente uma estratégia eficiente de quitação."}, {"prompt": "Antes de assumir uma dívida, qual pergunta faz parte do roteiro de três perguntas?", "options": [{"text": "Qual é o custo total?", "correct": true}, {"text": "Quantos pontos eu vou acumular?", "correct": false}, {"text": "Meu limite vai aumentar?", "correct": false}, {"text": "Posso ignorar o vencimento?", "correct": false}], "feedback": "O custo total é uma das perguntas centrais, junto com a possibilidade de evitar o empréstimo e o plano de saída."}, {"prompt": "Que informações entram em um mapa de dívidas?", "options": [{"text": "Saldo, APR ou taxa, pagamento mínimo e condições relevantes", "correct": true}, {"text": "Apenas o preço original da compra", "correct": false}, {"text": "Apenas a data de vencimento", "correct": false}, {"text": "Apenas o credit score ligado à conta", "correct": false}], "feedback": "Um mapa útil torna cada obrigação mensurável, listando saldo, taxa, pagamento exigido, vencimento e condições relevantes."}, {"prompt": "Qual método de quitação ataca mais diretamente o custo total de juros quando os demais fatores são iguais?", "options": [{"text": "Avalanche", "correct": true}, {"text": "Bola de neve", "correct": false}, {"text": "Pagar valores extras iguais em todas as contas para sempre", "correct": false}, {"text": "Abrir um cartão novo para cada saldo", "correct": false}], "feedback": "O método avalanche direciona os pagamentos extras para a dívida de maior APR e costuma reduzir ao máximo o total de juros quando os demais fatores são iguais."}, {"prompt": "Qual é a principal vantagem comportamental do método bola de neve?", "options": [{"text": "Sempre produz o menor total de juros", "correct": false}, {"text": "Gera vitórias visíveis mais rápido ao eliminar primeiro os saldos menores", "correct": true}, {"text": "Elimina os pagamentos exigidos nas outras dívidas", "correct": false}, {"text": "Converte dívida em poupança", "correct": false}], "feedback": "A bola de neve traz motivação pelo progresso visível, ainda que possa não reduzir os juros com a mesma eficiência da avalanche."}, {"prompt": "Qual afirmação sobre consolidação de dívida é mais precisa?", "options": [{"text": "Ela elimina a dívida automaticamente", "correct": false}, {"text": "Ela pode mudar a taxa e a estrutura de pagamento, mas a dívida ainda precisa ser paga", "correct": true}, {"text": "Ela garante um custo total menor", "correct": false}, {"text": "Ela elimina a necessidade de um orçamento", "correct": false}], "feedback": "A consolidação muda a estrutura da dívida. Se o custo total cai depende da taxa, das tarifas, do prazo e do comportamento de pagamento."}, {"prompt": "Por que uma reserva pequena de dinheiro ajuda no pagamento de dívidas?", "options": [{"text": "Porque aumenta o APR das suas dívidas", "correct": false}, {"text": "Porque reduz a necessidade de tomar emprestado de novo por causa de imprevistos pequenos", "correct": true}, {"text": "Porque garante que os credores vão baixar sua taxa", "correct": false}, {"text": "Porque elimina todas as despesas recorrentes", "correct": false}], "feedback": "Uma reserva de caixa impede que um imprevisto pequeno vire dívida nova de imediato."}, {"prompt": "Qual é um sinal de alerta de que a dívida pode estar ficando difícil de administrar?", "options": [{"text": "Revisar suas faturas todo mês", "correct": false}, {"text": "Usar uma dívida para pagar outra", "correct": true}, {"text": "Pagar mais que o mínimo quando dá", "correct": false}, {"text": "Comparar taxas antes de tomar emprestado", "correct": false}], "feedback": "Tomar emprestado para pagar outro empréstimo pode indicar que os pagamentos de dívida já passaram do caixa disponível."}, {"prompt": "Quando você prevê dificuldade para fazer um pagamento exigido, o que costuma ser mais construtivo do que ignorar a conta?", "options": [{"text": "Procurar o credor cedo para perguntar sobre as opções disponíveis", "correct": true}, {"text": "Fazer outro empréstimo caro sem comparar condições", "correct": false}, {"text": "Parar todos os pagamentos sem avaliar as consequências", "correct": false}, {"text": "Tirar a conta do seu orçamento", "correct": false}], "feedback": "Procurar o credor antes de a conta ficar mais atrasada pode revelar alternativas. A disponibilidade e as condições variam de credor para credor."}], "quizIntro": "Responda às 12 questões a seguir para testar seu entendimento sobre decisões de dívida e estratégias de pagamento. Escolha a melhor resposta para cada uma.", "summary": [{"type": "p", "text": "Neste módulo, você aprendeu:"}, {"type": "ul", "items": ["Por que a dívida é melhor avaliada por finalidade, custo, risco e plano de pagamento do que por um simples rótulo de dívida boa ou ruim;", "Como o crédito caro cria um ciclo em que a renda futura fica cada vez mais comprometida com saldos antigos;", "Por que os pagamentos mínimos mantêm as contas em dia mas podem não produzir uma quitação eficiente;", "Um roteiro de três perguntas para avaliar uma dívida nova: custo total, possibilidade de evitar e plano de saída;", "Como montar um mapa de dívidas com saldos, taxas, pagamentos mínimos e condições das contas;", "A diferença entre os métodos avalanche e bola de neve e a troca que cada um envolve;", "Como avaliar consolidação, refinanciamento e transferências promocionais por taxa, tarifas, prazo e comportamento;", "Por que uma reserva de caixa e um pouco de atrito nos gastos reduzem o risco de substituir dívida paga por dívida nova;", "Sinais de alerta comuns de que a dívida está ficando difícil de administrar e por que agir cedo faz diferença."]}], "reflection": ["Qual decisão de dívida no seu passado mais te ensinou sobre o custo real de tomar emprestado?", "Se você tem dívida hoje, qual saldo cria mais pressão no seu orçamento mensal, e isso acontece pelo tamanho dele, pela taxa ou pela parcela exigida?", "Qual mudança de comportamento ou de planejamento reduziria sua necessidade de tomar emprestado de novo enquanto paga a dívida atual?"], "actionTask": {"title": "Mapeie seu quadro atual de dívidas", "steps": ["Liste todas as dívidas que você tem hoje, com saldo, APR ou taxa de juros, pagamento mínimo e data de vencimento de cada uma. Se você não tem dívida no momento, use um exemplo realista para praticar o roteiro.", "Identifique qual dívida tem o maior APR e estime o que essa taxa significa no custo de manter o saldo.", "Identifique um valor pequeno que você conseguiria direcionar à sua prioridade de pagamento neste mês, sem deixar de fazer os pagamentos exigidos nem cortar despesas essenciais."]}, "disclaimer": "Este módulo é educacional e foi feito para ajudar você a entender custos de dívida, roteiros de pagamento e escolhas comuns de administração de dívidas. Ele não constitui aconselhamento jurídico, financeiro, de investimento, de acordo de dívida, de falência ou de reparação de crédito. Para orientação sobre a sua situação específica, consulte um profissional qualificado das áreas financeira ou jurídica.", "practiceIntro": "Para encerrar este módulo, reserve alguns minutos para refletir sobre o que aprendeu antes de fazer a tarefa prática. Não existem respostas certas ou erradas. O objetivo é conectar o conteúdo à sua própria situação financeira.", "taskPurpose": "Aplicar o que você aprendeu neste módulo à sua própria situação financeira, por meio de uma ação concreta e de baixo risco nesta semana.", "taskInstruction": "Faça os três passos a seguir antes do fim da semana:"}, "6": {"n": 6, "title": "Hábitos de poupança e objetivos", "subtitle": "Construir hábitos consistentes de poupança, estratégias de reserva de emergência e como automatizar a disciplina financeira na sua rotina.", "meta": "9 Lições · 10 Questões · 1 Tarefa prática · Tempo estimado: 30 minutos · Nível: Intermediário", "overview": [{"type": "p", "text": "Poupar costuma ser tratado como o que sobra depois que tudo foi pago. Esse jeito faz a poupança depender de memória, de motivação e de o mês ter corrido bem. Um caminho mais confiável trata a poupança como um sistema: uma finalidade clara, uma meta realista, um lugar para guardar o dinheiro e um método repetível para levar dinheiro até o objetivo."}, {"type": "p", "text": "Este módulo explica como a reserva de emergência difere da poupança planejada, como transformar um objetivo em um número mensal, por que a automação reduz o atrito comportamental, como começar com um valor sustentável e como ajustar o sistema quando a renda é irregular ou as prioridades mudam."}, {"type": "callout", "label": "Objetivo de aprendizagem", "text": "Construir um hábito sustentável de poupança, entendendo como automação, definição de objetivos e planejamento da reserva de emergência reduzem a vulnerabilidade financeira ao longo do tempo."}], "lessons": [{"n": 1, "title": "Por que poupar importa", "blocks": [{"type": "p", "text": "A poupança cria distância entre uma despesa inesperada e uma dívida nova. Ela também dá mais liberdade para decisões planejadas: trocar de emprego, cobrir uma franquia, trocar um computador, mudar de casa, pagar um curso ou aproveitar uma oportunidade sem depender só do crédito."}, {"type": "p", "text": "A poupança cumpre três funções diferentes:"}, {"type": "table", "head": ["Função", "Finalidade"], "rows": [["Proteção", "Cria uma folga para despesas inesperadas ou interrupção temporária de renda."], ["Planejamento", "Separa dinheiro para custos futuros conhecidos, como viagem, seguro anual, educação ou uma compra grande."], ["Escolha", "Dá flexibilidade para decidir sem precisar financiar cada despesa."]]}, {"type": "callout", "label": "Ponto-chave", "text": "Poupar não é só render juros. O primeiro valor financeiro da poupança é a flexibilidade: ter dinheiro disponível quando o tempo da vida não bate com o tempo do salário."}]}, {"n": 2, "title": "Reserva de emergência, sinking funds e poupança por objetivo", "blocks": [{"type": "p", "text": "Objetivos de poupança diferentes não devem ficar todos no mesmo bolo de dinheiro."}, {"type": "table", "head": ["Tipo de poupança", "Para que serve", "Exemplo"], "rows": [["Reserva de emergência", "Despesas inesperadas ou interrupção de renda", "Conserto urgente do carro; perda temporária de emprego; conta médica inesperada"], ["Sinking fund", "Uma despesa conhecida que vai acontecer mais adiante", "Seguro anual; licenciamento do veículo; gastos de fim de ano"], ["Poupança por objetivo", "Um objetivo futuro específico", "Educação; custos de mudança; uma compra planejada; viagem"]]}, {"type": "p", "text": "A distinção importa porque o dinheiro destinado a uma emergência some rápido se ele também for usado para contas anuais previsíveis. Rótulos claros ajudam a proteger a finalidade de cada saldo."}, {"type": "callout", "label": "Ponto-chave", "text": "A reserva de emergência cobre o que você não consegue prever. O sinking fund cobre o que você prevê, mas não paga todo mês."}]}, {"n": 3, "title": "Transforme um objetivo em um número mensal", "blocks": [{"type": "p", "text": "Um objetivo de poupança fica mais concreto quando tem três elementos: um valor específico, uma data e uma finalidade."}, {"type": "p", "text": "Exemplo: você quer US$ 1.200 para um curso profissional em doze meses. Dividindo US$ 1.200 por 12, a meta mensal fica em US$ 100. Se você já tem US$ 300 guardados, falta US$ 900, ou US$ 75 por mês ao longo de doze meses."}, {"type": "table", "head": ["Objetivo", "Valor alvo", "Tempo disponível", "Valor mensal ilustrativo"], "rows": [["Primeira etapa da reserva de emergência", "US$ 600", "6 meses", "US$ 100"], ["Prêmio anual de seguro", "US$ 1.200", "12 meses", "US$ 100"], ["Fundo para mudança", "US$ 2.400", "12 meses", "US$ 200"]]}, {"type": "p", "text": "O valor mensal não é um compromisso impossível de mudar. É um número de planejamento. Se a renda mudar, você pode mudar a data, o valor, ou os dois."}, {"type": "callout", "label": "Ponto-chave", "text": "Um objetivo sem número e sem data é fácil de adiar. Converter o objetivo em um valor mensal transforma a intenção em um comportamento repetível."}]}, {"n": 4, "title": "Por que a automação sustenta o hábito de poupar", "blocks": [{"type": "p", "text": "Poupar com consistência fica mais difícil quando exige uma decisão nova todo mês. A automação tira parte dessa decisão e aproxima a poupança de um comportamento padrão."}, {"type": "table", "head": ["Abordagem", "Confiabilidade"], "rows": [["Transferência manual todo mês", "Depende de memória e de motivação a cada mês."], ["Transferência automática no dia do pagamento", "Consistente e reduz a chance de o dinheiro ser gasto antes."], ["Divisão da folha pelo empregador, quando disponível", "Direciona parte da renda para a poupança antes de ela chegar à conta de gastos."], ["Arredondamento ou transferência por regra", "Cria poupança gradual e de baixo atrito, embora os valores possam ser pequenos ou variáveis."]]}, {"type": "p", "text": "A automação ainda assim precisa ser revisada. Uma transferência automática que vive causando saldo negativo ou obrigando você a tomar emprestado está agressiva demais para o fluxo de caixa atual."}, {"type": "callout", "label": "Ponto-chave", "text": "A automação reduz a necessidade de força de vontade repetida. O melhor valor automático é aquele sustentável o bastante para continuar."}]}, {"n": 5, "title": "Comece pequeno e aumente o hábito", "blocks": [{"type": "p", "text": "Muita gente adia a poupança porque o valor possível parece pequeno demais. Isso transforma uma limitação temporária em um adiamento permanente."}, {"type": "p", "text": "Começar com US$ 10, US$ 25 ou outro valor realista é útil porque constrói a rotina primeiro. O valor pode subir depois, quando a renda aumentar, uma dívida for quitada, uma despesa recorrente for eliminada ou o orçamento ficar mais estável."}, {"type": "p", "text": "Uma regra simples de escalada é aumentar a poupança depois de um evento positivo de caixa. Por exemplo, quando uma assinatura de US$ 60 por mês for cancelada, você pode direcionar parte ou todo esse valor para a poupança, em vez de deixá-lo se diluir no gasto geral."}, {"type": "callout", "label": "Ponto-chave", "text": "No começo, a consistência importa mais que o tamanho. Um hábito de poupança que sobrevive um ano vale mais que uma meta ambiciosa que para no primeiro mês."}]}, {"n": 6, "title": "Onde guardar a poupança de curto prazo", "blocks": [{"type": "p", "text": "Dinheiro destinado a emergências ou a objetivos próximos costuma precisar de duas qualidades: liquidez e estabilidade. Liquidez é conseguir acessar o dinheiro quando ele é necessário. Estabilidade é o saldo não ficar exposto a grandes oscilações de curto prazo."}, {"type": "p", "text": "Os lugares mais comuns para poupança de curto prazo incluem contas correntes ou de poupança, high-yield savings accounts e outros produtos equivalentes a caixa. Ao usar um banco ou credit union, verifique se a instituição e a conta são cobertas pelo seguro federal de depósito aplicável e entenda os limites legais que valem."}, {"type": "table", "head": ["Característica", "Por que importa"], "rows": [["Acesso", "O dinheiro da emergência precisa estar disponível quando a emergência acontece."], ["Separação", "Uma conta separada reduz o gasto acidental."], ["Rendimento / APY", "Os juros ajudam o saldo a crescer, mas o rendimento é secundário diante do acesso e da estabilidade na reserva de emergência."], ["Tarifas ou saldo mínimo", "Cobranças da conta podem corroer o valor de um saldo pequeno."]]}, {"type": "callout", "label": "Nota educacional", "text": "Investimento de longo prazo e reserva de emergência de curto prazo resolvem problemas diferentes. Este módulo trata de poupança e reservas em caixa, não de escolha de investimentos."}]}, {"n": 7, "title": "Montando a reserva de emergência por etapas", "blocks": [{"type": "p", "text": "Uma meta grande de reserva de emergência parece impossível quando se começa do zero. Uma abordagem por etapas deixa o objetivo mais prático."}, {"type": "table", "head": ["Etapa", "Finalidade"], "rows": [["Etapa 1: primeira folga pequena", "Cobrir um custo inesperado menor sem recorrer na hora a crédito caro."], ["Etapa 2: um mês de despesas essenciais", "Criar espaço para uma interrupção maior ou uma falha temporária de renda."], ["Etapa 3: reserva de prazo mais longo", "Muitos materiais de educação financeira usam alguns meses de despesas essenciais como referência de longo prazo, ajustada pela estabilidade e pelo risco de cada família."]]}, {"type": "p", "text": "Alguns materiais educacionais usam US$ 500 a US$ 1.000 como primeira marca e três a seis meses de despesas essenciais como referência de longo prazo. Não são regras. Uma meta razoável depende da estabilidade da renda, das obrigações da família, da cobertura de seguros, de necessidades de saúde e do acesso a outros recursos."}, {"type": "callout", "label": "Ponto-chave", "text": "A primeira finalidade da reserva de emergência não é alcançar um número perfeito. É reduzir a chance de a próxima despesa inesperada virar dívida cara."}]}, {"n": 8, "title": "Poupar com renda irregular", "blocks": [{"type": "p", "text": "Poupar fica mais difícil quando a renda muda de mês para mês. Uma transferência mensal fixa funciona mal quando um mês é forte e o seguinte é fraco."}, {"type": "p", "text": "Entre as alternativas:"}, {"type": "ul", "items": ["Poupar um percentual de cada pagamento em vez de um valor fixo;", "Basear o gasto essencial em uma estimativa conservadora de renda e direcionar parte dos meses melhores para a poupança;", "Formar uma folga de caixa de um mês antes de buscar objetivos maiores;", "Usar uma revisão trimestral para comparar a renda real com o orçamento e fazer uma transferência adicional quando o caixa permitir."]}, {"type": "p", "text": "O objetivo continua sendo a consistência, mas consistência pode significar seguir a mesma regra, e não transferir o mesmo valor."}, {"type": "callout", "label": "Ponto-chave", "text": "Com renda irregular, uma regra flexível de poupança costuma ser mais sustentável que um valor fixo que só funciona nos melhores meses."}]}, {"n": 9, "title": "Enganos comuns sobre poupança", "blocks": [{"type": "table", "head": ["Engano comum", "Entendimento mais preciso"], "rows": [["Preciso esperar minha renda aumentar para começar a poupar.", "Um valor pequeno e repetível já estabelece o hábito agora e pode crescer depois."], ["Vou poupar o que sobrar no fim do mês.", "Poupar primeiro ou automatizar a transferência evita que o objetivo dependa só das sobras."], ["Reserva de emergência e poupança para compras são a mesma coisa.", "Separar as duas ajuda a proteger o dinheiro da emergência dos gastos previsíveis."], ["Uma reserva de emergência pequena não serve para nada.", "Mesmo uma folga modesta cobre parte ou todo um gasto inesperado menor e reduz a dependência de dívida."], ["O maior rendimento é sempre o melhor lugar para a reserva de emergência.", "Acesso, estabilidade, tarifas e condições da conta importam junto com o rendimento."], ["Depois que automatizo a poupança, nunca mais preciso revisar.", "A automação deve ser ajustada conforme renda, despesas e objetivos mudam."], ["Poupar e investir são a mesma coisa.", "A poupança foca em liquidez e estabilidade de curto prazo; o investimento em geral aceita mais incerteza em troca de objetivos de crescimento de longo prazo."]]}, {"type": "callout", "label": "Ponto-chave", "text": "Poupança é um sistema, não uma meta isolada. O sistema funciona quando objetivo, conta, método de transferência e rotina de revisão combinam com o seu fluxo de caixa real."}]}], "quiz": [{"prompt": "Qual é uma finalidade financeira central da reserva de emergência?", "options": [{"text": "Cobrir despesas inesperadas sem precisar assumir dívida nova de imediato", "correct": true}, {"text": "Maximizar o retorno de investimentos de longo prazo", "correct": false}, {"text": "Pagar apenas despesas anuais previsíveis", "correct": false}, {"text": "Aumentar seu limite de crédito", "correct": false}], "feedback": "A reserva de emergência serve para absorver custos inesperados ou interrupções de renda, para que nem toda surpresa exija um empréstimo novo."}, {"prompt": "Qual a diferença entre um sinking fund e a reserva de emergência?", "options": [{"text": "O sinking fund é para despesas futuras esperadas; a reserva de emergência é para necessidades imprevistas", "correct": true}, {"text": "O sinking fund é investido em ações; a reserva de emergência precisa ser em dinheiro", "correct": false}, {"text": "A reserva de emergência só vale para despesas médicas", "correct": false}, {"text": "Não há diferença", "correct": false}], "feedback": "Sinking funds planejam despesas futuras conhecidas. Reservas de emergência ficam guardadas para eventos que você não consegue prever com exatidão."}, {"prompt": "O que torna um objetivo de poupança mais concreto?", "options": [{"text": "Um valor específico, uma data e uma finalidade", "correct": true}, {"text": "Um limite de crédito alto", "correct": false}, {"text": "Apenas um depósito inicial grande", "correct": false}, {"text": "Usar o mesmo objetivo que todo mundo", "correct": false}], "feedback": "O objetivo fica mais fácil de planejar quando valor, prazo e finalidade estão claros."}, {"prompt": "Por que transferências automáticas sustentam o hábito de poupar?", "options": [{"text": "Elas garantem retornos altos de investimento", "correct": false}, {"text": "Elas reduzem a necessidade de tomar uma decisão nova de poupança a cada mês", "correct": true}, {"text": "Elas eliminam todas as tarifas bancárias", "correct": false}, {"text": "Elas tornam a renda mais previsível", "correct": false}], "feedback": "A automação torna poupar o comportamento padrão e reduz a dependência de memória ou de força de vontade repetida."}, {"prompt": "Qual afirmação descreve melhor começar com um valor pequeno de poupança?", "options": [{"text": "Não adianta a menos que o valor seja grande", "correct": false}, {"text": "Constrói consistência e pode aumentar depois, conforme o caixa melhora", "correct": true}, {"text": "Sempre gera dinheiro suficiente para uma reserva completa em um ano", "correct": false}, {"text": "Impede que você mude o objetivo depois", "correct": false}], "feedback": "Uma transferência pequena e sustentável estabelece o hábito e pode crescer quando a renda ou as despesas mudarem."}, {"prompt": "Quais qualidades costumam ser importantes para a poupança de emergência de curto prazo?", "options": [{"text": "Liquidez e estabilidade", "correct": true}, {"text": "Volatilidade máxima de mercado", "correct": false}, {"text": "Prazos longos de carência", "correct": false}, {"text": "Alta capacidade de endividamento", "correct": false}], "feedback": "A reserva de emergência deve ser acessível e estável, porque o momento da emergência é incerto."}, {"prompt": "Qual é uma forma razoável de montar uma reserva de emergência?", "options": [{"text": "Usar etapas, começando com uma folga menor e aumentando a meta ao longo do tempo", "correct": true}, {"text": "Esperar até conseguir guardar vários meses de despesas de uma vez", "correct": false}, {"text": "Tomar emprestado para formar o saldo da reserva", "correct": false}, {"text": "Usar a reserva de emergência para as contas rotineiras todo mês", "correct": false}], "feedback": "A abordagem por etapas deixa o objetivo mais administrável e já cria proteção relevante pelo caminho."}, {"prompt": "O que funciona melhor para quem tem renda irregular?", "options": [{"text": "Poupar um percentual de cada pagamento ou usar uma regra flexível", "correct": true}, {"text": "Comprometer-se com um valor que só cabe no mês de maior renda", "correct": false}, {"text": "Nunca poupar até a renda ficar fixa", "correct": false}, {"text": "Usar cartão de crédito no lugar da poupança", "correct": false}], "feedback": "Uma regra baseada em cada pagamento se adapta à variação da renda e preserva a consistência."}, {"prompt": "Por que uma conta de poupança separada é útil?", "options": [{"text": "Ela garante um credit score mais alto", "correct": false}, {"text": "Ela cria separação prática e psicológica do gasto do dia a dia", "correct": true}, {"text": "Ela elimina todos os impostos", "correct": false}, {"text": "Ela impede qualquer saque", "correct": false}], "feedback": "A separação reduz o gasto acidental e deixa mais clara a finalidade daquele dinheiro."}, {"prompt": "Qual afirmação sobre automação da poupança é mais precisa?", "options": [{"text": "Depois de configurada, nunca deve ser alterada", "correct": false}, {"text": "É útil, mas o valor deve ser revisto conforme renda, despesas e objetivos mudam", "correct": true}, {"text": "Funciona apenas para famílias de renda alta", "correct": false}, {"text": "Garante que você nunca mais vai precisar de dívida", "correct": false}], "feedback": "A automação reduz o atrito, mas um sistema sustentável ainda precisa de revisão e ajuste periódicos."}], "quizIntro": "Responda às 10 questões a seguir para testar seu entendimento sobre hábitos de poupança e objetivos. Escolha a melhor resposta para cada uma.", "summary": [{"type": "p", "text": "Neste módulo, você aprendeu:"}, {"type": "ul", "items": ["Por que a poupança cria flexibilidade financeira e reduz a necessidade de tomar emprestado diante de despesas inesperadas;", "A diferença entre reserva de emergência, sinking funds e poupança para objetivos específicos;", "Como converter um valor-alvo e um prazo em um número mensal prático de poupança;", "Por que a automação reduz o atrito comportamental e torna a poupança mais consistente;", "Por que começar com um valor pequeno e sustentável costuma funcionar melhor do que esperar o momento perfeito;", "O que liquidez, estabilidade, separação de conta, rendimento e tarifas significam para a poupança de curto prazo;", "Como montar a reserva de emergência por etapas, em vez de tratar uma meta grande como única definição de sucesso;", "Como uma regra de poupança por percentual ou flexível funciona com renda irregular;", "Enganos comuns sobre poupança e um entendimento mais prático de cada um."]}], "reflection": ["Você tem uma reserva de emergência hoje? Se sim, que tipo de despesa ela cobriria? Se não, o que tem dificultado começar?", "Na sua vida financeira, qual é a diferença entre poupar para um objetivo específico e poupar como hábito geral?", "Qual pequena ação automática de poupança você poderia configurar nesta semana e manter de forma realista pelos próximos três meses?"], "actionTask": {"title": "Configure sua primeira transferência automática de poupança", "steps": ["Escolha um valor realista, mesmo que seja US$ 10 ou US$ 25, que você consiga transferir automaticamente de forma recorrente sem atrapalhar despesas essenciais.", "Configure uma transferência automática para uma conta de poupança separada no dia do seu próximo pagamento ou logo depois dele, ou defina a regra exata de transferência que você vai usar se a sua renda for irregular.", "Defina um objetivo de poupança de três meses e escreva o que esse dinheiro deve proteger ou realizar."]}, "disclaimer": "Este módulo é educacional e foi feito para ajudar você a entender hábitos de poupança, reservas de emergência, automação e definição de objetivos financeiros. Ele não constitui aconselhamento jurídico, financeiro, de investimento, bancário ou tributário. Para orientação sobre a sua situação específica, consulte um profissional qualificado.", "practiceIntro": "Para encerrar este módulo, reserve alguns minutos para refletir sobre o que aprendeu antes de fazer a tarefa prática. Não existem respostas certas ou erradas. O objetivo é conectar o conteúdo à sua própria situação financeira.", "taskPurpose": "Aplicar o que você aprendeu neste módulo à sua própria situação financeira, por meio de uma ação concreta e de baixo risco nesta semana.", "taskInstruction": "Faça os três passos a seguir antes do fim da semana:"}};
const GLOSSARY_PT = [{"term": "Annual Percentage Rate (APR)", "def": "APR, ou Annual Percentage Rate, representa o custo anualizado de tomar dinheiro emprestado segundo as condições da conta de crédito.", "m": 2, "l": 4}, {"term": "Annual Percentage Yield (APY)", "def": "APY expressa o retorno anualizado de uma conta de poupança ou depósito. Em reserva de emergência, o rendimento é secundário diante do acesso e da estabilidade.", "m": 6, "l": 6}, {"term": "Authorized user", "def": "Se você tem um familiar ou pessoa próxima com histórico de crédito sólido, ser incluído como authorized user no cartão dessa pessoa pode fazer com que o bom histórico de pagamentos dela beneficie você.", "m": 1, "l": 5}, {"term": "Automatic transfer", "def": "Transferência recorrente agendada com antecedência, muitas vezes no dia do pagamento, que leva dinheiro para a poupança antes de ele chegar à conta de gastos. Torna o ato de poupar mais próximo de um comportamento padrão do que de uma decisão mensal.", "m": 6, "l": 4}, {"term": "Billing cycle", "def": "O billing cycle é o período em que compras, pagamentos, créditos e outras movimentações da conta são registrados.", "m": 2, "l": 2}, {"term": "Budget", "def": "Um orçamento é um plano para o dinheiro que você ainda não gastou.", "m": 3, "l": 1}, {"term": "Cash-flow buffer", "def": "Pequena reserva de dinheiro acessível, guardada para que custos inesperados menores não virem dívida nova de imediato.", "m": 6, "l": 8}, {"term": "Charge-Off", "def": "Quando o credor baixa a dívida como prejuízo; permanece no relatório por até sete anos", "m": 1, "l": 9}, {"term": "Credit", "def": "Crédito é a possibilidade de pegar dinheiro emprestado ou acessar bens e serviços agora, com o compromisso de pagar depois.", "m": 1, "l": 1}, {"term": "Credit bureaus", "def": "Os credit bureaus, também chamados de agências de informação ao consumidor, reúnem e mantêm informações sobre seu histórico de empréstimos e pagamentos, e organizam esses dados em credit reports.", "m": 1, "l": 2}, {"term": "Credit card", "def": "O cartão de crédito é uma forma de crédito rotativo que permite fazer compras com dinheiro do emissor, com o compromisso de devolver o que foi usado.", "m": 2, "l": 1}, {"term": "Credit counseling", "def": "Orientação e apoio estruturado oferecidos por organizações, inclusive entidades sem fins lucrativos, a pessoas que administram dívidas. Desconfie de empresas que prometem eliminação garantida de dívidas ou exigem pagamentos altos adiantados sem serviços claros.", "m": 5, "l": 10}, {"term": "Credit Freeze", "def": "Restrição colocada no seu cadastro para impedir a abertura de contas novas sem autorização", "m": 1, "l": 9}, {"term": "Credit Limit", "def": "O valor máximo que você está autorizado a usar em uma conta de crédito", "m": 1, "l": 9}, {"term": "Credit report", "def": "O credit report é o documento a partir do qual seu credit score é calculado.", "m": 1, "l": 6}, {"term": "Credit score", "def": "O credit score é um número de três dígitos, normalmente entre 300 e 850, que resume o quanto você é considerado confiável para receber crédito, com base no seu histórico.", "m": 1, "l": 3}, {"term": "Credit utilization", "def": "Credit utilization é quanto do crédito rotativo você está usando em relação aos limites disponíveis.", "m": 2, "l": 5}, {"term": "Credit-builder loan", "def": "Algumas credit unions e bancos comunitários oferecem credit-builder loans, empréstimos pequenos feitos especificamente para ajudar as pessoas a formar crédito.", "m": 1, "l": 5}, {"term": "Debt", "def": "Dívida é um compromisso sobre a renda futura, criado ao tomar emprestado hoje. Toda dívida gera uma obrigação de pagamento que fica no seu orçamento até ser quitada.", "m": 5, "l": 1}, {"term": "Debt avalanche", "def": "Método de quitação que direciona os pagamentos extras primeiro à dívida de maior APR e depois à seguinte. Costuma reduzir ao máximo o total de juros quando os demais fatores são iguais.", "m": 5, "l": 7}, {"term": "Debt consolidation", "def": "Substituir uma ou mais dívidas existentes por um produto novo. Muda a taxa e a estrutura de pagamento, mas o saldo ainda precisa ser pago.", "m": 5, "l": 8}, {"term": "Debt map", "def": "Lista única de todas as dívidas que você tem, com saldo, APR ou taxa de juros, pagamento mínimo, data de vencimento, tipo de taxa e eventual período promocional.", "m": 5, "l": 6}, {"term": "Debt snowball", "def": "Método de quitação que direciona os pagamentos extras primeiro ao menor saldo e depois transfere esse valor para o saldo seguinte. Pode gerar vitórias visíveis mais rápido.", "m": 5, "l": 7}, {"term": "Emergency fund", "def": "Dinheiro reservado para despesas inesperadas ou interrupção temporária de renda, como um conserto urgente do carro ou um intervalo entre empregos. Cobre o que você não consegue prever.", "m": 6, "l": 2}, {"term": "Fees", "def": "Tarifas são cobranças específicas que podem ser aplicadas segundo as condições da conta.", "m": 2, "l": 4}, {"term": "Fixed rate", "def": "Taxa de juros que permanece a mesma pelas condições da conta durante o período informado, o que torna a parcela mais previsível.", "m": 5, "l": 6}, {"term": "Fraud alert", "def": "O fraud alert avisa os credores para tomarem cuidados extras na verificação da sua identidade antes de abrir contas novas.", "m": 1, "l": 7}, {"term": "Goal savings", "def": "Dinheiro separado para um objetivo futuro específico, como educação, custos de mudança, viagem ou uma compra planejada.", "m": 6, "l": 2}, {"term": "Grace Period", "def": "O período após o fechamento da fatura em que você pode pagar o saldo integral sem juros", "m": 1, "l": 9}, {"term": "Habitual expense", "def": "O gasto habitual continua existindo principalmente porque já existia antes.", "m": 3, "l": 4}, {"term": "Hard Inquiry", "def": "Consulta ao crédito feita por um credor quando você pede crédito; afeta sua pontuação", "m": 1, "l": 9}, {"term": "High-yield savings account", "def": "Conta de poupança que em geral paga uma taxa mais alta que a de uma conta comum. Avalie acesso, tarifas, valores mínimos e o seguro de depósito aplicável junto com a taxa.", "m": 6, "l": 6}, {"term": "Intentional expense", "def": "O gasto intencional é aquele que você escolheria de novo hoje, porque entrega um valor que você consegue nomear.", "m": 3, "l": 4}, {"term": "Irregular expense", "def": "O gasto irregular é aquele que não acontece todo mês.", "m": 3, "l": 7}, {"term": "Late fee", "def": "Cobrança que pode ser aplicada quando um pagamento devido não é feito até o vencimento. O pagamento perdido também pode gerar juros, encerrar uma taxa promocional ou aparecer no seu histórico de crédito.", "m": 4, "l": 4}, {"term": "Liquidity", "def": "A rapidez com que você consegue acessar o dinheiro quando precisa. A reserva de emergência em geral precisa de liquidez e estabilidade.", "m": 6, "l": 6}, {"term": "Minimum payment", "def": "O pagamento mínimo é o menor valor que o emissor exige até o vencimento para que a conta não entre em atraso, conforme as condições do contrato.", "m": 2, "l": 3}, {"term": "Monthly maintenance fee", "def": "Tarifa recorrente da conta, que às vezes pode ser dispensada quando as condições previstas no contrato são cumpridas.", "m": 4, "l": 5}, {"term": "Origination fee", "def": "Cobrança aplicada no momento da liberação de um empréstimo. Pode reduzir o valor que efetivamente chega até você.", "m": 4, "l": 7}, {"term": "Overdraft charge", "def": "Cobrança que pode ser aplicada quando uma transação é paga mesmo sem saldo suficiente na conta, conforme as políticas do banco e as configurações da sua conta.", "m": 4, "l": 5}, {"term": "Principal", "def": "O valor tomado emprestado, separado de juros e tarifas. Quando a taxa é alta e o pagamento é pequeno, boa parte dele vai para juros em vez de reduzir o principal.", "m": 5, "l": 4}, {"term": "Promotional rate", "def": "Taxa temporária oferecida sob condições determinadas. Os termos promocionais costumam ter data de validade, e outra taxa passa a valer quando a promoção acaba.", "m": 4, "l": 9}, {"term": "Recurring expense", "def": "O gasto recorrente é qualquer custo que se repete com regularidade: mensal, trimestral ou anual.", "m": 3, "l": 3}, {"term": "Returned-payment charge", "def": "Cobrança que pode ser aplicada quando um pagamento ou transação é devolvido por falta de saldo suficiente, quando permitido pelas condições da conta. Também chamada de tarifa por fundos insuficientes.", "m": 4, "l": 5}, {"term": "Secured credit card", "def": "O secured credit card exige um depósito em dinheiro que normalmente se torna o seu limite.", "m": 1, "l": 5}, {"term": "Security freeze", "def": "Você pode solicitar gratuitamente um security freeze no seu cadastro em cada bureau, o que impede que novos credores acessem seu relatório sem a sua permissão.", "m": 1, "l": 7}, {"term": "Sinking fund", "def": "O sinking fund é o dinheiro separado aos poucos para uma despesa futura já conhecida.", "m": 3, "l": 8}, {"term": "Soft Inquiry", "def": "Consulta que não afeta a pontuação, como checar o próprio crédito", "m": 1, "l": 9}, {"term": "Total amount repaid", "def": "O efeito combinado de principal, juros e cobranças aplicáveis ao longo de todo o período de pagamento. Dá uma visão mais ampla do custo do que a parcela mensal sozinha.", "m": 4, "l": 7}, {"term": "Variable rate", "def": "Taxa de juros que pode mudar conforme as condições da conta, o que faz o custo de carregar um saldo subir ou cair ao longo do tempo.", "m": 5, "l": 6}];
const CONTENT_ES = {"1": {"n": 1, "title": "Cómo funciona el sistema de crédito de Estados Unidos", "subtitle": "Credit score, historial de crédito, comportamiento de pago y cómo tus decisiones financieras afectan tus oportunidades de largo plazo en Estados Unidos.", "meta": "10 Lecciones · 15 Preguntas · 1 Tarea práctica · Tiempo estimado: 35 minutos · Nivel: Fundamentos", "overview": [{"type": "p", "text": "En Estados Unidos, tu historial de crédito es uno de los registros financieros más importantes que vas a construir. Influye en si logras alquilar un apartamento, financiar un carro, obtener una tarjeta de crédito o, más adelante, comprar una casa. Para quien creció fuera de Estados Unidos, el sistema de crédito estadounidense suele parecer extraño o poco transparente, porque funciona con reglas distintas a las de otros países. Este módulo explica cómo funciona el sistema de crédito estadounidense, qué es un credit score y cómo se calcula, cómo se forma el historial de crédito a lo largo del tiempo y cuáles decisiones del día a día te ayudan a construir y mantener un buen perfil de crédito en Estados Unidos."}, {"type": "callout", "label": "Objetivo de aprendizaje", "text": "Al final de este módulo vas a entender cómo funciona el sistema de crédito estadounidense, cómo se calcula tu credit score y cuáles comportamientos financieros contribuyen a construir un historial de crédito sólido a lo largo del tiempo."}], "lessons": [{"n": 1, "title": "Qué es el crédito y por qué importa", "blocks": [{"type": "p", "text": "El crédito es la posibilidad de tomar dinero prestado o acceder a bienes y servicios ahora, con el compromiso de pagar después. En Estados Unidos, el crédito va más allá de una herramienta financiera: es una señal que los prestamistas, los dueños de inmuebles y las instituciones financieras usan para evaluar qué tan confiable eres como deudor y como inquilino. En algunos países, la confiabilidad financiera se evalúa principalmente por el ahorro o por el comprobante de ingresos. El sistema estadounidense le da mucho peso a tu historial de crédito, que es el registro de cómo administraste el dinero prestado y las obligaciones de pago a lo largo del tiempo. Por qué el crédito importa en la vida diaria en Estados Unidos:"}, {"type": "ul", "items": ["Alquilar un apartamento: la mayoría de los dueños consulta tu credit report como parte del proceso de aprobación. Un historial corto o malo puede llevar al rechazo o a la exigencia de un depósito de garantía más alto.", "Abrir cuentas de servicios públicos: algunas empresas de servicios consultan el crédito antes de activar el servicio.", "Financiar un carro: las tasas de interés del financiamiento de vehículos están muy influidas por tu credit score. Un puntaje más alto puede ayudarte a conseguir tasas más bajas y, según las condiciones del contrato, cuotas más bajas."]}, {"type": "ul", "items": ["Solicitar una tarjeta de crédito: tu credit score pesa bastante en la aprobación, en el límite otorgado y en la tasa de interés.", "Comprar una casa en el futuro: los bancos usan el credit score para definir si calificas para el financiamiento y con qué tasa de interés."]}, {"type": "callout", "label": "Punto clave", "text": "En Estados Unidos, no tener historial de crédito limita casi tanto como tener un historial malo. Construir crédito de forma intencional desde que llegas es uno de los pasos financieros más importantes que puedes dar."}]}, {"n": 2, "title": "Los tres grandes bureaus de crédito", "blocks": [{"type": "p", "text": "Los credit bureaus, también llamados agencias de información al consumidor, reúnen y mantienen información sobre tu historial de préstamos y pagos, y organizan esos datos en credit reports. Los credit scores se calculan con modelos de puntaje, como FICO o VantageScore, a partir de la información contenida en esos reportes. Los tres grandes bureaus de Estados Unidos son Equifax, Experian y TransUnion. Cada uno recoge datos de bancos, emisores de tarjetas y otras instituciones financieras. Como no todos los prestamistas reportan a los tres, la información que cada bureau tiene sobre ti puede ser un poco distinta, y por eso tu credit score puede variar de uno a otro."}, {"type": "table", "head": ["Bureau", "Qué conviene saber"], "rows": [["Equifax", "Uno de los tres grandes; muy usado por los bancos en el financiamiento de vivienda"], ["Experian", "Usado con frecuencia en el financiamiento de vehículos y en las solicitudes de tarjeta de crédito"], ["TransUnion", "Puede usarse en el análisis de alquiler y en ciertas verificaciones de antecedentes permitidas"]]}, {"type": "callout", "label": "Nota educativa", "text": "La ley federal garantiza al menos un reporte gratuito cada 12 meses en cada bureau nacional. Actualmente los tres ofrecen reportes gratuitos cada semana por AnnualCreditReport.com, la única fuente autorizada por el gobierno federal para credit reports gratuitos."}]}, {"n": 3, "title": "Qué es un credit score", "blocks": [{"type": "p", "text": "El credit score es un número de tres dígitos, normalmente entre 300 y 850, que resume qué tan confiable te consideran para recibir crédito, con base en tu historial. El modelo más usado en Estados Unidos es el FICO Score, desarrollado por Fair Isaac Corporation. Rangos del FICO Score:"}, {"type": "table", "head": ["Rango de puntaje", "Clasificación", "Qué significa en la práctica"], "rows": [["800 – 850", "Excepcional", "Las mejores tasas y condiciones disponibles"], ["740 – 799", "Muy bueno", "Tasas mejores que el promedio"], ["670 – 739", "Bueno", "Tasas cercanas al promedio o por encima de él"], ["580 – 669", "Regular", "Tasas más altas y menos opciones"], ["300 – 579", "Malo", "Las opciones de crédito pueden ser limitadas y las condiciones menos favorables"]]}]}, {"n": 4, "title": "Cómo se calcula el credit score", "blocks": [{"type": "p", "lead": "Tu FICO Score", "text": "se calcula a partir de cinco categorías, cada una con un peso distinto. Entender esos factores te ayuda a saber cuáles comportamientos financieros afectan tu puntaje de forma más directa."}, {"type": "p", "text": "Pesos aproximados de los factores en un FICO Score típico"}, {"type": "table", "head": ["Factor", "Peso aproximado"], "rows": [["Historial de pagos", "35%: el factor más importante"], ["Montos adeudados", "30%: la credit utilization es un componente central de esta categoría"], ["Antigüedad del historial de crédito", "15%"], ["Variedad de tipos de crédito", "10%"], ["Crédito nuevo (hard inquiries)", "10%"]]}, {"type": "p", "lead": "Historial de pagos (35%)", "text": "El historial de pagos es el factor individual más importante de tu credit score. Registra si pagaste tus cuentas a tiempo. Un solo pago omitido o atrasado puede bajar bastante el puntaje y permanecer en tu credit report hasta por siete años. Pagar todas las cuentas a tiempo, todos los meses, es el comportamiento más asociado a la construcción y al mantenimiento de un historial de crédito sólido a lo largo del tiempo. Montos adeudados (30%) La credit utilization es la relación entre los saldos actuales de tus tarjetas y el límite total disponible. Por ejemplo, si tienes una tarjeta con un límite de $1,000 y un saldo de $400, tu utilización es de 40%. Muchos materiales de educación financiera usan 30% como referencia general para entender este comportamiento. En otro ejemplo, si el límite total es de $5,000 y el saldo reportado es de $1,000, la utilización es de 20%."}, {"type": "callout", "label": "Nota educativa", "text": "Mantener los saldos bajos en relación con el límite es un principio ampliamente discutido en la educación sobre crédito."}, {"type": "p", "text": "Revisar el saldo antes de la fecha de cierre del estado de cuenta, y no solo en la fecha de vencimiento, te ayuda a entender cómo se informa la utilización a los bureaus. Antigüedad del historial de crédito (15%) Este factor considera desde cuándo están abiertas tus cuentas de crédito, incluyendo la antigüedad de la
