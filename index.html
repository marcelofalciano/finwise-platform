const CONTENT_PT = {"1": {"n": 1, "title": "Como funciona o sistema de crédito dos Estados Unidos", "subtitle": "Credit score, histórico de crédito, comportamento de pagamento e como suas decisões financeiras afetam suas oportunidades de longo prazo nos Estados Unidos.", "meta": "10 Lições · 15 Questões · 1 Tarefa prática · Tempo estimado: 35 minutos · Nível: Fundamentos", "overview": [{"type": "p", "text": "Nos Estados Unidos, seu histórico de crédito é um dos registros financeiros mais importantes que você vai construir. Ele influencia se você consegue alugar um apartamento, financiar um carro, obter um cartão de crédito ou, mais adiante, comprar uma casa. Para quem cresceu fora dos Estados Unidos, o sistema de crédito americano costuma parecer estranho ou pouco transparente, porque funciona com regras diferentes das de outros países. Este módulo explica como o sistema de crédito americano funciona, o que é um credit score e como ele é calculado, como o histórico de crédito se forma ao longo do tempo e quais decisões do dia a dia ajudam você a construir e manter um bom perfil de crédito nos Estados Unidos."}, {"type": "callout", "label": "Objetivo de aprendizagem", "text": "Ao final deste módulo, você vai entender como funciona o sistema de crédito americano, como seu credit score é calculado e quais comportamentos financeiros contribuem para construir um histórico de crédito sólido ao longo do tempo."}], "lessons": [{"n": 1, "title": "O que é crédito e por que ele importa", "blocks": [{"type": "p", "text": "Crédito é a possibilidade de pegar dinheiro emprestado ou acessar bens e serviços agora, com o compromisso de pagar depois. Nos Estados Unidos, crédito vai além de uma ferramenta financeira: é um sinal que credores, proprietários de imóveis e instituições financeiras usam para avaliar o quanto você é confiável como tomador de empréstimo e como inquilino. Em alguns países, a confiabilidade financeira é avaliada principalmente por poupança ou comprovação de renda. O sistema americano dá peso grande ao seu histórico de crédito, que é o registro de como você administrou dinheiro emprestado e obrigações de pagamento ao longo do tempo. Por que o crédito importa na vida diária nos Estados Unidos:"}, {"type": "ul", "items": ["Alugar um apartamento: a maioria dos proprietários consulta seu credit report como parte do processo de aprovação. Histórico curto ou ruim pode levar à recusa ou à exigência de um depósito de garantia maior.", "Abrir contas de serviços públicos: algumas concessionárias consultam o crédito antes de ativar o serviço.", "Financiar um carro: as taxas de juros de financiamento de veículo são muito influenciadas pelo seu credit score. Uma pontuação mais alta pode ajudar a conseguir taxas menores e, dependendo das condições do contrato, parcelas menores."]}, {"type": "ul", "items": ["Pedir cartão de crédito: seu credit score pesa bastante na aprovação, no limite concedido e na taxa de juros.", "Comprar uma casa no futuro: os bancos usam o credit score para definir se você se qualifica para o financiamento e com qual taxa de juros."]}, {"type": "callout", "label": "Ponto-chave", "text": "Nos Estados Unidos, não ter histórico de crédito limita quase tanto quanto ter um histórico ruim. Construir crédito de forma intencional desde que você chega é um dos passos financeiros mais importantes que você pode dar."}]}, {"n": 2, "title": "Os três grandes bureaus de crédito", "blocks": [{"type": "p", "text": "Os credit bureaus, também chamados de agências de informação ao consumidor, reúnem e mantêm informações sobre seu histórico de empréstimos e pagamentos, e organizam esses dados em credit reports. Os credit scores são calculados por modelos de pontuação, como o FICO ou o VantageScore, a partir das informações contidas nesses relatórios. Os três grandes bureaus dos Estados Unidos são Equifax, Experian e TransUnion. Cada um coleta dados de bancos, emissores de cartão e outras instituições financeiras. Como nem todos os credores reportam aos três, as informações que cada bureau tem sobre você podem ser um pouco diferentes, e por isso seu credit score pode variar de um para outro."}, {"type": "table", "head": ["Bureau", "O que saber"], "rows": [["Equifax", "Um dos três grandes; muito usado por bancos em financiamento imobiliário"], ["Experian", "Usado com frequência em financiamento de veículos e pedidos de cartão de crédito"], ["TransUnion", "Pode ser usado na análise de locação e em certas verificações de cadastro permitidas"]]}, {"type": "callout", "label": "Nota educacional", "text": "A lei federal garante pelo menos um relatório gratuito a cada 12 meses em cada bureau nacional. Atualmente os três oferecem relatórios gratuitos toda semana pelo AnnualCreditReport.com, a única fonte autorizada pelo governo federal para credit reports gratuitos."}]}, {"n": 3, "title": "O que é um credit score", "blocks": [{"type": "p", "text": "O credit score é um número de três dígitos, normalmente entre 300 e 850, que resume o quanto você é considerado confiável para receber crédito, com base no seu histórico. O modelo mais usado nos Estados Unidos é o FICO Score, desenvolvido pela Fair Isaac Corporation. Faixas do FICO Score:"}, {"type": "table", "head": ["Faixa de pontuação", "Classificação", "O que significa na prática"], "rows": [["800 – 850", "Excepcional", "As melhores taxas e condições disponíveis"], ["740 – 799", "Muito bom", "Taxas melhores que a média"], ["670 – 739", "Bom", "Taxas próximas ou acima da média"], ["580 – 669", "Regular", "Taxas mais altas e menos opções"], ["300 – 579", "Ruim", "As opções de crédito podem ser limitadas e as condições menos favoráveis"]]}]}, {"n": 4, "title": "Como o credit score é calculado", "blocks": [{"type": "p", "lead": "Seu FICO Score", "text": "é calculado a partir de cinco categorias, cada uma com um peso diferente. Entender esses fatores ajuda a saber quais comportamentos financeiros afetam sua pontuação de forma mais direta."}, {"type": "p", "text": "Pesos aproximados dos fatores em um FICO Score típico"}, {"type": "table", "head": ["Fator", "Peso aproximado"], "rows": [["Histórico de pagamentos", "35% — o fator mais importante"], ["Valores devidos", "30% — a credit utilization é um componente central desta categoria"], ["Tempo de histórico de crédito", "15%"], ["Variedade de tipos de crédito", "10%"], ["Crédito novo (hard inquiries)", "10%"]]}, {"type": "p", "lead": "Histórico de pagamentos (35%)", "text": "O histórico de pagamentos é o fator isolado mais importante do seu credit score. Ele registra se você pagou suas contas em dia. Um único pagamento perdido ou atrasado pode derrubar bastante a pontuação e permanecer no seu credit report por até sete anos. Pagar todas as contas em dia, todo mês, é o comportamento mais associado à construção e à manutenção de um histórico de crédito sólido ao longo do tempo. Valores devidos (30%) A credit utilization é a relação entre os saldos atuais dos seus cartões e o limite total disponível. Por exemplo, se você tem um cartão com limite de US$ 1.000 e está com saldo de US$ 400, sua utilização é de 40%. Muitos materiais de educação financeira usam 30% como referência geral para entender esse comportamento. Em outro exemplo, se o limite total é de US$ 5.000 e o saldo reportado é de US$ 1.000, a utilização é de 20%."}, {"type": "callout", "label": "Nota educacional", "text": "Manter os saldos baixos em relação ao limite é um princípio amplamente discutido na educação sobre crédito."}, {"type": "p", "text": "Conferir o saldo antes da data de fechamento da fatura, e não apenas na data de vencimento, ajuda a entender como a utilização é informada aos bureaus. Tempo de histórico de crédito (15%) Este fator considera há quanto tempo suas contas de crédito estão abertas, incluindo a idade da conta mais antiga, a da mais recente e a média de todas. Quanto mais longo o histórico, mais dados os credores têm para avaliar sua confiabilidade. Por isso costuma não ser recomendável fechar contas antigas sem necessidade. Variedade de tipos de crédito (10%) Refere-se aos tipos de crédito que você tem, incluindo crédito rotativo, como cartões, e crédito parcelado, como financiamento de veículo, empréstimo estudantil ou empréstimo pessoal. Ter uma variedade pode ser um sinal positivo, embora não seja necessário abrir contas de que você não precisa apenas para melhorar esse fator. Crédito novo e hard inquiries (10%) Quando você pede um crédito novo, o credor normalmente faz uma hard inquiry no seu credit report. Várias consultas desse tipo em pouco tempo podem reduzir um pouco sua pontuação. Já as soft inquiries, como consultar o próprio score, não afetam a pontuação."}]}, {"n": 5, "title": "Construindo histórico de crédito do zero", "blocks": [{"type": "p", "text": "Se você chegou há pouco tempo aos Estados Unidos ou está começando agora no sistema de crédito americano, é provável que tenha pouco ou nenhum histórico. Os caminhos a seguir são os mais usados para começar a formar um perfil de crédito. Secured credit cards O secured credit card exige um depósito em dinheiro que normalmente vira o seu limite. Como o risco para o emissor é baixo, esse tipo de cartão costuma ser acessível para quem não tem histórico. Usar o cartão em compras pequenas e pagar o saldo integral todo mês é uma forma comum de começar a formar histórico de pagamentos. Credit-builder loans Algumas credit unions e bancos comunitários oferecem credit-builder loans, empréstimos pequenos feitos justamente para ajudar a formar crédito. O valor fica retido em uma conta poupança enquanto você paga as parcelas, e os pagamentos são informados aos bureaus. Tornar-se authorized user Se você tem um familiar ou pessoa próxima com histórico de crédito sólido, ser incluído como authorized user no cartão dessa pessoa pode fazer com que o bom histórico de pagamentos dela beneficie você. Informar aluguel e contas de consumo Alguns serviços permitem informar aos bureaus o pagamento em dia do aluguel e de contas de consumo, o que ajuda a formar histórico mesmo sem produtos de crédito tradicionais."}, {"type": "callout", "label": "Atenção", "text": "Construir crédito leva tempo. Um bom perfil se forma aos poucos, com pagamentos em dia de forma consistente e uso responsável do crédito. Não existem atalhos que melhorem a pontuação de forma permanente."}]}, {"n": 6, "title": "Entendendo seu credit report", "blocks": [{"type": "p", "text": "O credit report é o documento a partir do qual seu credit score é calculado. Ele traz o registro detalhado de todas as suas contas de crédito, histórico de pagamentos, saldos, consultas e registros públicos, como falências. Revisar seu relatório com regularidade é um hábito financeiro importante. A lei federal garante pelo menos um relatório gratuito a cada 12 meses em cada um dos três grandes bureaus, e atualmente eles disponibilizam relatórios gratuitos toda semana pelo AnnualCreditReport.com."}, {"type": "p", "text": "O que observar ao revisar seu credit report:"}, {"type": "p", "text": "Se você encontrar um erro no relatório, tem o direito de contestá-lo junto ao bureau. A agência é obrigada a investigar e corrigir erros legítimos."}, {"type": "ul", "items": ["Contas que você não abriu, o que pode indicar roubo de identidade ou fraude;", "Pagamentos marcados como atrasados que na verdade foram feitos em dia, o que pode ser erro de informação;", "Contas listadas como abertas que você já encerrou;", "Dados pessoais incorretos, como nome, endereço ou número de Social Security;", "Registros negativos que já passaram do prazo de permanência e não deveriam mais aparecer."]}]}, {"n": 7, "title": "Protegendo seu crédito", "blocks": [{"type": "p", "text": "Proteger o crédito é tão importante quanto construí-lo. Roubo de identidade, contas abertas sem autorização e erros de informação podem prejudicar sua pontuação mesmo quando seu comportamento financeiro é responsável. Credit freeze Você pode solicitar gratuitamente um security freeze no seu cadastro em cada bureau, o que impede que novos credores acessem seu relatório sem a sua permissão. É uma das ferramentas mais eficazes contra roubo de identidade e pedidos de crédito não autorizados. Fraud alerts O fraud alert avisa os credores para tomarem cuidados extras na verificação da sua identidade antes de abrir contas novas. Basta acionar um bureau, que é obrigado a comunicar os outros dois. Monitorar o crédito com regularidade Muitos bancos e emissores de cartão já oferecem monitoramento gratuito do credit score como parte da conta. Usar esses recursos junto com os relatórios gratuitos do AnnualCreditReport.com dá visibilidade contínua sobre seu perfil de crédito."}]}, {"n": 8, "title": "Enganos comuns sobre crédito", "blocks": [{"type": "table", "head": ["Engano comum", "Entendimento mais preciso"], "rows": [["Consultar meu próprio score derruba a pontuação.", "Consultar o próprio score é uma soft inquiry e não afeta a pontuação."], ["Deixar saldo no cartão constrói crédito mais rápido.", "Pagar o saldo integral todo mês demonstra uso responsável sem pagar juros desnecessários."], ["Fechar cartões antigos melhora minha pontuação.", "Fechar um cartão às vezes derruba a pontuação, principalmente porque reduz o limite total disponível e pode aumentar sua credit utilization."], ["Preciso de renda alta para ter bom crédito.", "Renda não entra no cálculo do credit score."], ["Pagar uma conta em cobrança a remove do relatório.", "Contas em cobrança já pagas ainda podem aparecer no relatório por até sete anos a partir da data original da inadimplência."], ["Meu score em outro país vale nos Estados Unidos.", "Históricos de crédito em geral não são transferidos entre países. Nos Estados Unidos você começa do zero."]]}]}, {"n": 9, "title": "Vocabulário de crédito", "blocks": [{"type": "p", "text": "O sistema de crédito americano usa termos específicos que vale conhecer antes de pedir crédito ou revisar seu credit report."}, {"type": "table", "head": ["Termo", "Definição"], "rows": [["Annual Percentage Rate (APR)", "O custo anual de tomar dinheiro emprestado, expresso em percentual"], ["Credit Limit", "O valor máximo que você está autorizado a usar em uma conta de crédito"], ["Credit Utilization", "O percentual do crédito disponível que você está usando no momento"], ["Grace Period", "O período após o fechamento da fatura em que você pode pagar o saldo integral sem juros"], ["Hard Inquiry", "Consulta ao crédito feita por um credor quando você pede crédito; afeta sua pontuação"], ["Soft Inquiry", "Consulta que não afeta a pontuação, como checar o próprio crédito"], ["Charge-Off", "Quando o credor baixa a dívida como prejuízo; permanece no relatório por até sete anos"], ["Credit Freeze", "Restrição colocada no seu cadastro para impedir a abertura de contas novas sem autorização"]]}]}, {"n": 10, "title": "Reflexão e tarefa prática", "blocks": [{"type": "p", "text": "Para encerrar este módulo, reserve alguns minutos para refletir sobre o que aprendeu antes de fazer a tarefa prática. Não existem respostas certas ou erradas. O objetivo é conectar o conteúdo à sua própria situação financeira."}, {"type": "callout", "label": "Objetivo de aprendizagem", "text": "Aplicar o que você aprendeu neste módulo à sua própria situação financeira, por meio de uma ação concreta e de baixo risco nesta semana."}]}], "quiz": [{"prompt": "Qual das opções descreve melhor o que o credit score mede?", "options": [{"text": "O total das suas economias e bens", "correct": false}, {"text": "Sua confiabilidade em pagar dinheiro emprestado, com base no comportamento passado", "correct": true}, {"text": "Sua renda anual em relação às suas despesas", "correct": false}, {"text": "A quantidade de cartões de crédito que você tem hoje", "correct": false}], "feedback": "O credit score resume sua confiabilidade para receber crédito com base no histórico de administrar dinheiro emprestado e obrigações de pagamento. Renda e patrimônio não entram nesse cálculo."}, {"prompt": "Qual é o nome do modelo de pontuação de crédito mais usado nos Estados Unidos?", "options": [{"text": "VantageScore", "correct": false}, {"text": "FICO Score", "correct": true}, {"text": "Equifax Score", "correct": false}, {"text": "TransUnion Index", "correct": false}], "feedback": "O FICO Score, desenvolvido pela Fair Isaac Corporation, é o modelo de pontuação de crédito mais usado nos Estados Unidos."}, {"prompt": "Qual faixa de credit score é geralmente considerada boa pela maioria dos credores americanos?", "options": [{"text": "300 – 579", "correct": false}, {"text": "580 – 669", "correct": false}, {"text": "670 – 739", "correct": true}, {"text": "800 – 850", "correct": false}], "feedback": "Uma pontuação de 670 a 739 costuma ser considerada boa. De 740 para cima, a classificação é muito boa ou excepcional."}, {"prompt": "Qual fator tem o maior impacto no seu FICO Score?", "options": [{"text": "Tempo de histórico de crédito (15%)", "correct": false}, {"text": "Variedade de tipos de crédito (10%)", "correct": false}, {"text": "Histórico de pagamentos (35%)", "correct": true}, {"text": "Valores devidos (30%)", "correct": false}], "feedback": "O histórico de pagamentos é o fator isolado mais importante e responde por 35% do FICO Score. Pagar todas as contas em dia é a forma mais confiável de construir e proteger sua pontuação."}, {"prompt": "O que é credit utilization?", "options": [{"text": "A quantidade de pedidos de crédito que você enviou", "correct": false}, {"text": "A relação entre seus saldos atuais e o limite total de crédito disponível", "correct": true}, {"text": "O total de dívidas que você deve somando todas as contas", "correct": false}, {"text": "A idade média de todas as suas contas de crédito abertas", "correct": false}], "feedback": "Credit utilization é a relação entre os saldos atuais dos seus cartões e o limite total disponível. É um componente central da categoria de valores devidos, que responde por 30% do FICO Score."}, {"prompt": "Por quanto tempo um pagamento perdido pode permanecer no seu credit report?", "options": [{"text": "Um ano", "correct": false}, {"text": "Três anos", "correct": false}, {"text": "Até sete anos", "correct": true}, {"text": "Até dez anos", "correct": false}], "feedback": "Um pagamento perdido ou atrasado pode permanecer no seu credit report por até sete anos, contados da data em que o pagamento deixou de ser feito."}, {"prompt": "O que é uma hard inquiry?", "options": [{"text": "Quando você consulta seu próprio credit score", "correct": false}, {"text": "Quando um credor consulta seu credit report depois que você pede crédito", "correct": true}, {"text": "Quando um proprietário confere seu histórico de locação", "correct": false}, {"text": "Quando seu banco revisa a movimentação da sua conta", "correct": false}], "feedback": "A hard inquiry acontece quando um credor consulta seu credit report em resposta a um pedido de crédito que você fez. Ela pode reduzir um pouco sua pontuação."}, {"prompt": "Qual destas é a única fonte autorizada pelo governo federal para credit reports gratuitos?", "options": [{"text": "CreditKarma.com", "correct": false}, {"text": "Experian.com/free", "correct": false}, {"text": "AnnualCreditReport.com", "correct": true}, {"text": "FICO.com/free", "correct": false}], "feedback": "O AnnualCreditReport.com é o único site autorizado pelo governo federal para credit reports gratuitos. Você tem direito a pelo menos um relatório gratuito a cada 12 meses em cada um dos três grandes bureaus."}, {"prompt": "Qual é um primeiro passo recomendado para quem não tem histórico de crédito nos Estados Unidos?", "options": [{"text": "Pedir de imediato um cartão premium sem garantia", "correct": false}, {"text": "Abrir um secured credit card e pagar o saldo integral todo mês", "correct": true}, {"text": "Fazer um empréstimo pessoal de valor alto para mostrar capacidade de pagamento", "correct": false}, {"text": "Esperar dois anos antes de pedir qualquer crédito", "correct": false}], "feedback": "O secured credit card é um ponto de partida comum para construir histórico nos Estados Unidos. Ele exige um depósito, é acessível para quem não tem histórico e informa os pagamentos aos bureaus."}, {"prompt": "O que acontece com seu credit score quando você fecha uma conta de cartão antiga?", "options": [{"text": "A pontuação sempre melhora, porque você passa a ter menos contas", "correct": false}, {"text": "A pontuação pode cair, porque o crédito disponível diminui e isso pode aumentar sua credit utilization", "correct": true}, {"text": "A pontuação não muda, porque só o histórico de pagamentos conta", "correct": false}, {"text": "A pontuação melhora, porque os credores preferem menos contas abertas", "correct": false}], "feedback": "Fechar um cartão antigo reduz o limite total disponível, o que pode aumentar sua credit utilization e derrubar a pontuação. O efeito final depende do restante do seu perfil de crédito."}, {"prompt": "Qual destas ações NÃO afeta seu credit score?", "options": [{"text": "Perder o pagamento de um cartão de crédito", "correct": false}, {"text": "Pedir um cartão de crédito novo", "correct": false}, {"text": "Consultar seu próprio credit score", "correct": true}, {"text": "Manter saldo alto no cartão de crédito", "correct": false}], "feedback": "Consultar o próprio credit score é uma soft inquiry e não afeta a pontuação. Já as hard inquiries feitas por credores e os pagamentos perdidos afetam."}, {"prompt": "O que é um credit freeze?", "options": [{"text": "Uma redução temporária do seu limite imposta pelo emissor", "correct": false}, {"text": "Uma restrição que você coloca no seu cadastro para impedir a abertura de contas novas sem autorização", "correct": true}, {"text": "Um bloqueio judicial colocado no seu crédito quando você entra com pedido de falência", "correct": false}, {"text": "Uma pausa na cobrança de juros oferecida por credores em momentos de dificuldade financeira", "correct": false}], "feedback": "O credit freeze é uma restrição que você mesmo coloca no seu cadastro e que impede novos credores de acessarem seu relatório sem permissão. É uma das ferramentas mais eficazes contra roubo de identidade."}, {"prompt": "O que significa dizer que um credor fez o charge-off de uma dívida?", "options": [{"text": "O credor perdoou a dívida e você não deve mais nada", "correct": false}, {"text": "O credor baixou a dívida como prejuízo; a cobrança pode continuar e o registro permanece no relatório", "correct": true}, {"text": "O credor transferiu a dívida para um órgão do governo", "correct": false}, {"text": "O credor aceitou um valor menor como acordo", "correct": false}], "feedback": "O charge-off significa que o credor baixou a dívida como prejuízo na contabilidade dele, mas você continua devendo. O registro permanece no credit report por até sete anos e pode prejudicar bastante sua pontuação."}, {"prompt": "Pela lei federal, com que frequência mínima você tem direito a um credit report gratuito em cada um dos três grandes bureaus?", "options": [{"text": "Uma vez a cada três anos por bureau", "correct": false}, {"text": "Uma vez por ano por bureau", "correct": true}, {"text": "Duas vezes por ano por bureau", "correct": false}, {"text": "Sempre que solicitar, sem custo", "correct": false}], "feedback": "A lei federal garante no mínimo um relatório gratuito a cada 12 meses em cada um dos três grandes bureaus. Na prática, Equifax, Experian e TransUnion oferecem hoje relatórios gratuitos toda semana pelo AnnualCreditReport.com."}, {"prompt": "Qual opção descreve melhor a relação entre o tempo de histórico de crédito e sua pontuação?", "options": [{"text": "Histórico mais longo sempre resulta em pontuação maior, independentemente dos outros fatores", "correct": false}, {"text": "O tempo de histórico não tem efeito relevante na pontuação", "correct": false}, {"text": "Um histórico mais longo em geral ajuda, porque dá aos credores mais dados para avaliar sua confiabilidade", "correct": true}, {"text": "O tempo de histórico só importa em financiamento imobiliário, não no crédito do dia a dia", "correct": false}], "feedback": "O tempo de histórico de crédito responde por 15% do FICO Score. Um histórico mais longo costuma ajudar porque fornece mais dados sobre seu comportamento financeiro ao longo do tempo."}], "quizIntro": "Responda às 15 questões a seguir para testar seu entendimento sobre o sistema de crédito americano. Escolha a melhor resposta para cada uma.", "summary": [{"type": "p", "text": "Neste módulo, você aprendeu:"}, {"type": "ul", "items": ["O que é crédito e por que ele importa nos Estados Unidos para alugar, financiar e tocar a vida financeira do dia a dia;", "Como os três grandes bureaus, Equifax, Experian e TransUnion, coletam e informam seus dados de crédito;", "Como os credit scores são calculados a partir de cinco categorias: histórico de pagamentos, valores devidos (incluindo credit utilization), tempo de histórico, variedade de tipos de crédito e consultas novas;", "O que as faixas do FICO Score significam na prática e como os credores as interpretam;", "Como começar a formar histórico de crédito nos Estados Unidos com secured cards, credit-builder loans, status de authorized user e informação de aluguel;", "Como revisar seu credit report, identificar erros e se proteger contra fraude;", "Enganos comuns sobre o sistema de crédito americano e a visão mais precisa de cada um;", "Os principais termos de crédito usados no sistema financeiro americano."]}], "reflection": ["Qual foi sua maior descoberta sobre como funciona o sistema de crédito americano? Teve algo que te surpreendeu ou que você entendia de forma diferente?", "Qual é um hábito de crédito que você quer construir ou mudar a partir do que aprendeu neste módulo? Seja o mais específico possível.", "Qual dúvida sobre credit score ou histórico de crédito ainda ficou e você quer investigar mais?"], "actionTask": {"title": "Confira sua situação de crédito nos Estados Unidos nesta semana", "steps": ["Consulte seu credit report pelo AnnualCreditReport.com, a única fonte autorizada pelo governo federal para relatórios gratuitos, e anote quais fatores do seu perfil você ainda precisa entender melhor.", "Se você já tem contas, revise se as informações estão corretas. Se ainda não tem histórico de crédito, escolha uma opção realista da Lição 5 que caiba na sua situação atual.", "Escreva um hábito de crédito específico que você quer praticar de forma consistente nos próximos 30 dias."]}, "disclaimer": "Este módulo é educacional e foi feito para ajudar você a entender como funciona o sistema de crédito americano. Ele não constitui aconselhamento jurídico, financeiro, de investimento ou de reparação de crédito. Para orientação sobre a sua situação específica, consulte um profissional qualificado.", "practiceIntro": "", "taskPurpose": "", "taskInstruction": "Faça os três passos a seguir antes do fim da semana:"}, "2": {"n": 2, "title": "Uso e comportamento com cartão de crédito", "subtitle": "Ciclos de fatura, credit utilization, APR e tarifas, momento do pagamento e como usar o cartão sem deixar o hábito comandar suas finanças.", "meta": "10 Lições · 15 Questões · 1 Tarefa prática · Tempo estimado: 35 minutos · Nível: Fundamentos", "overview": [{"type": "p", "text": "O cartão de crédito é uma das ferramentas financeiras mais comuns nos Estados Unidos. Usado com atenção, traz praticidade, ajuda a formar e manter histórico de crédito e dá flexibilidade para administrar despesas do dia a dia. Usado sem entendimento claro de como funciona, também gera juros desnecessários, tarifas e estresse financeiro de longo prazo."}, {"type": "p", "text": "Este módulo explica como o cartão de crédito funciona na prática, incluindo a relação entre ciclo de fatura e data de vencimento, como a credit utilization é calculada, qual a diferença entre APR e tarifas, e como o momento do pagamento afeta tanto suas finanças quanto seu perfil de crédito."}, {"type": "p", "text": "O objetivo é entender o funcionamento do cartão bem o bastante para decidir de forma intencional quando e como usá-lo."}, {"type": "callout", "label": "Objetivo de aprendizagem", "text": "Ao final deste módulo, você vai entender como funciona uma conta de cartão de crédito, como saldos e pagamentos são informados, como juros e tarifas afetam o custo de usar crédito e quais comportamentos do dia a dia ajudam a usar o cartão de forma responsável."}], "lessons": [{"n": 1, "title": "Como o cartão de crédito funciona", "blocks": [{"type": "p", "text": "O cartão de crédito é uma forma de crédito rotativo que permite fazer compras com dinheiro do emissor, com o compromisso de devolver o que foi usado. Diferente do cartão de débito, que em geral retira o dinheiro direto da sua conta, o cartão de crédito cria um saldo pelo qual você é responsável."}, {"type": "p", "text": "Quando você usa um cartão de crédito, uma sequência de coisas acontece:"}, {"type": "ul", "items": ["Você faz uma compra com o cartão.", "A compra é somada ao seu saldo em aberto.", "O emissor acompanha suas transações durante um período de faturamento.", "No fim desse período, o emissor gera uma fatura.", "Você recebe um pagamento mínimo e uma data de vencimento.", "Em geral você pode pagar o saldo integral da fatura, pagar parte dele ou, em certas situações, pagar só o mínimo."]}, {"type": "callout", "label": "Ponto-chave", "text": "O cartão de crédito não aumenta sua renda. Ele dá acesso a dinheiro emprestado que precisará ser devolvido. O hábito mais importante é enxergar a compra no cartão como dinheiro que você vai ter de pagar, e não como dinheiro que você ganhou ou recebeu."}]}, {"n": 2, "title": "Ciclos de fatura e extratos", "blocks": [{"type": "p", "text": "Os emissores organizam as transações em ciclos de faturamento, também chamados de ciclos de fatura. O billing cycle é o período em que compras, pagamentos, créditos e outras movimentações da conta são registrados. No fim do ciclo, o emissor gera uma fatura mostrando informações como:"}, {"type": "ul", "items": ["Compras e outras transações;", "Pagamentos e créditos;", "O saldo da fatura;", "O pagamento mínimo devido;", "A data de vencimento;", "Juros e tarifas aplicáveis."]}, {"type": "p", "text": "Saldo da fatura e saldo atual O saldo da fatura é, em geral, o valor devido no momento em que o ciclo fecha. O saldo atual pode incluir transações feitas depois desse fechamento."}, {"type": "p", "text": "Exemplo: sua fatura fecha em 20 de junho com saldo de US$ 600. Depois disso, em 23 de junho, você faz outra compra de US$ 100. O saldo da fatura continua em US$ 600, enquanto o saldo atual pode mostrar US$ 700."}, {"type": "callout", "label": "Ponto-chave", "text": "Entender a diferença entre o saldo da fatura e o saldo atual torna o pagamento do cartão bem mais fácil de administrar."}]}, {"n": 3, "title": "Vencimento, pagamento mínimo e grace period", "blocks": [{"type": "p", "text": "Toda fatura de cartão traz uma data de vencimento. O pagamento mínimo é o menor valor que o emissor exige até o vencimento para que a conta não entre em atraso, conforme as condições do contrato."}, {"type": "p", "text": "Pagar só o mínimo mantém a conta em dia, mas pode fazer o saldo permanecer em aberto por mais tempo e gerar um custo alto de juros."}, {"type": "p", "text": "Saldo da fatura: US$ 1.000. Pagamento mínimo: US$ 40. Vencimento: 15 de julho. Pagar US$ 40 cumpre a exigência do mínimo, mas o saldo restante pode continuar acumulando juros conforme as condições da conta.", "lead": "Exemplo"}, {"type": "p", "text": "O custo de pagar só o mínimo pode ser estimado. A tabela abaixo supõe que o saldo da fatura siga em US$ 1.000, que o APR seja de 24%, que nenhuma compra nova entre e que o mesmo valor seja pago todo mês. Ela serve para mostrar a ordem de grandeza, não para reproduzir o cálculo exato de um cartão específico."}, {"type": "table", "head": ["Pago por mês", "Meses até zerar", "Juros somados", "Total pago"], "rows": [["US$ 40", "~36", "~US$ 400", "~US$ 1.400"], ["US$ 100", "12", "~US$ 127", "~US$ 1.127"], ["US$ 1.000, integral", "1", "Nenhum, quando há grace period", "US$ 1.000"]]}, {"type": "p", "text": "Neste exemplo, US$ 1.000 em compras custam cerca de US$ 1.400 quando são pagos a US$ 40 por mês. Muitos emissores não usam um mínimo fixo. Eles calculam o mínimo como um percentual pequeno do saldo somado aos juros do período, então o valor exigido cai conforme o saldo cai, o que alonga ainda mais o prazo até zerar."}, {"type": "callout", "label": "Nota importante", "text": "São estimativas educacionais. Os juros reais dependem das condições do seu cartão, do saldo diário ou médio, da forma de capitalização, das novas transações e dos pagamentos feitos no período."}, {"type": "p", "text": "A maioria dos cartões oferece um grace period, o intervalo entre o fechamento da fatura e o vencimento em que você pode pagar o saldo integral sem juros sobre compras novas. Em geral ele vale apenas quando o saldo anterior foi pago por completo, e normalmente não se aplica a saques (cash advances). Se a sua conta oferece esse período, e sob quais condições, está no contrato.", "lead": "Nota educacional: o que é o grace period"}, {"type": "callout", "label": "Ponto-chave", "text": "O pagamento mínimo é uma exigência, não uma meta de gasto recomendada."}]}, {"n": 4, "title": "APR e o custo de carregar saldo", "blocks": [{"type": "p", "text": "APR, ou Annual Percentage Rate, representa o custo anualizado de tomar emprestado segundo as condições da conta de crédito. O APR de cartão costuma ser alto em comparação com outras formas de empréstimo. Se você leva saldo de um ciclo para outro, os juros podem aumentar bastante o custo das suas compras."}, {"type": "p", "text": "APR e tarifas são coisas diferentes O APR se refere ao custo de tomar emprestado, expresso como taxa anual. Tarifas são cobranças específicas previstas nas condições da conta. Exemplos de tarifas:"}, {"type": "ul", "items": ["Anuidade;", "Tarifa por atraso no pagamento;", "Tarifa de transferência de saldo;", "Tarifa de saque;", "Tarifa de transação internacional."]}, {"type": "callout", "label": "Ponto-chave", "text": "Um cartão com anuidade baixa não é necessariamente barato se você carrega saldo com frequência a um APR alto. Um cartão com anuidade também não é automaticamente uma má escolha; o que decide é como você usa a conta."}]}, {"n": 5, "title": "Credit utilization e por que ela importa", "blocks": [{"type": "p", "text": "Credit utilization é quanto do crédito rotativo você está usando em relação aos limites disponíveis."}, {"type": "p", "text": "Exemplo: limite de US$ 5.000; saldo reportado de US$ 1.000; utilização de 20%. A conta é US$ 1.000 dividido por US$ 5.000, que dá 20%."}, {"type": "p", "text": "A credit utilization faz parte da categoria de valores devidos usada no FICO, que responde por cerca de 30% da pontuação. Saldo alto em relação ao limite disponível pode indicar maior dependência de crédito rotativo e afetar negativamente seu credit score."}, {"type": "callout", "label": "Nota educacional", "text": "O saldo do seu cartão muda ao longo do mês. O saldo informado aos bureaus costuma ser o da data de fechamento da fatura, que pode ser diferente do que você vê logo depois de pagar. Manter a utilização reportada abaixo de cerca de 30% é uma orientação citada com frequência por educadores financeiros; é uma referência geral, não uma regra fixada em lei."}, {"type": "callout", "label": "Ponto-chave", "text": "Usar cartão de crédito não prejudica automaticamente seu crédito. O que pesa é a relação entre seus saldos e o crédito disponível, junto com o restante do seu comportamento de crédito."}]}, {"n": 6, "title": "Momento do pagamento e data de fechamento", "blocks": [{"type": "p", "text": "Muita gente acha que a única data importante do cartão é o vencimento. Duas datas merecem atenção."}, {"type": "p", "text": "É quando o ciclo termina e o saldo da fatura é, em geral, definido. Esse costuma ser também o saldo informado aos credit bureaus.", "lead": "Data de fechamento da fatura"}, {"type": "p", "text": "É o prazo final para fazer o pagamento exigido.", "lead": "Data de vencimento"}, {"type": "p", "text": "Exemplo: a fatura fecha em 10 de agosto e vence em 5 de setembro. Compras feitas antes de 10 de agosto podem entrar nessa fatura, enquanto compras feitas depois do fechamento podem aparecer na fatura seguinte."}, {"type": "callout", "label": "Ponto-chave", "text": "Você não precisa pagar o cartão antes de cada compra. O objetivo é entender seu ciclo de faturamento e manter uma rotina de pagamento que evite atrasos e juros desnecessários."}]}, {"n": 7, "title": "Usar o cartão sem criar dívida", "blocks": [{"type": "p", "text": "O cartão fica difícil de administrar quando a decisão de gastar se separa da capacidade de pagar. Um roteiro útil é fazer três perguntas antes de uma compra relevante."}, {"type": "ol", "items": ["Consigo pagar esta compra? Avalie se a despesa cabe nos recursos que você tem.", "Quando vou pagar? Saiba se pretende quitar a compra integralmente ou carregar saldo.", "Quanto isso vai custar de verdade? Se for carregar o saldo, considere os juros e os demais custos aplicáveis."]}, {"type": "p", "text": "Sinais de alerta comuns"}, {"type": "ul", "items": ["Pagar só o mínimo com frequência;", "Usar um cartão para pagar outra dívida;", "Chegar perto do limite de forma recorrente;", "Depender do cartão para despesas rotineiras que você não conseguiria pagar de outro jeito;", "Evitar olhar o saldo ou a fatura;", "Acumular saldo mais rápido do que consegue pagar."]}, {"type": "callout", "label": "Ponto-chave", "text": "O problema não é usar crédito. O problema é o uso do crédito se desconectar da sua capacidade de pagar."}]}, {"n": 8, "title": "Tarifas comuns do cartão e como evitá-las", "blocks": [{"type": "p", "text": "A tarifa por atraso pode ser aplicada quando o pagamento exigido não é feito até o vencimento. Um atraso suficientemente longo também pode ser informado aos credit bureaus e prejudicar seu histórico.", "lead": "Tarifa por atraso"}, {"type": "p", "text": "Alguns cartões cobram uma taxa anual apenas pela manutenção da conta. Um cartão com anuidade ainda pode valer a pena se os benefícios justificarem o custo.", "lead": "Anuidade"}, {"type": "p", "text": "Alguns cartões cobram por transações processadas fora dos Estados Unidos ou em moeda estrangeira. Conhecer as condições antes de viajar evita custos inesperados.", "lead": "Tarifa de transação internacional"}, {"type": "p", "text": "Usar o cartão para obter dinheiro em espécie pode envolver tarifas e condições de juros diferentes das compras comuns, e o saque em geral não conta com o grace period.", "lead": "Tarifa de saque"}, {"type": "callout", "label": "Ponto-chave", "text": "As tarifas fazem parte do preço de um produto financeiro. Ler as condições da conta antes de usar o cartão ajuda a entender o que você está pagando de fato."}]}, {"n": 9, "title": "Hábitos de cartão que sustentam a saúde financeira", "blocks": [{"type": "p", "text": "O uso responsável do cartão costuma vir da consistência, não de estratégias complicadas. Entre os hábitos que ajudam:"}, {"type": "p", "text": "Pague em dia Programe lembretes ou pagamento automático para não perder um vencimento sem querer."}, {"type": "p", "text": "Acompanhe o saldo Confira a conta com regularidade em vez de esperar a fatura do mês."}, {"type": "p", "text": "Entenda sua fatura Revise transações, tarifas, juros e o valor devido."}, {"type": "p", "text": "Mantenha a utilização sob controle Evite usar de forma constante uma parcela grande do crédito rotativo disponível."}, {"type": "p", "text": "Evite juros desnecessários Quando couber no orçamento, pagar o saldo integral da fatura ajuda a evitar juros sobre compras nas contas que oferecem grace period."}, {"type": "p", "text": "Revise as condições da conta As regras mudam de cartão para cartão. Conheça o APR, as tarifas, as condições do programa de pontos e os demais termos da sua conta."}, {"type": "callout", "label": "Ponto-chave", "text": "A melhor estratégia de cartão costuma ser simples: gastar com intenção, acompanhar a conta, pagar em dia e entender o custo de tomar emprestado."}]}, {"n": 10, "title": "Enganos comuns sobre cartão de crédito", "blocks": [{"type": "p", "text": "A tabela abaixo compara crenças comuns sobre cartão de crédito com uma visão mais precisa de como ele funciona."}, {"type": "table", "head": ["Engano comum", "Entendimento mais preciso"], "rows": [["Carregar saldo todo mês constrói crédito mais rápido.", "Em geral você não precisa carregar saldo nem pagar juros para construir crédito."], ["Pagar só o mínimo é sempre a melhor estratégia.", "O mínimo mantém a conta em dia, mas pagar mais reduz o custo de juros e o tempo de quitação."], ["Cartão de crédito é basicamente dinheiro de graça.", "O cartão dá acesso a dinheiro emprestado que precisa ser devolvido."], ["Usar cartão prejudica automaticamente seu crédito.", "O uso responsável do cartão pode contribuir para um perfil de crédito saudável."], ["Preciso pagar o saldo logo depois de cada compra.", "Uma rotina de pagamento constante costuma bastar; entender as datas de fechamento e vencimento importa mais."], ["Limite alto significa que posso gastar mais.", "O limite é o teto do emissor, não o seu orçamento pessoal de gastos."], ["APR e anuidade são a mesma coisa.", "O APR se refere ao custo de tomar emprestado; as tarifas são cobranças separadas previstas no contrato."], ["Pontos e benefícios sempre compensam um cartão.", "Os benefícios podem ter valor, mas não devem justificar gasto desnecessário nem custo de juros."]]}, {"type": "callout", "label": "Ponto-chave", "text": "A maior parte dos erros com cartão vem de um punhado de mal-entendidos sobre como saldos, juros e informação ao bureau funcionam de fato. Corrigir isso costuma bastar para mudar o resultado."}]}], "quiz": [{"prompt": "Qual das opções descreve melhor um cartão de crédito?", "options": [{"text": "Uma conta bancária usada só para compras", "correct": false}, {"text": "Uma forma de crédito rotativo que permite tomar dinheiro emprestado e pagar depois", "correct": true}, {"text": "Uma conta poupança com limite de gasto", "correct": false}, {"text": "Um programa de benefício do governo", "correct": false}], "feedback": "O cartão de crédito dá acesso a crédito rotativo. As compras criam um saldo que o titular é responsável por pagar."}, {"prompt": "O que é um billing cycle?", "options": [{"text": "O período em que o cartão fica inativo", "correct": false}, {"text": "O período em que as transações são registradas antes de a fatura ser gerada", "correct": true}, {"text": "O tempo que falta para o cartão expirar", "correct": false}, {"text": "O período em que nunca se pode cobrar juros", "correct": false}], "feedback": "O billing cycle é o período em que a movimentação da conta se acumula antes de o emissor gerar a fatura."}, {"prompt": "O que é o saldo da fatura?", "options": [{"text": "O valor máximo que você pode tomar emprestado", "correct": false}, {"text": "O saldo mostrado na fatura quando o ciclo de faturamento fecha", "correct": true}, {"text": "O valor mínimo que você precisa gastar por mês", "correct": false}, {"text": "Sua renda anual total", "correct": false}], "feedback": "O saldo da fatura reflete o valor informado na fatura daquele ciclo de faturamento."}, {"prompt": "O que é o pagamento mínimo?", "options": [{"text": "O valor que você precisa gastar todo mês", "correct": false}, {"text": "O menor pagamento exigido pelo emissor até o vencimento, conforme as condições da conta", "correct": true}, {"text": "O total de juros cobrados", "correct": false}, {"text": "Seu limite de crédito disponível", "correct": false}], "feedback": "O pagamento mínimo é o valor mínimo exigido. Pagar só o mínimo deixa saldo em aberto e pode gerar custo adicional de juros."}, {"prompt": "O que o APR mede?", "options": [{"text": "Sua renda anual", "correct": false}, {"text": "Seu limite de crédito", "correct": false}, {"text": "O custo anualizado de tomar emprestado segundo as condições aplicáveis", "correct": true}, {"text": "O percentual do limite que você já usou", "correct": false}], "feedback": "APR, ou Annual Percentage Rate, expressa o custo anualizado de tomar emprestado conforme as condições da conta."}, {"prompt": "O que é credit utilization?", "options": [{"text": "A quantidade de cartões que você tem", "correct": false}, {"text": "A relação entre os saldos do crédito rotativo e os limites disponíveis", "correct": true}, {"text": "A taxa de juros do seu cartão", "correct": false}, {"text": "A quantidade de compras que você faz por mês", "correct": false}], "feedback": "A credit utilization mede quanto do crédito rotativo você está usando em relação ao crédito disponível para você."}, {"prompt": "Se seu limite é de US$ 5.000 e o saldo reportado é de US$ 1.000, qual é sua credit utilization?", "options": [{"text": "5%", "correct": false}, {"text": "10%", "correct": false}, {"text": "20%", "correct": true}, {"text": "50%", "correct": false}], "feedback": "US$ 1.000 dividido por US$ 5.000 dá 20%. O saldo reportado representa 20% do limite disponível."}, {"prompt": "Qual data costuma determinar o saldo informado aos credit bureaus?", "options": [{"text": "A data de vencimento", "correct": false}, {"text": "A data de fechamento da fatura", "correct": true}, {"text": "A data de expiração do cartão", "correct": false}, {"text": "A data em que seu credit score é calculado", "correct": false}], "feedback": "A data de fechamento marca o fim do ciclo de faturamento e é usada para gerar a fatura daquele período."}, {"prompt": "Qual afirmação sobre carregar saldo está correta?", "options": [{"text": "Você precisa carregar saldo para construir crédito", "correct": false}, {"text": "Em geral você não precisa carregar saldo nem pagar juros para construir crédito", "correct": true}, {"text": "Carregar saldo maior sempre melhora seu credit score", "correct": false}, {"text": "Carregar saldo elimina todas as tarifas do cartão", "correct": false}], "feedback": "Em geral não é preciso carregar saldo nem pagar juros para demonstrar comportamento de crédito responsável."}, {"prompt": "O que pode acontecer quando seu saldo fica alto em relação ao limite?", "options": [{"text": "Seu limite aumenta automaticamente", "correct": false}, {"text": "Sua credit utilization pode subir e afetar negativamente seu credit score", "correct": true}, {"text": "Seu APR cai automaticamente", "correct": false}, {"text": "Seu cartão de crédito vira um cartão de débito", "correct": false}], "feedback": "Utilização alta pode afetar negativamente a pontuação. Acompanhar os saldos em relação ao crédito disponível é, por isso, um hábito importante."}, {"prompt": "Qual destas é uma tarifa cobrada por alguns emissores apenas pela manutenção da conta?", "options": [{"text": "Credit utilization", "correct": false}, {"text": "Saldo da fatura", "correct": false}, {"text": "Anuidade", "correct": true}, {"text": "Limite de crédito", "correct": false}], "feedback": "A anuidade é uma cobrança feita por alguns emissores pela manutenção da conta."}, {"prompt": "Qual é uma consequência de pagar apenas o mínimo?", "options": [{"text": "Reduz automaticamente seu limite de crédito", "correct": false}, {"text": "Pode deixar um saldo em aberto que continua gerando juros", "correct": true}, {"text": "Cancela os pontos do seu cartão", "correct": false}, {"text": "Impede a empresa de informar sua conta aos bureaus", "correct": false}], "feedback": "Pagar só o mínimo mantém a conta em dia, mas o saldo restante continua e pode gerar juros adicionais conforme as condições da conta."}, {"prompt": "Qual hábito reduz de forma mais direta o risco de perder um pagamento?", "options": [{"text": "Aumentar seu limite de crédito", "correct": false}, {"text": "Programar lembretes ou pagamento automático", "correct": true}, {"text": "Abrir vários cartões novos", "correct": false}, {"text": "Ignorar as faturas mensais", "correct": false}], "feedback": "Lembretes de pagamento e débito automático ajudam a reduzir o risco de perder uma data de vencimento sem querer."}, {"prompt": "O que representa o limite de crédito?", "options": [{"text": "O valor que você tem guardado", "correct": false}, {"text": "O valor máximo que o emissor permite que você use na conta", "correct": true}, {"text": "O valor que você deveria gastar todo mês", "correct": false}, {"text": "O valor de juros que você deve", "correct": false}], "feedback": "O limite representa o máximo de crédito rotativo disponível na conta. Ele não representa o que você consegue pagar."}, {"prompt": "Qual abordagem resume melhor o uso responsável do cartão de crédito?", "options": [{"text": "Usar o máximo possível do crédito disponível", "correct": false}, {"text": "Carregar saldo todo mês para construir crédito", "correct": false}, {"text": "Gastar com intenção, acompanhar a conta, pagar em dia e entender o custo de tomar emprestado", "correct": true}, {"text": "Abrir vários cartões sempre que o saldo aumentar", "correct": false}], "feedback": "O uso responsável combina gasto intencional, acompanhamento constante da conta, pagamentos em dia e entendimento de juros e tarifas."}], "quizIntro": "Responda às 15 questões a seguir para testar seu entendimento sobre uso e comportamento com cartão de crédito. Escolha a melhor resposta para cada uma.", "summary": [{"type": "p", "text": "Neste módulo, você aprendeu:"}, {"type": "ul", "items": ["Como o cartão de crédito funciona como forma de crédito rotativo;", "Como ciclo de faturamento, data de fechamento e data de vencimento se relacionam;", "A diferença entre saldo da fatura, saldo atual e pagamento mínimo;", "O que é o grace period e quando ele se aplica;", "O que significa APR e como os juros aumentam o custo de tomar emprestado;", "Como a credit utilization é calculada e por que ela importa;", "Como o momento do pagamento afeta o saldo informado e a utilização;", "As tarifas mais comuns do cartão e como reconhecer custos desnecessários;", "Hábitos práticos para usar o cartão sem deixar o gasto sair do controle;", "Enganos comuns sobre o uso do cartão e a visão mais precisa de cada um;", "Como revisar uma fatura e identificar um hábito concreto para melhorar."]}], "reflection": ["Qual foi sua maior descoberta sobre como o cartão de crédito funciona de fato? Teve algo sobre saldo da fatura, vencimento, utilização, APR ou tarifas que você entendia de forma diferente?", "Qual é um hábito com cartão que você quer construir ou mudar a partir do que aprendeu? Seja o mais específico possível.", "Qual dúvida ainda ficou sobre custos do cartão, momento do pagamento ou uso responsável?"], "actionTask": {"title": "Revise uma fatura do seu cartão", "steps": ["Revise uma fatura recente do cartão. Identifique a data de fechamento, o saldo da fatura, o pagamento mínimo, a data de vencimento, o APR e eventuais tarifas ou juros cobrados.", "Revise seus gastos recentes. Identifique ao menos uma categoria de compra em que você poderia gastar de forma mais intencional.", "Escolha um hábito com cartão para praticar nos próximos 30 dias. Exemplos: conferir a conta uma vez por semana, programar lembretes de pagamento, pagar o saldo integral quando couber no orçamento, acompanhar sua credit utilization ou revisar a fatura antes das compras do mês seguinte."]}, "disclaimer": "Este módulo é educacional e foi feito para ajudar você a entender como funciona o cartão de crédito e como o comportamento do dia a dia afeta suas finanças. Ele não constitui aconselhamento jurídico, financeiro, de investimento ou de reparação de crédito. Para orientação sobre a sua situação específica, consulte um profissional qualificado.", "practiceIntro": "Para encerrar este módulo, reserve alguns minutos para refletir sobre o que aprendeu antes de fazer a tarefa prática. Não existem respostas certas ou erradas. O objetivo é conectar o conteúdo ao seu próprio comportamento financeiro.", "taskPurpose": "Aplicar o que você aprendeu neste módulo à sua própria situação financeira, por meio de uma ação concreta e de baixo risco nesta semana.", "taskInstruction": "Faça os três passos a seguir antes do fim da semana:"}, "3": {"n": 3, "title": "Orçamento e despesas recorrentes", "subtitle": "Como separar gastos intencionais de gastos habituais, identificar custos recorrentes e se preparar para despesas irregulares antes que elas virem sustos financeiros.", "meta": "10 Lições · 15 Questões · 1 Tarefa prática · Tempo estimado: 35 minutos · Nível: Fundamentos", "overview": [{"type": "p", "text": "Um orçamento é um plano para o dinheiro que você ainda não gastou. É uma forma de entender para onde seu dinheiro vai, separar despesas necessárias das opcionais e decidir os gastos com antecedência, em vez de reconstituí-los no fim do mês."}, {"type": "p", "text": "A maior parte das dificuldades financeiras não vem de uma compra grande fora do normal. Ela se forma com despesas recorrentes, assinaturas automáticas, gastos habituais e custos irregulares que eram previsíveis mas nunca entraram no plano."}, {"type": "p", "text": "Este módulo explica como montar um orçamento prático, como identificar despesas recorrentes e avaliar se elas ainda entregam valor, como distinguir gasto intencional de gasto habitual e como se preparar para despesas irregulares antes que elas cheguem."}, {"type": "callout", "label": "Objetivo de aprendizagem", "text": "Ao final deste módulo, você vai saber organizar renda e despesas em um orçamento prático, identificar custos recorrentes e habituais, separar necessidades de gastos opcionais e prioridades financeiras, e se antecipar às despesas irregulares."}], "lessons": [{"n": 1, "title": "O que é um orçamento", "blocks": [{"type": "p", "text": "O orçamento costuma ser descrito como uma forma de gastar menos. Essa descrição é incompleta. O orçamento é uma ferramenta de decisão: ele diz ao seu dinheiro para onde ir antes de o mês começar, para que o gasto reflita o que você decidiu e não o que aconteceu."}, {"type": "p", "text": "Um orçamento prático contempla seis categorias:"}, {"type": "ul", "items": ["Renda: o dinheiro que de fato entra depois de impostos e descontos em folha, o chamado líquido.", "Despesas fixas: custos que ficam mais ou menos iguais todo mês, como aluguel e seguro.", "Despesas variáveis: custos necessários cujo valor muda, como mercado, contas de consumo e transporte.", "Despesas opcionais: gastos que melhoram o conforto ou o prazer, mas não são obrigatórios.", "Poupança e objetivos: dinheiro separado de propósito, incluindo reserva de emergência e metas específicas.", "Despesas irregulares: custos que não acontecem todo mês, mas são bastante previsíveis, como seguros anuais e manutenção do carro."]}, {"type": "callout", "label": "Ponto-chave", "text": "O orçamento é uma ferramenta de decisão. A função dele é ajudar você a decidir para onde o dinheiro deve ir antes de ele ser gasto."}]}, {"n": 2, "title": "Despesas fixas e variáveis", "blocks": [{"type": "p", "text": "Despesas fixas se mantêm quase constantes de um mês para o outro. Despesas variáveis mudam conforme o uso, a estação do ano ou a escolha. As duas podem ser necessárias e as duas podem ser reduzidas, mas se comportam de forma diferente no orçamento: as fixas são mais fáceis de planejar e mais difíceis de mudar rápido, enquanto as variáveis são mais difíceis de prever e mais fáceis de ajustar."}, {"type": "table", "head": ["Despesas fixas", "Despesas variáveis"], "rows": [["Aluguel ou parcela do financiamento", "Mercado"], ["Prêmios de seguro", "Transporte e combustível"], ["Pagamentos mínimos de dívidas", "Contas de consumo, como luz e água"], ["Certas assinaturas e mensalidades", "Comer fora e lazer"]]}, {"type": "p", "text": "Uma distinção importa mais que os rótulos: fixa não quer dizer necessária. Uma assinatura mensal é despesa fixa porque o valor se repete, mas pode ser totalmente opcional. O aluguel é fixo e necessário. Agrupar as despesas pelo comportamento (fixa ou variável) e pela finalidade (necessária, opcional ou prioridade) dá duas visões úteis do mesmo orçamento."}, {"type": "callout", "label": "Ponto-chave", "text": "Fixa descreve como a despesa se comporta, não o quanto ela é importante. Boa parte das economias mais fáceis vem de despesas fixas que nunca foram necessárias."}]}, {"n": 3, "title": "Despesas recorrentes e a visão anual", "blocks": [{"type": "p", "text": "Despesa recorrente é qualquer custo que se repete com regularidade: mensal, trimestral ou anual. Exemplos comuns são serviços de streaming, academia, prêmios de seguro, planos de celular, assinaturas de software, mensalidades profissionais e pagamentos automáticos configurados uma vez e quase nunca revistos."}, {"type": "p", "text": "É fácil subestimar despesas recorrentes porque elas aparecem em valor mensal. O número do mês parece pequeno; o número do ano é o compromisso real."}, {"type": "table", "head": ["Custo mensal", "Custo anual"], "rows": [["US$ 9,99", "Cerca de US$ 120"], ["US$ 15", "US$ 180"], ["US$ 25", "US$ 300"], ["US$ 50", "US$ 600"], ["US$ 120", "US$ 1.440"]]}, {"type": "p", "text": "Exemplo: três assinaturas de US$ 15, US$ 12 e US$ 9 por mês custam US$ 36 mensais e US$ 432 por ano. Se esse é um bom uso de US$ 432 é uma pergunta legítima, e é uma pergunta diferente de se US$ 36 cabem neste mês."}, {"type": "callout", "label": "Nota educacional", "text": "Um hábito prático é revisar as cobranças recorrentes duas vezes por ano, passando os olhos em um ou dois meses de extratos do banco e do cartão em busca de valores que se repetem. Assinaturas de renovação automática são feitas para continuar sem decisão; a revisão é o que devolve a decisão para você."}, {"type": "callout", "label": "Ponto-chave", "text": "Avalie despesas recorrentes pelo custo anual. Um valor mensal pequeno pode representar um compromisso relevante no ano."}]}, {"n": 4, "title": "Gasto intencional e gasto habitual", "blocks": [{"type": "p", "text": "Dois gastos do mesmo tamanho podem ter significados bem diferentes. O gasto intencional é aquele que você escolheria de novo hoje, porque entrega um valor que você consegue nomear. O gasto habitual continua existindo principalmente porque já existia antes."}, {"type": "table", "head": ["Intencional", "Habitual"], "rows": [["Pedir comida por aplicativo porque você escolheu a praticidade numa noite corrida", "Pedir comida toda sexta-feira sem pensar no custo"], ["Manter uma assinatura que você usa com frequência", "Manter uma assinatura porque cancelar dá trabalho"], ["Pagar mais por um serviço cuja qualidade importa para você", "Pagar por um plano que você escolheu anos atrás e nunca revisou"]]}, {"type": "p", "text": "O objetivo dessa distinção não é eliminar o prazer. É garantir que o gasto reflita uma decisão atual, e não uma decisão antiga."}, {"type": "callout", "label": "Ponto-chave", "text": "Despesa recorrente não é necessariamente despesa ruim. A pergunta é se ela ainda é intencional."}]}, {"n": 5, "title": "Necessidades, desejos e prioridades", "blocks": [{"type": "p", "text": "Os conselhos de orçamento costumam dividir o gasto em necessidades e desejos, tratando um como responsável e o outro como supérfluo. Um roteiro mais útil tem três categorias."}, {"type": "p", "text": "Necessidades Despesas exigidas para manter a vida básica e cumprir obrigações: moradia, contas de consumo, alimentação, transporte para o trabalho, seguro e pagamentos obrigatórios de dívidas."}, {"type": "p", "text": "Desejos Despesas que melhoram a praticidade, o conforto ou o prazer, mas não são essenciais."}, {"type": "p", "text": "Prioridades Despesas que não são estritamente necessárias neste mês, mas importam para seus objetivos: guardar para educação ou desenvolvimento profissional, formar reserva de emergência, pagar dívida mais rápido do que o exigido ou separar dinheiro para uma compra planejada."}, {"type": "p", "text": "A terceira categoria é o que mantém o orçamento realista. Tratar toda despesa não essencial como desejo costuma produzir orçamentos abandonados, porque não sobra espaço para nada que a pessoa realmente valoriza."}, {"type": "callout", "label": "Ponto-chave", "text": "Um orçamento que não tem lugar para suas prioridades é um orçamento que você vai parar de usar."}]}, {"n": 6, "title": "Montando um orçamento mensal", "blocks": [{"type": "p", "text": "Um orçamento que funciona pode ser montado em seis passos."}, {"type": "p", "lead": "Passo 1: identifique a renda líquida mensal", "text": "Use o valor que de fato chega à sua conta depois de impostos e descontos. Se sua renda varia, use uma média recente conservadora."}, {"type": "p", "lead": "Passo 2: liste as despesas fixas recorrentes", "text": "Aluguel, seguro, pagamentos mínimos de dívidas, assinaturas e qualquer outro valor que se repita."}, {"type": "p", "lead": "Passo 3: estime as despesas variáveis", "text": "Mercado, contas de consumo, transporte. Dois ou três meses de extrato dão uma estimativa mais exata que a memória."}, {"type": "p", "lead": "Passo 4: identifique os gastos opcionais", "text": "Defina um valor para eles em vez de deixá-los como o que sobrar, que costuma ser justamente como o gasto opcional cresce."}, {"type": "p", "lead": "Passo 5: destine dinheiro para poupança e objetivos", "text": "Inclua reserva de emergência, prioridades e as parcelas mensais para despesas irregulares, tratadas na Lição 8."}, {"type": "p", "lead": "Passo 6: compare o plano com o gasto real", "text": "No fim do mês, compare o que foi planejado com o que aconteceu. A diferença é a informação."}, {"type": "table", "head": ["Categoria", "Exemplo de plano mensal"], "rows": [["Renda líquida", "US$ 3.600"], ["Despesas fixas", "US$ 1.900"], ["Despesas variáveis", "US$ 800"], ["Opcionais", "US$ 350"], ["Poupança e prioridades", "US$ 400"], ["Reserva para despesas irregulares", "US$ 150"]]}, {"type": "callout", "label": "Nota educacional", "text": "Os valores acima são apenas ilustrativos. O que importa é a estrutura: cada dólar da renda líquida fica atribuído a uma categoria, inclusive o que é poupado ou separado."}, {"type": "callout", "label": "Ponto-chave", "text": "O orçamento funciona quando toda categoria é definida com antecedência, inclusive o gasto opcional e a poupança."}]}, {"n": 7, "title": "Despesas irregulares", "blocks": [{"type": "p", "text": "Despesa irregular é aquela que não acontece todo mês. Ela pode ser previsível mas irregular, sazonal, ou de fato inesperada."}, {"type": "p", "text": "O erro mais comum de orçamento é tratar as duas primeiras como se fossem a terceira. Um seguro anual que chega todo fevereiro não é surpresa; é uma despesa mensal que por acaso é cobrada uma vez por ano."}, {"type": "ul", "items": ["Previsíveis mas irregulares: prêmios anuais de seguro, licenciamento do veículo, mensalidades profissionais, preparação da declaração de imposto.", "Sazonais: gastos de fim de ano, volta às aulas, viagens, contas de energia mais altas no verão ou no inverno.", "Inesperadas: conserto do carro, custos médicos ou odontológicos, reparos em casa, troca de um eletrodoméstico."]}, {"type": "callout", "label": "Ponto-chave", "text": "Irregular nem sempre quer dizer imprevisível. Despesas que você sabe que vêm pertencem ao plano, mesmo que não sejam mensais."}]}, {"n": 8, "title": "Sinking funds e planejamento de despesas", "blocks": [{"type": "p", "text": "O sinking fund é o dinheiro separado aos poucos para uma despesa futura já conhecida. Em vez de pagar US$ 1.200 em um único mês, você separa US$ 100 por mês e paga a despesa com o que já foi acumulado. A conta é o custo anual esperado dividido por doze."}, {"type": "table", "head": ["Despesa", "Custo anual esperado", "Reserva mensal"], "rows": [["Manutenção do carro", "US$ 600", "US$ 50"], ["Prêmio de seguro", "US$ 1.200", "US$ 100"], ["Gastos de fim de ano", "US$ 600", "US$ 50"], ["Mensalidade anual", "US$ 240", "US$ 20"], ["Total", "US$ 2.640", "US$ 220"]]}, {"type": "p", "text": "Duas observações práticas. Primeira, mantenha esse dinheiro separado do gasto do dia a dia, em uma conta própria ou em uma parte claramente identificada de uma conta, para não ser usado sem querer. Segunda, sinking fund não é a mesma coisa que reserva de emergência: o sinking fund é para despesas que você espera, enquanto a reserva de emergência cobre o que você não consegue prever."}, {"type": "callout", "label": "Ponto-chave", "text": "Dividir uma despesa anual conhecida por doze transforma um susto financeiro em uma linha mensal comum."}]}, {"n": 9, "title": "Revisando e ajustando seu orçamento", "blocks": [{"type": "p", "text": "O orçamento não é um documento que se preenche uma vez. O valor dele vem da comparação mensal entre o que você planejou e o que de fato gastou."}, {"type": "table", "head": ["Categoria", "Planejado", "Real"], "rows": [["Mercado", "US$ 400", "US$ 465"], ["Restaurantes e delivery", "US$ 150", "US$ 240"], ["Transporte", "US$ 220", "US$ 195"], ["Assinaturas", "US$ 60", "US$ 84"]]}, {"type": "p", "text": "Depois, faça cinco perguntas:"}, {"type": "ul", "items": ["Onde gastei mais do que esperava, e por quê?", "Quais desses gastos foram intencionais?", "Quais foram habituais?", "Quais despesas recorrentes já não entregam valor suficiente?", "Para quais despesas irregulares eu deveria começar a separar dinheiro?"]}, {"type": "callout", "label": "Ponto-chave", "text": "Orçamento útil é aquele que você revisa e ajusta, não aquele que você cumpre com perfeição."}]}, {"n": 10, "title": "Enganos comuns sobre orçamento", "blocks": [{"type": "p", "text": "A tabela abaixo compara crenças comuns sobre orçamento com um entendimento mais preciso."}, {"type": "p", "lead": "Engano comum e entendimento mais preciso", "text": "Fazer orçamento significa eliminar os gastos opcionais. Na verdade, o orçamento ajuda você a decidir de forma intencional quanto de gasto opcional cabe na sua renda e nas suas prioridades."}, {"type": "table", "head": ["Engano comum", "Entendimento mais preciso"], "rows": [["Despesas pequenas não importam.", "Pequenas despesas recorrentes ficam relevantes quando medidas no ano."], ["Não dá para planejar despesas irregulares.", "Muitas despesas irregulares são previsíveis mesmo não acontecendo todo mês."], ["O orçamento nunca deve mudar.", "O orçamento deve ser revisado e ajustado conforme as circunstâncias mudam."], ["Toda despesa recorrente é necessária.", "Despesas recorrentes devem ser revistas de tempos em tempos para ver se ainda entregam valor."], ["Gastar menos é sempre o objetivo.", "O objetivo é alinhar o gasto à renda e às prioridades."], ["Se sobrou dinheiro no fim do mês, meu orçamento funcionou.", "O orçamento também precisa contemplar poupança, objetivos e despesas irregulares que estão por vir."]]}, {"type": "callout", "label": "Ponto-chave", "text": "A maioria dos orçamentos fracassa por ignorar despesas irregulares ou por não deixar espaço para prioridades. Os dois problemas se resolvem no próprio plano."}]}], "quiz": [{"prompt": "Qual é a função principal de um orçamento?", "options": [{"text": "Eliminar os gastos opcionais", "correct": false}, {"text": "Decidir para onde o dinheiro deve ir antes de ser gasto", "correct": true}, {"text": "Registrar despesas só depois que o mês termina", "correct": false}, {"text": "Aumentar seu limite de crédito", "correct": false}], "feedback": "O orçamento é uma ferramenta de decisão que atribui a renda a categorias com antecedência."}, {"prompt": "Qual das opções descreve melhor uma despesa fixa?", "options": [{"text": "Uma despesa que muda conforme o uso a cada mês", "correct": false}, {"text": "Uma despesa que fica aproximadamente igual de um mês para o outro", "correct": true}, {"text": "Qualquer despesa que seja necessária", "correct": false}, {"text": "Uma despesa que acontece só uma vez por ano", "correct": false}], "feedback": "Despesas fixas se repetem com valor aproximadamente igual, como aluguel ou prêmio de seguro."}, {"prompt": "Qual destas é uma despesa variável?", "options": [{"text": "Aluguel", "correct": false}, {"text": "Mercado", "correct": true}, {"text": "Pagamento mínimo de uma dívida", "correct": false}, {"text": "Uma mensalidade anual cobrada uma vez por ano", "correct": false}], "feedback": "Despesas variáveis mudam de mês para mês conforme uso, estação do ano ou escolha."}, {"prompt": "O que é uma despesa recorrente?", "options": [{"text": "Qualquer despesa acima de US$ 100", "correct": false}, {"text": "Um custo que se repete com regularidade, como mensal ou anual", "correct": true}, {"text": "Uma despesa que acontece só uma vez", "correct": false}, {"text": "Uma cobrança feita pelo emissor do cartão", "correct": false}], "feedback": "Despesas recorrentes se repetem com regularidade e incluem assinaturas, mensalidades e prêmios."}, {"prompt": "Por que é útil avaliar despesas recorrentes pelo custo anual?", "options": [{"text": "Porque custos anuais são sempre menores", "correct": false}, {"text": "Porque o valor mensal pode disfarçar o tamanho do compromisso no ano", "correct": true}, {"text": "Porque a maioria das assinaturas é cobrada anualmente", "correct": false}, {"text": "Porque os credit bureaus informam gastos anuais", "correct": false}], "feedback": "Uma assinatura de US$ 25 por mês representa US$ 300 por ano. A visão anual mostra o compromisso real."}, {"prompt": "O que diferencia um gasto intencional de um gasto habitual?", "options": [{"text": "O valor do gasto", "correct": false}, {"text": "Se você escolheria aquele gasto de novo hoje", "correct": true}, {"text": "Se é pago com cartão ou em dinheiro", "correct": false}, {"text": "Se é fixo ou variável", "correct": false}], "feedback": "O gasto intencional reflete uma decisão atual; o habitual continua principalmente porque já existia."}, {"prompt": "O que é uma despesa opcional?", "options": [{"text": "Uma despesa exigida para atender às necessidades básicas", "correct": false}, {"text": "Gasto que melhora o conforto ou o prazer, mas não é obrigatório", "correct": true}, {"text": "Qualquer despesa paga automaticamente", "correct": false}, {"text": "Um pagamento exigido por um credor", "correct": false}], "feedback": "O gasto opcional não é essencial; o orçamento atribui um valor a ele de forma deliberada."}, {"prompt": "Por que despesas recorrentes pequenas podem ficar relevantes?", "options": [{"text": "Porque aumentam sua credit utilization", "correct": false}, {"text": "Porque se repetem, e o total do ano pode ser alto", "correct": true}, {"text": "Porque são sempre cobradas no mesmo dia", "correct": false}, {"text": "Porque são informadas aos credit bureaus", "correct": false}], "feedback": "A repetição é o que torna valores pequenos relevantes: US$ 36 por mês são US$ 432 por ano."}, {"prompt": "O que é uma despesa irregular?", "options": [{"text": "Uma despesa que nunca se repete", "correct": false}, {"text": "Um custo que não acontece todo mês, como um seguro anual ou a manutenção do carro", "correct": true}, {"text": "Qualquer despesa que você não planejou", "correct": false}, {"text": "Uma despesa paga com cartão de crédito", "correct": false}], "feedback": "Despesas irregulares não acontecem todo mês. Muitas delas ainda assim são previsíveis."}, {"prompt": "Por que despesas irregulares previsíveis podem entrar no orçamento?", "options": [{"text": "Porque costumam ser pequenas", "correct": false}, {"text": "Porque em geral você sabe que elas vêm e consegue estimar o custo", "correct": true}, {"text": "Porque os credores exigem isso", "correct": false}, {"text": "Porque são cobradas todo mês", "correct": false}], "feedback": "Uma despesa que chega todo ano não é surpresa; dá para planejá-la com antecedência."}, {"prompt": "O que é um sinking fund?", "options": [{"text": "Uma conta poupança só para emergências", "correct": false}, {"text": "Dinheiro separado aos poucos para uma despesa futura já conhecida", "correct": true}, {"text": "Um tipo de empréstimo usado para cobrir custos irregulares", "correct": false}, {"text": "Um recurso do cartão que adia pagamentos", "correct": false}], "feedback": "O sinking fund acumula dinheiro para uma despesa que você espera, para que ela não chegue como susto."}, {"prompt": "Se uma despesa anual é de US$ 1.200, quanto você separaria por mês?", "options": [{"text": "US$ 50", "correct": false}, {"text": "US$ 100", "correct": true}, {"text": "US$ 120", "correct": false}, {"text": "US$ 200", "correct": false}], "feedback": "US$ 1.200 divididos por 12 dão US$ 100 por mês."}, {"prompt": "Qual a diferença entre sinking fund e reserva de emergência?", "options": [{"text": "O sinking fund é para despesas que você espera; a reserva de emergência é para o que não dá para prever", "correct": true}, {"text": "O sinking fund é exigido pelos credores", "correct": false}, {"text": "A reserva de emergência só pode ser usada para custos médicos", "correct": false}, {"text": "Não há diferença entre os dois", "correct": false}], "feedback": "Sinking funds são planejados; reservas de emergência cobrem o que não foi planejado."}, {"prompt": "Por que o orçamento deve ser revisado com regularidade?", "options": [{"text": "Porque credores exigem relatórios mensais", "correct": false}, {"text": "Porque comparar o plano com o gasto real mostra o que precisa ser ajustado", "correct": true}, {"text": "Porque orçamentos expiram em 30 dias", "correct": false}, {"text": "Porque o credit score depende disso", "correct": false}], "feedback": "A comparação entre o planejado e o realizado é o que torna o orçamento útil ao longo do tempo."}, {"prompt": "Qual abordagem descreve melhor um bom orçamento?", "options": [{"text": "Gastar o mínimo possível em todas as categorias", "correct": false}, {"text": "Atribuir a renda a categorias com antecedência, incluindo poupança e despesas irregulares, e revisar os resultados", "correct": true}, {"text": "Acompanhar despesas só quando o dinheiro aperta", "correct": false}, {"text": "Concentrar todos os gastos em um único cartão", "correct": false}], "feedback": "Um bom orçamento alinha o gasto à renda e às prioridades, e é revisado e ajustado ao longo do tempo."}], "quizIntro": "Responda às 15 questões a seguir para testar seu entendimento sobre orçamento e despesas recorrentes. Escolha a melhor resposta para cada uma.", "summary": [{"type": "p", "text": "Neste módulo, você aprendeu:"}, {"type": "ul", "items": ["O que é um orçamento e quais são as seis categorias que um orçamento prático contempla;", "A diferença entre despesas fixas e variáveis, e por que fixa não quer dizer necessária;", "Como identificar despesas recorrentes e avaliá-las pelo custo anual;", "Como distinguir gasto intencional de gasto habitual;", "Como necessidades, desejos e prioridades financeiras se diferenciam, e por que as prioridades mantêm o orçamento realista;", "Um método de seis passos para montar o orçamento mensal;", "A diferença entre despesas irregulares previsíveis, custos sazonais e gastos de fato inesperados;", "Como os sinking funds transformam despesas anuais em parcelas mensais, e como eles diferem da reserva de emergência;", "Como comparar o gasto planejado com o real e ajustar o plano;", "Enganos comuns sobre orçamento e a visão mais precisa de cada um."]}], "reflection": ["Qual categoria de despesa mais te surpreendeu quando você pensou no total mensal ou anual dela?", "Qual despesa recorrente do seu orçamento entrega mais valor para você? E qual entrega menos?", "Qual despesa irregular criaria mais estresse financeiro se você tivesse de pagá-la amanhã?"], "actionTask": {"title": "Monte seu mapa de gastos de um mês", "steps": ["Liste suas despesas recorrentes. Anote toda despesa mensal, trimestral ou anual que você tem hoje, com o custo anual de cada uma.", "Identifique uma despesa irregular previsível. Estime o custo anual dela e divida por doze para achar a reserva mensal que ela exigiria.", "Escolha um ajuste de gasto para os próximos 30 dias. Pode ser cancelar uma assinatura sem uso, reduzir um gasto habitual, começar um sinking fund, definir um limite para uma categoria opcional ou direcionar dinheiro para uma prioridade financeira."]}, "disclaimer": "Este módulo é educacional e foi feito para ajudar você a entender como funcionam orçamento e despesas recorrentes. Ele não constitui aconselhamento jurídico, financeiro, de investimento ou de reparação de crédito. Para orientação sobre a sua situação específica, consulte um profissional qualificado.", "practiceIntro": "Para encerrar este módulo, reserve alguns minutos para refletir sobre o que aprendeu antes de fazer a tarefa prática. Não existem respostas certas ou erradas. O objetivo é conectar o conteúdo à sua própria situação financeira.", "taskPurpose": "Aplicar o que você aprendeu neste módulo à sua própria situação financeira, por meio de uma ação concreta e de baixo risco nesta semana.", "taskInstruction": "Faça os três passos a seguir antes do fim da semana:"}, "4": {"n": 4, "title": "Entendendo tarifas e juros", "subtitle": "Multas por atraso, tarifas de saldo negativo, assinaturas desnecessárias e o preço real de carregar saldo de um mês para o outro.", "meta": "9 Lições · 12 Questões · 1 Tarefa prática · Tempo estimado: 30 minutos · Nível: Intermediário", "overview": [{"type": "p", "text": "Tarifas e juros passam despercebidos porque costumam aparecer depois que a decisão financeira já foi tomada. Uma parcela mensal parece confortável enquanto os juros se acumulam no plano de fundo. Uma conta bancária parece gratuita até que um saldo negativo, um saque em caixa de outra rede ou uma tarifa de manutenção seja acionado. Uma assinatura parece barata até que o valor mensal seja visto como compromisso anual."}, {"type": "p", "text": "Este módulo explica como funcionam as tarifas e os juros mais comuns em cartões, contas bancárias, empréstimos e serviços recorrentes. O foco é o custo total: o que dispara uma cobrança, como o custo de tomar emprestado se acumula no tempo e quais comportamentos do dia a dia reduzem gastos desnecessários."}, {"type": "callout", "label": "Objetivo de aprendizagem", "text": "Identificar as tarifas e os juros mais comuns do sistema financeiro americano e entender como evitar custos desnecessários."}], "lessons": [{"n": 1, "title": "Tarifas e juros são custos diferentes", "blocks": [{"type": "p", "text": "Um produto financeiro pode custar dinheiro de mais de uma forma. Dois dos custos mais comuns são as tarifas e os juros, e entender a diferença facilita comparar contas e decisões de crédito."}, {"type": "p", "lead": "Tarifas", "text": "são cobranças específicas disparadas por um recurso da conta, uma transação, um serviço ou um comportamento. Exemplos: anuidade, tarifa de saldo negativo, tarifa de saque em caixa de outra rede, tarifa de abertura de empréstimo ou multa por atraso."}, {"type": "p", "lead": "Juros", "text": "são o custo de usar dinheiro emprestado ao longo do tempo. Costumam ser expressos como taxa, por exemplo o APR, e o valor que você paga depende do saldo, da taxa, do tempo em que o saldo fica em aberto e do método de cálculo do produto."}, {"type": "table", "head": ["Custo", "Como funciona", "Exemplos"], "rows": [["Tarifa", "Cobrança específica prevista nas condições do produto", "Anuidade; multa por atraso; tarifa de saque; tarifa de abertura"], ["Juros", "Custo que corre sobre o dinheiro emprestado ao longo do tempo", "Juros de cartão; juros de empréstimo pessoal; juros de financiamento de veículo"]]}, {"type": "callout", "label": "Ponto-chave", "text": "O preço anunciado de um produto financeiro nem sempre é o custo total dele. Taxas, tarifas, prazos e o seu próprio comportamento influenciam o que você acaba pagando."}]}, {"n": 2, "title": "APR e como os juros se acumulam", "bloc
